<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vertex Casino | الكازينو الأول</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg-dark: #0f0a05; 
            --primary: #f97316; /* البرتقالي */
            --accent: #fbbf24; /* الذهبي */
            --nav-bg: rgba(20, 15, 10, 0.98); 
        }
        
        body { 
            background-color: var(--bg-dark); 
            font-family: 'Cairo', sans-serif; 
            color: #ffffff; 
            background: radial-gradient(circle at 50% 0%, rgba(249, 115, 22, 0.15) 0%, transparent 50%), #0f0a05; 
            min-height: 100vh; 
        }

        .glass-panel { 
            background: rgba(30, 20, 10, 0.6); 
            backdrop-filter: blur(25px); 
            border: 1px solid rgba(249, 115, 22, 0.1); 
        }

        .bottom-nav { 
            background: var(--nav-bg); 
            backdrop-filter: blur(20px); 
            border-top: 1px solid rgba(249, 115, 22, 0.2); 
            height: 85px; 
            position: fixed; 
            bottom: 0; left: 0; right: 0; 
            display: flex; justify-content: space-around; align-items: center; 
            z-index: 1000; 
            padding-bottom: 15px; 
        }

        .play-fab { 
            width: 68px; height: 68px; 
            background: linear-gradient(135deg, #f97316 0%, #ea580c 100%); 
            border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            position: relative; 
            top: -28px; 
            box-shadow: 0 12px 30px rgba(249, 115, 22, 0.5); 
            border: 6px solid #0f0a05; 
        }

        .nav-item { 
            flex: 1; display: flex; flex-direction: column; align-items: center; 
            color: #71717a; text-decoration: none; font-size: 10px; font-weight: 700; 
            transition: 0.3s; 
        }

        .nav-item i { font-size: 20px; margin-bottom: 4px; }
        .nav-item.active { color: var(--primary); }

        .text-gradient-orange {
            background: linear-gradient(to right, #fbbf24, #f97316);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .game-card {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(249, 115, 22, 0.1);
            transition: 0.3s;
        }
        
        .game-card:active { transform: scale(0.95); }

        .jackpot-glow {
            text-shadow: 0 0 15px rgba(249, 115, 22, 0.8);
        }
    </style>
</head>
<body class="pb-32">

    <nav class="flex justify-between items-center p-6 sticky top-0 z-50 bg-[#0f0a05]/90 backdrop-blur-md border-b border-orange-500/10">
        <div class="text-xl font-black italic tracking-tighter text-orange-500">
            VERTEX<span class="text-white">CASINO</span>
        </div>
        <div class="flex gap-3">
            <button class="w-10 h-10 rounded-xl bg-orange-500/10 flex items-center justify-center text-orange-500 border border-orange-500/20">
                <i class="fa-solid fa-trophy"></i>
            </button>
            <button class="w-10 h-10 rounded-xl bg-orange-500/10 flex items-center justify-center text-orange-500 border border-orange-500/20">
                <i class="fa-solid fa-gift"></i>
            </button>
        </div>
    </nav>

    <main class="px-6">
        
        <section class="pt-6 pb-8">
            <div class="relative w-full h-56 rounded-[2.5rem] overflow-hidden mb-8 border border-orange-500/20">
                <img src="https://images.unsplash.com/photo-1596838132731-3301c3fd4317?auto=format&fit=crop&q=80&w=800" class="w-full h-full object-cover opacity-70" alt="Casino Background">
                <div class="absolute inset-0 bg-gradient-to-t from-[#0f0a05] via-transparent to-transparent"></div>
                <div class="absolute bottom-6 right-6 text-right">
                    <span class="bg-orange-600 text-[10px] font-black uppercase px-2 py-1 rounded mb-2 inline-block tracking-widest">عرض خاص</span>
                    <h1 class="text-3xl font-black uppercase leading-none">مكافأة ترحيبية <br><span class="text-gradient-orange">200% إضافية</span></h1>
                </div>
            </div>
        </section>

        <div class="glass-panel p-8 rounded-[2.5rem] mb-8 relative overflow-hidden">
            <div class="flex justify-between items-start mb-8">
                <div class="text-right">
                    <p class="text-[10px] text-zinc-500 uppercase font-black tracking-widest mb-1">رصيدك الحالي</p>
                    <h2 class="text-4xl font-black text-white tracking-tighter jackpot-glow">$2,450<span class="text-xl text-zinc-500">.00</span></h2>
                    <p class="text-orange-400 text-[10px] font-bold mt-1"><i class="fas fa-coins mr-1"></i> +500 نقطة ولاء</p>
                </div>
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-orange-500 to-yellow-600 flex items-center justify-center shadow-lg shadow-orange-500/30">
                    <i class="fas fa-chips-caption text-white text-xl"></i>
                    <i class="fa-solid fa-clover text-white text-xl"></i>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4 mb-8">
                <button class="py-4 rounded-2xl bg-orange-600 font-black uppercase text-[12px] tracking-widest shadow-lg shadow-orange-900/40">إيداع سريع</button>
                <button class="py-4 rounded-2xl bg-zinc-800 border border-zinc-700 font-black uppercase text-[12px] tracking-widest">سحب الأرباح</button>
            </div>
        </div>

        <div class="space-y-6 mb-10">
            <div class="flex justify-between items-center px-2">
                <h3 class="text-[12px] font-black text-zinc-400 uppercase tracking-widest">الألعاب المختارة</h3>
                <span class="text-orange-500 text-[10px] font-bold">عرض الكل</span>
            </div>
            
            <div class="grid grid-cols-2 gap-4">
                <div class="game-card">
                    <img src="https://images.unsplash.com/photo-1511193311914-0346f16efe90?auto=format&fit=crop&q=80&w=400" class="w-full h-32 object-cover" alt="Poker">
                    <div class="p-3">
                        <p class="text-[10px] font-black">بلاك جاك مباشر</p>
                        <p class="text-orange-500 text-[9px] font-bold">ربح حتى 50x</p>
                    </div>
                </div>
                <div class="game-card">
                    <img src="https://images.unsplash.com/photo-1606167668584-78701c57f13d?auto=format&fit=crop&q=80&w=400" class="w-full h-32 object-cover" alt="Roulette">
                    <div class="p-3">
                        <p class="text-[10px] font-black">روليت ملكية</p>
                        <p class="text-orange-500 text-[9px] font-bold">جاكبوت ضخم</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="mb-12 glass-panel p-6 rounded-[2.5rem] border-dashed border-orange-500/20">
            <div class="flex items-center gap-4 mb-4">
                <i class="fas fa-shield-halved text-orange-500 text-2xl"></i>
                <div>
                    <p class="text-[12px] font-black uppercase">لعب آمن وعادل</p>
                    <p class="text-[10px] text-zinc-500">مشفر بالكامل ونظام عشوائي معتمد (RNG)</p>
                </div>
            </div>
            <div class="flex justify-center gap-8 opacity-50 grayscale pt-4 border-t border-white/5">
                <i class="fab fa-cc-visa text-xl"></i>
                <i class="fab fa-cc-mastercard text-xl"></i>
                <i class="fab fa-bitcoin text-xl"></i>
                <i class="fab fa-ethereum text-xl"></i>
            </div>
        </div>

    </main>

    <nav class="bottom-nav">
        <a href="#" class="nav-item active">
            <i class="fas fa-spade"></i>
            <span>الرئيسية</span>
        </a>
        <a href="#" class="nav-item">
            <i class="fas fa-dice"></i>
            <span>الألعاب</span>
        </a>
        <div class="relative flex-1 flex justify-center">
            <a href="#" class="play-fab">
                <i class="fas fa-play text-2xl text-white ml-1"></i>
            </a>
        </div>
        <a href="#" class="nav-item">
            <i class="fas fa-gift"></i>
            <span>الجوائز</span>
        </a>
        <a href="#" class="nav-item">
            <i class="fas fa-user-circle"></i>
            <span>حسابي</span>
        </a>
    </nav>

</body>
</html>
