<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Profile | VERTEX PREMIER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg-dark: #020617; --primary: #3b82f6; --nav-bg: rgba(7, 10, 22, 0.98); }
        
        body { 
            background-color: var(--bg-dark); 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            color: #ffffff; 
            background: radial-gradient(circle at 50% 0%, rgba(59, 130, 246, 0.12) 0%, transparent 50%), #020617; 
            min-height: 100vh;
            content-visibility: auto; 
        }

        .glass-panel { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.05); }
        
        .slide-panel { 
            position: fixed; bottom: -100%; left: 0; right: 0; 
            background: #0a0f1c; z-index: 2000; 
            transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1); 
            border-top: 1px solid rgba(59, 130, 246, 0.2); 
            border-radius: 2.5rem 2.5rem 0 0; padding: 2rem;
            will-change: transform;
        }
        .slide-panel.active { transform: translateY(-100%); bottom: 0; }

        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); display: none; z-index: 1500; }
        
        .bottom-nav { background: var(--nav-bg); backdrop-filter: blur(20px); border-top: 1px solid rgba(255, 255, 255, 0.05); height: 85px; position: fixed; bottom: 0; left: 0; right: 0; display: flex; justify-content: space-around; align-items: center; z-index: 1000; padding-bottom: 15px; }
        
        .invest-fab { width: 68px; height: 68px; background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; position: relative; top: -28px; box-shadow: 0 12px 30px rgba(37, 99, 235, 0.6); border: 6px solid #020617; }
        
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; color: #475569; text-decoration: none; font-size: 10px; font-weight: 700; }
        .nav-item.active { color: var(--primary); }

        .skeleton { background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.03) 75%); background-size: 200% 100%; animation: loading 1.5s infinite; border-radius: 10px; }
        @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        
        /* تحسين مظهر المدخلات */
        input::placeholder { color: rgba(255,255,255,0.2); letter-spacing: normal; font-size: 9px; }
    </style>
</head>
<body class="pb-32">

    <div id="overlay" class="overlay" onclick="closeAllPanels()"></div>

    <div id="customToast" class="fixed bottom-24 left-6 right-6 z-[3000] translate-y-40 transition-transform duration-500">
        <div class="glass-panel p-4 rounded-2xl border border-blue-500/30 flex items-center gap-3">
            <div id="toastIcon" class="text-blue-400"></div>
            <p id="toastMsg" class="text-[10px] font-black uppercase tracking-widest text-white"></p>
        </div>
    </div>

    <div id="securityPanel" class="slide-panel">
        <div class="flex items-center justify-between mb-8">
            <button onclick="closeAllPanels()" class="w-10 h-10 rounded-xl bg-white/5 flex items-center justify-center text-slate-400"><i class="fas fa-chevron-left"></i></button>
            <h3 class="text-sm font-black uppercase tracking-widest">Vault Security</h3>
            <div class="w-10"></div>
        </div>
        
        <div class="space-y-4">
            <button id="resetEmailBtn" class="w-full flex items-center justify-between p-4 bg-white/5 rounded-2xl border border-white/5 active:scale-95 transition-transform">
                <div class="flex items-center gap-4 text-left">
                    <i class="fas fa-key text-blue-400"></i>
                    <div><p class="text-xs font-bold">Reset Password</p><p class="text-[8px] text-slate-500 uppercase">Update Account Access</p></div>
                </div>
                <i class="fas fa-chevron-right text-slate-700"></i>
            </button>

            <button id="verifyEmailBtn" class="w-full flex items-center justify-between p-4 bg-white/5 rounded-2xl border border-white/5 active:scale-95 transition-transform">
                <div class="flex items-center gap-4 text-left">
                    <i class="fas fa-envelope-circle-check text-indigo-400"></i>
                    <div><p class="text-xs font-bold">Verification</p><p id="emailStatusText" class="text-[8px] text-slate-500 uppercase tracking-tighter">Status: Checking...</p></div>
                </div>
                <div id="verifyBadge" class="text-[8px] font-black uppercase px-2 py-1 rounded bg-amber-500/10 text-amber-500">Required</div>
            </button>

            <div class="p-5 bg-blue-500/5 rounded-3xl border border-blue-500/10">
                <p class="text-[10px] font-black uppercase text-blue-400 mb-3 ml-1">Withdrawal PIN</p>
                <div id="pinInputs" class="space-y-3">
                    <input type="password" id="oldPin" maxlength="6" inputmode="numeric" placeholder="ENTER CURRENT PIN" class="hidden w-full bg-black/40 border border-white/10 rounded-xl p-3 text-center text-xs font-black tracking-[0.5em] outline-none focus:border-blue-500/50 transition-colors">
                    <input type="password" id="newPin" maxlength="6" inputmode="numeric" placeholder="NEW 6-DIGIT PIN" class="w-full bg-black/40 border border-white/10 rounded-xl p-3 text-center text-xs font-black tracking-[0.5em] outline-none focus:border-blue-500/50 transition-colors">
                    <input type="password" id="confirmPin" maxlength="6" inputmode="numeric" placeholder="CONFIRM NEW PIN" class="w-full bg-black/40 border border-white/10 rounded-xl p-3 text-center text-xs font-black tracking-[0.5em] outline-none focus:border-blue-500/50 transition-colors">
                    <button id="savePinBtn" class="w-full py-3 bg-blue-600 hover:bg-blue-700 rounded-xl text-[10px] font-black uppercase transition-all shadow-lg shadow-blue-900/20">Save Security PIN</button>
                </div>
            </div>
        </div>
    </div>

    <div id="logoutPanel" class="slide-panel text-center">
        <div class="w-20 h-20 bg-red-500/10 rounded-full flex items-center justify-center text-red-500 text-3xl mx-auto mb-4"><i class="fas fa-power-off"></i></div>
        <h3 class="text-lg font-black uppercase mb-2">Logout?</h3>
        <p class="text-slate-500 text-xs mb-8">End your current session with Vertex Premier?</p>
        <div class="flex gap-4">
            <button onclick="closeAllPanels()" class="flex-1 py-4 rounded-2xl bg-white/5 font-bold uppercase text-[10px]">Cancel</button>
            <button id="confirmLogout" class="flex-1 py-4 rounded-2xl bg-red-600 font-bold uppercase text-[10px] text-white">Sign Out</button>
        </div>
    </div>

    <main id="mainContent">
        <div class="px-8 pt-12 pb-6 text-center">
            <div class="w-20 h-20 rounded-full bg-slate-900 border-2 border-blue-500/20 mx-auto mb-4 overflow-hidden shadow-2xl">
                <img id="userAvatar" src="" class="w-full h-full object-cover">
            </div>
            <h2 id="userName" class="text-xl font-black tracking-tight text-white uppercase skeleton h-6 w-32 mx-auto"></h2>
            <div class="mt-4 flex flex-col items-center gap-1">
                <div class="flex items-center gap-2 text-[9px] font-black uppercase text-slate-500">
                    UID: <span id="userIdDisplay" class="text-blue-400 font-mono skeleton w-16 h-3 inline-block"></span>
                </div>
                <div class="text-[9px] font-black uppercase text-slate-500">
                    Phone: <span id="userPhoneDisplay" class="text-slate-300 skeleton w-20 h-3 inline-block"></span>
                </div>
            </div>
        </div>

        <div class="px-6 mb-6">
            <div class="glass-panel p-6 rounded-[2.5rem] border-white/10">
                <div class="flex justify-between items-start mb-6">
                    <div>
                        <p class="text-[9px] text-slate-500 uppercase font-black tracking-widest mb-1">Secured Assets</p>
                        <h1 id="userBalance" class="text-3xl font-black text-white">$ 0.00</h1>
                    </div>
                    <div id="userTierBadge" class="px-3 py-1.5 rounded-xl text-[10px] font-black uppercase border border-white/5 bg-white/5 text-slate-400">---</div>
                </div>
                <div class="space-y-2">
                    <div class="flex justify-between text-[9px] font-black uppercase">
                        <span class="text-slate-500">Protocol Status</span>
                        <span id="statusText" class="text-slate-600 italic">Synchronizing...</span>
                    </div>
                    <div class="w-full h-1.5 bg-white/5 rounded-full overflow-hidden">
                        <div id="progressBar" class="h-full bg-blue-500 transition-all duration-700" style="width: 0%"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="px-6 mb-8">
            <div class="glass-panel p-5 rounded-3xl border-white/5 flex items-center justify-between">
                <div class="flex items-center gap-4 text-left">
                    <div class="w-10 h-10 rounded-xl bg-purple-500/10 flex items-center justify-center text-purple-400 border border-purple-500/20"><i class="fas fa-chart-line text-sm"></i></div>
                    <div>
                        <p class="text-[9px] text-slate-500 font-black uppercase tracking-widest">Team Profits</p>
                        <p id="monthlyTeamEarn" class="text-lg font-black text-white">+$0.00</p>
                    </div>
                </div>
                <i class="fas fa-arrow-trend-up text-emerald-500 animate-pulse"></i>
            </div>
        </div>

        <div class="px-6 space-y-4">
            <h3 class="text-[10px] font-black text-slate-600 uppercase tracking-widest ml-4">Terminal Access</h3>
            <div class="glass-panel rounded-[2.5rem] overflow-hidden">
                <button onclick="togglePanel('securityPanel', true)" class="w-full flex items-center justify-between p-5 border-b border-white/5 active:bg-white/5 transition-colors">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 rounded-2xl bg-blue-500/10 flex items-center justify-center text-blue-400 text-lg"><i class="fas fa-shield-halved"></i></div>
                        <div class="text-left"><p class="text-sm font-bold text-white">Security Vault</p><p class="text-[10px] text-slate-500 uppercase">Credentials & PIN</p></div>
                    </div>
                    <i class="fas fa-chevron-right text-slate-700"></i>
                </button>
                <a href="invite.html" class="flex items-center justify-between p-5 border-b border-white/5 no-underline active:bg-white/5 transition-colors">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 rounded-2xl bg-indigo-500/10 flex items-center justify-center text-indigo-400 text-lg"><i class="fas fa-users"></i></div>
                        <div class="text-left"><p class="text-sm font-bold text-white">Affiliates</p><p class="text-[10px] text-slate-500 uppercase">Invite & Earn</p></div>
                    </div>
                    <i class="fas fa-chevron-right text-slate-700"></i>
                </a>
                <button onclick="togglePanel('logoutPanel', true)" class="w-full flex items-center gap-4 p-5 active:bg-red-500/5 transition-colors">
                    <div class="w-12 h-12 rounded-2xl bg-red-500/10 flex items-center justify-center text-red-500 text-lg"><i class="fas fa-power-off"></i></div>
                    <p class="text-sm font-bold text-red-500 uppercase">Terminate Session</p>
                </button>
            </div>
        </div>
    </main>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item"><i class="fas fa-house"></i><span>Home</span></a>
        <a href="wallet.html" class="nav-item"><i class="fas fa-wallet"></i><span>Wallet</span></a>
        <div class="relative flex-1 flex justify-center"><a href="invest.html" class="invest-fab"><i class="fas fa-bolt-lightning text-2xl text-white"></i></a></div>
        <a href="support.html" class="nav-item"><i class="fas fa-headset"></i><span>Support</span></a>
        <a href="profile.html" class="nav-item active"><i class="fas fa-circle-user"></i><span>Profile</span></a>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut, sendPasswordResetEmail, sendEmailVerification } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, updateDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAmlAKs35FG4hbcaPkVQ_s0FSaZsvWzFak",
            authDomain: "cloud-mining-6f190.firebaseapp.com",
            projectId: "cloud-mining-6f190",
            storageBucket: "cloud-mining-6f190.firebasestorage.app",
            messagingSenderId: "144227180849",
            appId: "1:144227180849:web:ccbda447d074efbbddd010"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let userHasPin = false;

        function showToast(msg, iconClass = 'fa-info-circle', color = 'text-blue-400') {
            const toast = document.getElementById('customToast');
            document.getElementById('toastMsg').innerText = msg;
            document.getElementById('toastIcon').innerHTML = `<i class="fas ${iconClass}"></i>`;
            document.getElementById('toastIcon').className = color;
            toast.classList.remove('translate-y-40');
            setTimeout(() => toast.classList.add('translate-y-40'), 3000);
        }

        window.togglePanel = (id, show) => {
            document.getElementById(id).classList.toggle('active', show);
            document.getElementById('overlay').style.display = show ? 'block' : 'none';
        };

        window.closeAllPanels = () => {
            document.querySelectorAll('.slide-panel').forEach(p => p.classList.remove('active'));
            document.getElementById('overlay').style.display = 'none';
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                const removeSkeletons = () => {
                    document.querySelectorAll('.skeleton').forEach(el => el.classList.remove('skeleton'));
                };

                onSnapshot(doc(db, "users", user.uid), (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        removeSkeletons();
                        
                        document.getElementById('userIdDisplay').innerText = data.referralId || "VX-USER";
                        document.getElementById('userName').innerText = data.fullName || "Member";
                        document.getElementById('userPhoneDisplay').innerText = data.phone || "No Phone";
                        document.getElementById('userAvatar').src = `https://ui-avatars.com/api/?name=${data.fullName}&background=1e293b&color=3b82f6&bold=true`;
                        
                        const balance = parseFloat(data.balance || 0);
                        document.getElementById('userBalance').innerText = `$${balance.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
                        document.getElementById('monthlyTeamEarn').innerText = `+$${parseFloat(data.totalTeamEarned || 0).toLocaleString(undefined, {minimumFractionDigits: 2})}`;

                        const tierBadge = document.getElementById('userTierBadge');
                        const statusText = document.getElementById('statusText');
                        const progressBar = document.getElementById('progressBar');

                        if (balance >= 100) {
                            tierBadge.innerText = "ACTIVE";
                            tierBadge.className = "px-3 py-1.5 rounded-xl text-[10px] font-black uppercase border border-emerald-500/20 bg-emerald-500/10 text-emerald-400";
                            statusText.innerText = "Quantum Live";
                            statusText.className = "text-emerald-500 animate-pulse";
                            progressBar.style.width = "100%";
                        } else {
                            tierBadge.innerText = "NOT ACTIVE";
                            tierBadge.className = "px-3 py-1.5 rounded-xl text-[10px] font-black uppercase border border-red-500/20 bg-red-500/10 text-red-500";
                            statusText.innerText = "Low Capital";
                            statusText.className = "text-slate-500";
                            progressBar.style.width = Math.min((balance/100)*100, 100) + "%";
                        }

                        if(user.emailVerified) {
                            document.getElementById('emailStatusText').innerText = "Account Verified";
                            document.getElementById('emailStatusText').classList.replace('text-slate-500', 'text-emerald-400');
                            document.getElementById('verifyBadge').innerText = "Verified";
                            document.getElementById('verifyBadge').className = "px-2 py-1 rounded bg-emerald-500/10 text-emerald-500 text-[8px] font-black uppercase";
                            document.getElementById('verifyEmailBtn').disabled = true;
                            document.getElementById('verifyEmailBtn').style.opacity = "0.5";
                        } else {
                            document.getElementById('emailStatusText').innerText = "Status: Pending";
                        }

                        if (data.securePin) {
                            userHasPin = true;
                            document.getElementById('oldPin').classList.remove('hidden');
                            document.getElementById('savePinBtn').innerText = "Update Security PIN";
                        }
                    }
                });
            } else { window.location.replace("login.html"); }
        });

        document.getElementById('savePinBtn').addEventListener('click', async () => {
            const user = auth.currentUser;
            const oldPinInput = document.getElementById('oldPin');
            const newPinVal = document.getElementById('newPin').value;
            const confirmPinVal = document.getElementById('confirmPin').value;

            if (userHasPin && !oldPinInput.value) return showToast("CURRENT PIN REQUIRED", "fa-lock", "text-amber-400");
            if (newPinVal.length !== 6 || !/^\d+$/.test(newPinVal)) return showToast("6-DIGIT PIN REQUIRED", "fa-shield", "text-amber-400");
            if (newPinVal !== confirmPinVal) return showToast("PIN MISMATCH", "fa-x", "text-red-400");

            try {
                const userRef = doc(db, "users", user.uid);
                if (userHasPin) {
                    const userDoc = await getDoc(userRef);
                    if (userDoc.data().securePin !== oldPinInput.value) return showToast("INCORRECT CURRENT PIN", "fa-lock", "text-red-500");
                }
                await updateDoc(userRef, { securePin: newPinVal });
                showToast("PIN SECURED", "fa-check", "text-emerald-400");
                document.querySelectorAll('#pinInputs input').forEach(i => i.value = "");
            } catch (e) { showToast("DATABASE ERROR", "fa-bug", "text-red-500"); }
        });

        document.getElementById('verifyEmailBtn').addEventListener('click', () => {
            const user = auth.currentUser;
            if (user) sendEmailVerification(user).then(() => showToast("LINK SENT", "fa-paper-plane", "text-indigo-400"));
        });

        document.getElementById('resetEmailBtn').addEventListener('click', () => {
            const user = auth.currentUser;
            if (user?.email) sendPasswordResetEmail(auth, user.email).then(() => showToast("RESET SENT", "fa-key", "text-emerald-400"));
        });

        document.getElementById('confirmLogout').addEventListener('click', () => {
            signOut(auth).then(() => window.location.replace("login.html"));
        });
    </script>
</body>
</html>
