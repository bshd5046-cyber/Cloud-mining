<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Home | VERTEX PREMIER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg-dark: #020617; 
            --primary: #3b82f6; 
            --accent: #8b5cf6; 
            --nav-bg: rgba(7, 10, 22, 0.98); 
        }
        
        body { 
            background-color: var(--bg-dark); 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            color: #ffffff; 
            background: radial-gradient(circle at 50% 0%, rgba(59, 130, 246, 0.12) 0%, transparent 50%), #020617; 
            min-height: 100vh; 
            margin: 0;
            padding: 0;
        }

        .glass-panel { 
            background: rgba(15, 23, 42, 0.6); 
            backdrop-filter: blur(25px); 
            border: 1px solid rgba(255, 255, 255, 0.05); 
        }

        /* البار السفلي - نسخة طبق الأصل من كودك */
        .bottom-nav { 
            background: var(--nav-bg); 
            backdrop-filter: blur(20px); 
            border-top: 1px solid rgba(255, 255, 255, 0.05); 
            height: 85px; 
            position: fixed; 
            bottom: 0; left: 0; right: 0; 
            display: flex; justify-content: space-around; align-items: center; 
            z-index: 1000; 
            padding-bottom: 15px; 
        }

        /* الزر العائم FAB - نسخة طبق الأصل من كودك */
        .invest-fab { 
            width: 68px; height: 68px; 
            background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%); 
            border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            position: relative; 
            top: -28px; 
            box-shadow: 0 12px 30px rgba(37, 99, 235, 0.6); 
            border: 6px solid #020617; 
        }

        .nav-item { 
            flex: 1; display: flex; flex-direction: column; align-items: center; 
            color: #475569; text-decoration: none; font-size: 10px; font-weight: 700; 
            transition: 0.3s; 
        }

        .nav-item i { font-size: 20px; margin-bottom: 4px; }
        .nav-item.active { color: var(--primary); }

        .text-gradient {
            background: linear-gradient(to right, #60a5fa, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="pb-32">

    <!-- Header -->
    <nav class="flex justify-between items-center p-6 sticky top-0 z-50 bg-[#020617]/80 backdrop-blur-md">
        <div class="text-xl font-black italic tracking-tighter text-blue-500">
            VERTEX<span class="text-white">PREMIER</span>
        </div>
        <button class="w-10 h-10 rounded-xl bg-white/5 flex items-center justify-center text-blue-500 border border-white/10">
            <i class="fa-solid fa-bell"></i>
        </button>
    </nav>

    <main class="px-6">
        <!-- Hero Section -->
        <section class="text-center py-10">
            <h1 class="text-4xl font-extrabold tracking-tight leading-tight mb-4 uppercase">
                Invest in <br><span class="text-gradient text-5xl">Future AI</span>
            </h1>
            <p class="text-slate-500 text-[10px] font-black tracking-[0.2em] uppercase">Daily Yield: 1.9% — 3.5%</p>
        </section>

        <!-- Balance Card -->
        <div class="glass-panel p-8 rounded-[2.5rem] mb-8 relative overflow-hidden">
            <div class="flex justify-between items-start mb-4">
                <div>
                    <p class="text-[9px] text-slate-500 uppercase font-black tracking-widest mb-1">Total Trading Balance</p>
                    <h2 class="text-4xl font-black text-white">$12,450<span class="text-xl text-slate-500">.00</span></h2>
                </div>
                <div class="px-2 py-1 rounded bg-emerald-500/10 text-emerald-500 text-[8px] font-black uppercase">Online</div>
            </div>
            <div class="flex gap-3 mt-6">
                <button class="flex-1 py-3.5 rounded-2xl bg-blue-600 font-bold uppercase text-[10px] tracking-widest shadow-lg shadow-blue-900/40">Deposit</button>
                <button class="flex-1 py-3.5 rounded-2xl bg-white/5 border border-white/10 font-bold uppercase text-[10px] tracking-widest">Withdraw</button>
            </div>
        </div>

        <!-- Nodes Section -->
        <div class="space-y-4">
            <h3 class="text-[11px] font-black text-slate-600 uppercase tracking-[0.3em] ml-4">Mining Nodes</h3>
            
            <div class="glass-panel p-6 rounded-[2rem] border-l-4 border-l-blue-500 flex items-center justify-between">
                <div>
                    <p class="text-[13px] font-bold text-white">Standard AI Node</p>
                    <p class="text-[10px] text-slate-500 uppercase tracking-tighter">1.9% Daily Profit</p>
                </div>
                <div class="text-right">
                    <p class="text-blue-400 font-black">$100.00</p>
                    <p class="text-[8px] text-slate-600 uppercase font-bold">Min Entry</p>
                </div>
            </div>

            <div class="glass-panel p-6 rounded-[2rem] border-l-4 border-l-purple-500 flex items-center justify-between">
                <div>
                    <p class="text-[13px] font-bold text-white">Ultra Core Node</p>
                    <p class="text-[10px] text-slate-500 uppercase tracking-tighter">3.5% Daily Profit</p>
                </div>
                <div class="text-right">
                    <p class="text-purple-400 font-black">$5,000.00</p>
                    <p class="text-[8px] text-slate-600 uppercase font-bold">VIP Tier</p>
                </div>
            </div>
        </div>
    </main>

    <!-- البار السفلي - مطابق تماماً لصفحة البروفايل اللي بعتّها -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item active">
            <i class="fas fa-house"></i>
            <span>Home</span>
        </a>
        <a href="wallet.html" class="nav-item">
            <i class="fas fa-wallet"></i>
            <span>Wallet</span>
        </a>
        <div class="relative flex-1 flex justify-center">
            <a href="invest.html" class="invest-fab">
                <i class="fas fa-bolt-lightning text-2xl text-white"></i>
            </a>
        </div>
        <a href="support.html" class="nav-item">
            <i class="fas fa-headset"></i>
            <span>Support</span>
        </a>
        <a href="profile.html" class="nav-item">
            <i class="fas fa-circle-user"></i>
            <span>Profile</span>
        </a>
    </nav>

</body>
</html>
