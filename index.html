<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VERTEX | Premier Digital AI Ecosystem</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg-dark: #050810; 
            --primary: #3b82f6; 
            --accent: #6366f1;
            --nav-bg: #0a0f1c; 
        }

        body { 
            background-color: var(--bg-dark); 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            color: #ffffff; 
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            background: radial-gradient(circle at 50% 0%, rgba(59, 130, 246, 0.15) 0%, transparent 50%), 
                        radial-gradient(circle at 100% 100%, rgba(99, 102, 241, 0.1) 0%, transparent 40%), 
                        #050810;
            min-height: 100vh;
        }

        .glass-card { 
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(20px); 
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 2rem;
            transition: all 0.4s ease;
        }

        .text-gradient { 
            background: linear-gradient(to right, #60a5fa, #3b82f6, #8b5cf6); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
        }

        /* --- البار السفلي الموحد كلياً (Fixed Bottom Nav) --- */
        .bottom-nav { 
            background: var(--nav-bg); 
            backdrop-filter: blur(20px); 
            border-top: 1px solid rgba(255, 255, 255, 0.08); 
            height: 85px; 
            position: fixed; 
            bottom: 0; left: 0; right: 0; 
            display: flex; justify-content: space-around; align-items: center; 
            z-index: 9999;
            padding-bottom: 12px;
        }

        .nav-item { 
            flex: 1; display: flex; flex-direction: column; align-items: center; 
            color: #64748b; text-decoration: none; font-size: 10px; font-weight: 700;
            transition: all 0.3s ease;
        }
        
        .nav-item i { font-size: 1.25rem; margin-bottom: 4px; }
        .nav-item.active { color: var(--primary); }

        /* الزر العائم المركزي (FAB) */
        .fab-wrapper {
            position: relative;
            top: -28px;
        }

        .invest-fab { 
            width: 68px; height: 68px; 
            background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%); 
            border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.5); 
            border: 6px solid var(--bg-dark); 
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .invest-fab:active { transform: scale(0.9); }
        /* ------------------------------------------- */

        .feature-icon {
            width: 50px; height: 50px;
            background: rgba(59, 130, 246, 0.1);
            border-radius: 15px;
            display: flex; align-items: center; justify-content: center;
            color: var(--primary);
            margin-bottom: 20px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.2);
        }
    </style>
</head>
<body class="pb-32">

    <!-- Header -->
    <nav class="flex justify-center items-center p-8 sticky top-0 z-50 bg-[#050810]/80 backdrop-blur-md">
        <div class="text-2xl font-black italic tracking-tighter text-blue-500">
            VERTEX<span class="text-white">PREMIER</span>
        </div>
    </nav>

    <!-- Content Area -->
    <main class="max-w-7xl mx-auto px-8">
        <!-- Hero Section -->
        <section class="flex flex-col items-center text-center pt-12">
            <div class="inline-flex items-center gap-3 bg-blue-500/10 border border-blue-500/20 px-5 py-2 rounded-full mb-8">
                <span class="text-[10px] font-black uppercase tracking-[0.25em] text-blue-400">Stable AI Infrastructure</span>
            </div>
            
            <h1 class="text-4xl md:text-7xl font-extrabold mb-6 tracking-tighter leading-[1.1]">
                Daily Yield <br> <span class="text-gradient">1.9% — 3.5%</span>
            </h1>
            
            <p class="max-w-2xl text-slate-400 text-sm mb-10">
                Vertex Premier delivers a balanced digital ecosystem. Start your journey with a minimum of $100 up to $10,000+.
            </p>

            <div class="flex flex-wrap justify-center gap-4 mb-16">
                <div class="glass-card px-6 py-4 flex items-center gap-3">
                    <i class="fas fa-chart-line text-blue-500"></i>
                    <span class="text-[11px] font-bold uppercase tracking-widest">Min $100 Deposit</span>
                </div>
            </div>
        </section>

        <!-- Investment Nodes -->
        <div class="grid md:grid-cols-3 gap-8 mb-20">
            <div class="glass-card p-10 text-center border-blue-500/30">
                <span class="text-[10px] font-black uppercase text-blue-500 mb-4 block">Standard</span>
                <h4 class="text-3xl font-black italic mb-6">1.9% <small class="text-xs not-italic text-slate-500">Daily</small></h4>
                <a href="invest.html" class="block w-full btn-primary py-4 rounded-2xl font-black uppercase text-[10px] tracking-widest">Select Node</a>
            </div>
            <!-- يمكنك إضافة باقي الكروت هنا بنفس التنسيق -->
        </div>
    </main>

    <!-- THE UNIFIED BOTTOM NAV (نفس البار في كل الصفحات) -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item active">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </a>
        <a href="wallet.html" class="nav-item">
            <i class="fa-solid fa-wallet"></i>
            <span>Wallet</span>
        </a>
        
        <div class="fab-wrapper">
            <a href="invest.html" class="invest-fab">
                <i class="fa-solid fa-bolt-lightning text-white text-2xl"></i>
            </a>
        </div>

        <a href="support.html" class="nav-item">
            <i class="fa-solid fa-headset"></i>
            <span>Support</span>
        </a>
        <a href="profile.html" class="nav-item">
            <i class="fa-solid fa-user-gear"></i>
            <span>Profile</span>
        </a>
    </nav>

</body>
</html>
