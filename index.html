<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الرئيسية | VERTEX CASINO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg-dark: #0f0a05; 
            --primary: #f97316; 
            --accent: #fbbf24; 
        }
        
        body { 
            background-color: var(--bg-dark); 
            font-family: 'Cairo', sans-serif; 
            color: #ffffff; 
            background: radial-gradient(circle at 50% 0%, rgba(249, 115, 22, 0.12) 0%, transparent 50%), #0f0a05; 
            min-height: 100vh; 
        }

        .glass-panel { 
            background: rgba(30, 20, 10, 0.4); 
            backdrop-filter: blur(20px); 
            border: 1px solid rgba(249, 115, 22, 0.1); 
        }

        .jackpot-card {
            background: linear-gradient(135deg, #f97316 0%, #7c2d12 100%);
            box-shadow: 0 15px 35px rgba(249, 115, 22, 0.25);
        }

        .bottom-nav { 
            background: rgba(15, 10, 5, 0.98); 
            backdrop-filter: blur(20px); 
            border-top: 1px solid rgba(249, 115, 22, 0.2); 
            height: 85px; 
            position: fixed; 
            bottom: 0; left: 0; right: 0; 
            display: flex; justify-content: space-around; align-items: center; 
            z-index: 1000; 
            padding-bottom: 15px; 
        }

        .play-fab { 
            width: 68px; height: 68px; 
            background: linear-gradient(135deg, #f97316 0%, #ea580c 100%); 
            border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            position: relative; top: -28px; 
            box-shadow: 0 12px 30px rgba(249, 115, 22, 0.5); 
            border: 6px solid #0f0a05; 
        }

        .text-gradient {
            background: linear-gradient(to right, #fbbf24, #f97316);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body class="pb-32">

    <nav class="flex justify-between items-center p-6 sticky top-0 z-50 bg-[#0f0a05]/80 backdrop-blur-md">
        <div class="text-xl font-black italic tracking-tighter text-orange-500">
            VERTEX<span class="text-white">CASINO</span>
        </div>
        <div class="flex gap-3">
            <button class="w-10 h-10 rounded-xl bg-orange-500/10 flex items-center justify-center text-orange-500 border border-orange-500/10">
                <i class="fa-solid fa-crown"></i>
            </button>
            <button class="w-10 h-10 rounded-xl bg-orange-500/10 flex items-center justify-center text-orange-500 border border-orange-500/10">
                <i class="fa-solid fa-bell"></i>
            </button>
        </div>
    </nav>

    <main class="px-6">
        
        <section class="pt-4 pb-8">
            <div class="jackpot-card p-8 rounded-[2.5rem] relative overflow-hidden text-center">
                <div class="relative z-10">
                    <p class="text-[10px] font-black uppercase tracking-[0.3em] text-orange-200 mb-2">الجاكبوت الكبير</p>
                    <h1 class="text-5xl font-black text-white tracking-tighter mb-4">$1,250,840</h1>
                    <button class="bg-white text-orange-600 px-8 py-2 rounded-full font-black text-xs uppercase tracking-widest shadow-xl">العب الآن</button>
                </div>
                <i class="fa-solid fa-coins absolute -top-4 -left-4 text-white/10 text-8xl rotate-12"></i>
                <i class="fa-solid fa-dice absolute -bottom-4 -right-4 text-white/10 text-8xl -rotate-12"></i>
            </div>
        </section>

        <div class="glass-panel p-8 rounded-[2.5rem] mb-8 relative overflow-hidden">
            <div class="flex justify-between items-start mb-8">
                <div>
                    <p class="text-[10px] text-zinc-500 uppercase font-black tracking-widest mb-1 italic">محفظتك النشطة</p>
                    <h2 class="text-4xl font-black text-white tracking-tighter">$2,450<span class="text-xl text-zinc-500">.00</span></h2>
                    <p class="text-orange-400 text-[10px] font-bold mt-1"><i class="fas fa-arrow-up mr-1"></i> +$120.00 اليوم</p>
                </div>
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-orange-500 to-yellow-600 flex items-center justify-center shadow-lg shadow-orange-500/30">
                    <i class="fas fa-wallet text-white text-xl"></i>
                </div>
            </div>

            <div class="grid grid-cols-3 gap-3 mb-8">
                <div class="stat-card text-center">
                    <p class="text-[8px] text-zinc-500 uppercase font-black mb-1">المستوى</p>
                    <p class="text-xs font-bold text-orange-400">VIP 2</p>
                </div>
                <div class="stat-card text-center">
                    <p class="text-[8px] text-zinc-500 uppercase font-black mb-1">تذاكر</p>
                    <p class="text-xs font-bold text-white">12</p>
                </div>
                <div class="stat-card text-center">
                    <p class="text-[8px] text-zinc-500 uppercase font-black mb-1">مكافأة</p>
                    <p class="text-xs font-bold text-emerald-400">+$50</p>
                </div>
            </div>

            <div class="flex gap-3">
                <a href="wallet.html" class="flex-1 py-4 bg-orange-600 rounded-2xl text-center font-black uppercase text-[10px] tracking-widest shadow-lg shadow-orange-900/40">إيداع فوري</a>
                <button class="w-14 h-14 rounded-2xl bg-white/5 border border-white/10 flex items-center justify-center text-white">
                    <i class="fas fa-qrcode"></i>
                </button>
            </div>
        </div>

        <div class="space-y-4 mb-10">
            <div class="flex justify-between items-center px-4">
                <h3 class="text-[11px] font-black text-zinc-600 uppercase tracking-[0.3em]">ألعاب موصى بها</h3>
                <a href="games.html" class="text-[10px] text-orange-500 font-black">المزيد</a>
            </div>
            
            <div class="glass-panel p-6 rounded-[2.5rem] relative overflow-hidden group border-l-4 border-l-orange-500">
                <div class="flex items-center justify-between relative z-10">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 rounded-2xl bg-orange-500/20 flex items-center justify-center text-orange-400">
                            <i class="fas fa-spade text-lg"></i>
                        </div>
                        <div>
                            <p class="text-sm font-black text-white uppercase">غرفة البوكر الملكية</p>
                            <p class="text-[9px] text-zinc-500 uppercase font-bold tracking-widest mt-0.5">الحد الأدنى: $10</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="text-lg font-black text-white italic">HOT<span class="text-[10px] text-orange-400 ml-1">🔥</span></p>
                    </div>
                </div>
                <div class="mt-6 pt-6 border-t border-white/5 flex justify-between items-center relative z-10">
                    <div class="flex -space-x-2">
                        <img src="https://i.pravatar.cc/100?u=1" class="w-6 h-6 rounded-full border-2 border-[#0f0a05]">
                        <img src="https://i.pravatar.cc/100?u=2" class="w-6 h-6 rounded-full border-2 border-[#0f0a05]">
                        <div class="w-6 h-6 rounded-full bg-zinc-800 border-2 border-[#0f0a05] flex items-center justify-center text-[8px] font-bold">+85</div>
                    </div>
                    <a href="games.html" class="bg-orange-600/20 text-orange-400 px-6 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest">العب الآن</a>
                </div>
            </div>
        </div>

    </main>

    <nav class="bottom-nav">
        <a href="index.html" class="flex flex-col items-center flex-1 text-orange-500">
            <i class="fas fa-house text-xl"></i>
            <span class="text-[10px] font-bold mt-1">الرئيسية</span>
        </a>
        <a href="games.html" class="flex flex-col items-center flex-1 text-zinc-500">
            <i class="fas fa-dice text-xl"></i>
            <span class="text-[10px] font-bold mt-1">الألعاب</span>
        </a>
        <div class="relative flex-1 flex justify-center">
            <a href="games.html" class="play-fab">
                <i class="fas fa-rocket text-2xl text-white"></i>
            </a>
        </div>
        <a href="wallet.html" class="flex flex-col items-center flex-1 text-zinc-500">
            <i class="fas fa-wallet text-xl"></i>
            <span class="text-[10px] font-bold mt-1">المحفظة</span>
        </a>
        <a href="#" class="flex flex-col items-center flex-1 text-zinc-500">
            <i class="fas fa-user-circle text-xl"></i>
            <span class="text-[10px] font-bold mt-1">حسابي</span>
        </a>
    </nav>

</body>
</html>
