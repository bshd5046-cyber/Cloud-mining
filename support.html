<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Support Center | VERTEX PREMIER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg-dark: #020617; 
            --primary: #3b82f6; 
            --accent: #6366f1;
            --nav-bg: rgba(7, 10, 22, 0.98); 
        }

        body { 
            background-color: var(--bg-dark); 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            color: #ffffff; 
            background: 
                radial-gradient(circle at 100% 0%, rgba(59, 130, 246, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 0% 100%, rgba(99, 102, 241, 0.12) 0%, transparent 40%),
                #020617;
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }

        .glass-panel { 
            background: rgba(15, 23, 42, 0.7); 
            backdrop-filter: blur(25px); 
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .bottom-nav { 
            background: var(--nav-bg); 
            backdrop-filter: blur(20px); 
            border-top: 1px solid rgba(255, 255, 255, 0.05); 
            height: 85px; 
            position: fixed; 
            bottom: 0; left: 0; right: 0; 
            display: flex; justify-content: space-around; align-items: center; 
            z-index: 1000; padding-bottom: 15px; 
        }

        .invest-fab { 
            width: 68px; height: 68px; 
            background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%); 
            border-radius: 50%; display: flex; align-items: center; justify-content: center; 
            position: relative; top: -28px; 
            box-shadow: 0 12px 30px rgba(37, 99, 235, 0.6); 
            border: 6px solid #020617; 
        }

        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; color: #475569; text-decoration: none; font-size: 10px; font-weight: 700; transition: 0.3s; }
        .nav-item i { font-size: 20px; margin-bottom: 4px; }
        .nav-item.active { color: var(--primary); }

        #aiChatPanel { 
            position: fixed; inset: 0; z-index: 2000; background: #020617;
            display: none; flex-direction: column;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translateY(100%);
        }
        #aiChatPanel.active { transform: translateY(0); display: flex; }

        .chat-scroll {
            flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
            padding: 20px; scroll-behavior: smooth;
        }
        .chat-scroll::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="pb-32">

    <div id="mainContent" class="p-6 space-y-8 pt-12">
        <header class="text-center">
            <div class="w-20 h-20 bg-blue-600/10 rounded-3xl flex items-center justify-center mx-auto mb-6 border border-blue-500/20 shadow-xl">
                <i class="fas fa-headset text-3xl text-blue-500"></i>
            </div>
            <h1 class="text-3xl font-black italic tracking-tighter uppercase">Support <span class="text-blue-500">Center</span></h1>
            <p class="text-[9px] text-slate-500 font-bold uppercase tracking-[0.4em]">Protocol Node 24/7</p>
        </header>

        <div class="space-y-4">
            <div onclick="toggleAIChat(true)" class="glass-panel p-6 rounded-[2rem] flex items-center justify-between cursor-pointer active:scale-95 transition-all">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 bg-blue-500/10 rounded-xl flex items-center justify-center text-blue-500 border border-blue-500/20">
                        <i class="fas fa-robot text-xl"></i>
                    </div>
                    <div>
                        <h4 class="font-black text-white text-md tracking-tight">System AI Node</h4>
                        <p class="text-[9px] text-emerald-500 font-bold uppercase tracking-widest">Active Resolution</p>
                    </div>
                </div>
                <i class="fas fa-chevron-right text-slate-600 text-xs"></i>
            </div>
            
            <a href="https://wa.me/12713936333" class="glass-panel p-6 rounded-[2rem] flex items-center justify-between block">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 bg-green-500/10 rounded-xl flex items-center justify-center text-green-500 border border-green-500/20">
                        <i class="fab fa-whatsapp text-xl"></i>
                    </div>
                    <div>
                        <h4 class="font-black text-white text-md tracking-tight">VIP WhatsApp</h4>
                        <p class="text-[9px] text-slate-500 font-bold uppercase tracking-widest">Human Support</p>
                    </div>
                </div>
                <i class="fas fa-chevron-right text-slate-600 text-xs"></i>
            </a>
        </div>
    </div>

    <div id="aiChatPanel">
        <div class="p-6 pt-12 border-b border-white/5 flex items-center justify-between glass-panel shrink-0">
            <div class="flex items-center gap-4">
                <button onclick="toggleAIChat(false)" class="w-10 h-10 rounded-full bg-white/5 flex items-center justify-center">
                    <i class="fas fa-arrow-left text-slate-400"></i>
                </button>
                <div>
                    <h2 class="font-black text-white uppercase tracking-tighter italic">Vertex <span class="text-blue-500">AI Node</span></h2>
                    <p class="text-[8px] text-emerald-500 font-bold uppercase tracking-widest">Secure Connection</p>
                </div>
            </div>
            <div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse shadow-[0_0_10px_#10b981]"></div>
        </div>

        <div id="chatBody" class="chat-scroll space-y-4">
            <div class="bg-blue-600/10 border border-blue-500/20 p-4 rounded-3xl rounded-tl-none max-w-[85%] text-sm text-blue-100">
                Welcome to Vertex Intelligence. State your system query regarding Protocols, Networks, or Timelines.
            </div>
        </div>

        <div class="px-4 py-3 flex gap-2 overflow-x-auto no-scrollbar shrink-0 border-t border-white/5 bg-[#020617]/50">
            <button onclick="sendQuickQuery('Withdrawal rules?')" class="whitespace-nowrap bg-white/5 border border-white/10 px-4 py-2 rounded-full text-[9px] font-bold uppercase text-slate-400">Withdrawal</button>
            <button onclick="sendQuickQuery('Network info?')" class="whitespace-nowrap bg-white/5 border border-white/10 px-4 py-2 rounded-full text-[9px] font-bold uppercase text-slate-400">Networks</button>
            <button onclick="sendQuickQuery('About System?')" class="whitespace-nowrap bg-white/5 border border-white/10 px-4 py-2 rounded-full text-[9px] font-bold uppercase text-slate-400">About System</button>
        </div>

        <div class="p-4 pb-10 glass-panel shrink-0">
            <div class="relative flex items-center gap-2">
                <input type="text" id="chatInput" placeholder="Enter command..." 
                    class="flex-1 bg-white/5 border border-white/10 rounded-2xl py-4 px-6 text-sm text-white focus:outline-none focus:border-blue-500 transition-all">
                <button onclick="handleUserInput()" class="w-12 h-12 bg-blue-600 rounded-2xl flex items-center justify-center shadow-lg shadow-blue-600/30 active:scale-90 transition-all">
                    <i class="fas fa-paper-plane text-xs text-white"></i>
                </button>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item"><i class="fas fa-house"></i><span>Home</span></a>
        <a href="wallet.html" class="nav-item"><i class="fas fa-wallet"></i><span>Wallet</span></a>
        <div class="relative flex-1 flex justify-center">
            <a href="invest.html" class="invest-fab"><i class="fas fa-bolt-lightning text-2xl text-white"></i></a>
        </div>
        <a href="support.html" class="nav-item active"><i class="fas fa-headset"></i><span>Support</span></a>
        <a href="profile.html" class="nav-item"><i class="fas fa-circle-user"></i><span>Profile</span></a>
    </nav>

    <script>
        function toggleAIChat(show) {
            const panel = document.getElementById('aiChatPanel');
            if(show) {
                panel.style.display = 'flex';
                setTimeout(() => panel.classList.add('active'), 10);
            } else {
                panel.classList.remove('active');
                setTimeout(() => panel.style.display = 'none', 400);
            }
        }

        function addMsg(text, type) {
            const body = document.getElementById('chatBody');
            const wrapper = document.createElement('div');
            wrapper.className = type === 'user' ? "flex justify-end" : "flex justify-start";
            const div = document.createElement('div');
            div.className = type === 'user' 
                ? "bg-white/5 border border-white/10 p-4 rounded-3xl rounded-tr-none max-w-[85%] text-sm text-slate-200"
                : "bg-blue-600/10 border border-blue-500/20 p-4 rounded-3xl rounded-tl-none max-w-[85%] text-sm text-blue-100";
            div.innerText = text;
            wrapper.appendChild(div);
            body.appendChild(wrapper);
            body.scrollTo({ top: body.scrollHeight, behavior: 'smooth' });
        }

        function handleUserInput() {
            const input = document.getElementById('chatInput');
            const msg = input.value.trim();
            if(!msg) return;
            addMsg(msg, 'user');
            input.value = '';
            setTimeout(() => { addMsg(getBotResponse(msg), 'bot'); }, 800);
        }

        function sendQuickQuery(text) {
            addMsg(text, 'user');
            setTimeout(() => { addMsg(getBotResponse(text), 'bot'); }, 600);
        }

        function getBotResponse(input) {
            const q = input.toLowerCase();
            if(q.includes('withdraw')) {
                return "Withdrawal Protocol: Processing time ranges from 2 hours to 48 hours. A 5% withdrawal fee is applied to each transaction.";
            }
            if(q.includes('system') || q.includes('about') || q.includes('what')) {
                return "Vertex Premier is a secure Cloud Mining system. Users can lease computational power to generate crypto assets with automated distribution.";
            }
            if(q.includes('deposit')) {
                return "Deposit Protocol: Exclusively TRC20 network. Please verify your individual wallet node before transfer.";
            }
            if(q.includes('network')) {
                return "Supported Networks: BEP20 and TRC20 nodes are active. Always confirm the destination address.";
            }
            return "Query logged. For high-level human assistance, contact VIP Node via WhatsApp at +1 2713936333.";
        }

        document.getElementById('chatInput').addEventListener('keypress', (e) => {
            if(e.key === 'Enter') handleUserInput();
        });

        window.onload = () => {
            document.getElementById('mainContent').style.display = 'block';
        };
    </script>
</body>
</html>
