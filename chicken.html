<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chicken Game | VERTEX GAMES</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg-body: #0f212e; 
            --bg-card: #213743;
            --stake-green: #00e701;
            --stake-gold: #facc15;
        }
        body { 
            background-color: var(--bg-body); 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            color: #ffffff;
            min-height: 100vh;
        }

        /* حاوية الأطباق */
        .chicken-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            perspective: 1000px;
        }

        .plate-item {
            aspect-ratio: 1;
            background-color: var(--bg-card);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            box-shadow: 0 4px 0 rgba(0,0,0,0.2);
        }

        .plate-item:hover { background-color: #2f4553; transform: translateY(-2px); }
        .plate-item.active { transform: scale(0.95); }

        /* أيقونة الطبق المغطى */
        .plate-cover {
            font-size: 1.5rem;
            color: #557086;
        }

        /* تأثير كشف الدجاجة */
        .revealed-chicken {
            background: radial-gradient(circle, #facc15 0%, #a16207 100%) !important;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* تأثير كشف العظمة */
        .revealed-bone {
            background-color: #071824 !important;
            opacity: 0.6;
        }

        @keyframes popIn {
            0% { transform: scale(0); rotate: -20deg; }
            100% { transform: scale(1); rotate: 0deg; }
        }

        /* لوحة التحكم الجانبية (Stake Style) */
        .control-panel {
            background-color: #213743;
            padding: 20px;
            border-radius: 15px;
        }

        .custom-input {
            background-color: #0f212e;
            border: 2px solid #2f4553;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            outline: none;
            font-weight: 800;
        }

        .bet-button {
            background-color: var(--stake-green);
            color: #000;
            width: 100%;
            padding: 18px;
            border-radius: 8px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.2s;
        }

        .bet-button:disabled { opacity: 0.5; cursor: not-allowed; }
        .cashout-button { background-color: var(--stake-gold); color: #000; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="flex items-center gap-4 mb-8">
        <a href="games.html" class="w-10 h-10 bg-white/5 rounded-xl flex items-center justify-center border border-white/10">
            <i class="fas fa-arrow-left"></i>
        </a>
        <h1 class="text-xl font-black uppercase tracking-tighter">Chicken <span class="text-yellow-400">Royale</span></h1>
    </div>

    <div class="max-w-5xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <div class="lg:col-span-2 order-2 lg:order-1">
            <div class="chicken-grid" id="chickenGrid">
                </div>
        </div>

        <div class="order-1 lg:order-2">
            <div class="control-panel">
                <div class="mb-6">
                    <label class="text-[10px] font-black text-zinc-400 uppercase tracking-widest block mb-2">Bet Amount</label>
                    <div class="relative">
                        <input type="number" id="betAmount" class="custom-input" value="10.00">
                        <span class="absolute right-3 top-3 text-zinc-500 font-bold text-xs uppercase">USD</span>
                    </div>
                </div>

                <div class="mb-8">
                    <label class="text-[10px] font-black text-zinc-400 uppercase tracking-widest block mb-2">Bones Count</label>
                    <select id="bonesCount" class="custom-input appearance-none">
                        <option value="1">1 Bone</option>
                        <option value="3" selected>3 Bones</option>
                        <option value="5">5 Bones</option>
                        <option value="10">10 Bones</option>
                        <option value="24">24 Bones</option>
                    </select>
                </div>

                <div id="gameActions">
                    <button onclick="startGame()" id="mainBtn" class="bet-button">Bet</button>
                </div>

                <div class="mt-6 grid grid-cols-2 gap-2">
                    <div class="bg-black/20 p-3 rounded-lg border border-white/5">
                        <p class="text-[8px] text-zinc-500 font-bold uppercase">Profit</p>
                        <p id="profitDisplay" class="text-sm font-black text-white">$ 0.00</p>
                    </div>
                    <div class="bg-black/20 p-3 rounded-lg border border-white/5">
                        <p class="text-[8px] text-zinc-500 font-bold uppercase">Multiplier</p>
                        <p id="multiplierDisplay" class="text-sm font-black text-zinc-400">1.00x</p>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        const grid = document.getElementById('chickenGrid');
        const mainBtn = document.getElementById('mainBtn');
        let isGameActive = false;
        let bonesPositions = [];
        let revealedCount = 0;

        // إنشاء الـ 25 طبقاً
        function initGrid() {
            grid.innerHTML = '';
            for (let i = 0; i < 25; i++) {
                const item = document.createElement('div');
                item.className = 'plate-item';
                item.innerHTML = '<i class="fas fa-utensils plate-cover"></i>';
                item.onclick = () => revealPlate(i, item);
                grid.appendChild(item);
            }
        }

        function startGame() {
            if (isGameActive) {
                cashout();
                return;
            }

            // إعداد اللعبة
            const boneCount = parseInt(document.getElementById('bonesCount').value);
            bonesPositions = [];
            while(bonesPositions.length < boneCount) {
                let r = Math.floor(Math.random() * 25);
                if(!bonesPositions.includes(r)) bonesPositions.push(r);
            }

            isGameActive = true;
            revealedCount = 0;
            initGrid();
            
            mainBtn.innerText = "Cashout";
            mainBtn.classList.add('cashout-button');
            document.getElementById('multiplierDisplay').innerText = "1.00x";
            document.getElementById('multiplierDisplay').classList.add('text-yellow-400');
        }

        function revealPlate(index, element) {
            if (!isGameActive || element.classList.contains('revealed')) return;

            element.classList.add('revealed', 'active');
            
            if (bonesPositions.includes(index)) {
                // خسارة - ظهرت عظمة
                element.innerHTML = '<i class="fas fa-bone text-white text-2xl"></i>';
                element.className = 'plate-item revealed-bone';
                gameOver();
            } else {
                // ربح - ظهرت دجاجة
                element.innerHTML = '<i class="fas fa-drumstick-bite text-black text-2xl"></i>';
                element.className = 'plate-item revealed-chicken';
                revealedCount++;
                updateMultiplier();
            }
        }

        function updateMultiplier() {
            // محاكاة حساب الملاي (Multiplier)
            let currentMult = (1 + (revealedCount * 0.2)).toFixed(2);
            document.getElementById('multiplierDisplay').innerText = currentMult + "x";
            let bet = parseFloat(document.getElementById('betAmount').value);
            document.getElementById('profitDisplay').innerText = "$ " + (bet * currentMult).toFixed(2);
        }

        function cashout() {
            alert("Congratulations! You cashed out!");
            resetGame();
        }

        function gameOver() {
            isGameActive = false;
            setTimeout(() => {
                alert("BONE! Better luck next time.");
                resetGame();
            }, 300);
        }

        function resetGame() {
            isGameActive = false;
            mainBtn.innerText = "Bet";
            mainBtn.classList.remove('cashout-button');
            document.getElementById('multiplierDisplay').classList.remove('text-yellow-400');
            initGrid();
        }

        initGrid();
    </script>
</body>
</html>
