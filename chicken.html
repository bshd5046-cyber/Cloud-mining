<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chicken Road Pro | VERTEX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0f212e; color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; }

        /* الشارع الكبير */
        .road-scene {
            position: relative;
            height: 350px;
            background: #213743;
            margin-top: 40px;
            display: flex;
            border-top: 5px solid #2f4553;
            border-bottom: 5px solid #2f4553;
            overflow: visible;
        }

        .lane {
            flex: 1;
            border-right: 3px dashed rgba(255,255,255,0.1);
            position: relative;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 20px;
        }

        /* فقاعات الأرباح */
        .multiplier-node {
            width: 70px;
            height: 70px;
            background: rgba(15, 33, 46, 0.8);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 14px;
            color: #9ca3af;
            border: 3px solid #2f4553;
            transition: 0.3s;
            z-index: 5;
        }
        .multiplier-node.active { 
            color: #fbbf24; 
            border-color: #fbbf24; 
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.4);
            transform: scale(1.1);
        }

        /* الدجاجة والأنيميشن */
        #chicken {
            position: absolute;
            font-size: 55px;
            z-index: 100;
            transition: all 0.5s cubic-bezier(0.18, 0.89, 0.32, 1.28);
            filter: drop-shadow(0 10px 5px rgba(0,0,0,0.3));
        }

        #chicken-shadow {
            position: absolute;
            width: 40px;
            height: 10px;
            background: rgba(0,0,0,0.3);
            border-radius: 50%;
            bottom: 5px;
            z-index: 90;
            transition: 0.5s;
        }

        /* الشاحنة */
        .truck-boss {
            position: absolute;
            font-size: 80px;
            top: -150px;
            transition: top 0.4s ease-in;
            z-index: 110;
        }

        /* لوحة التحكم */
        .control-base {
            background: #213743;
            position: fixed;
            bottom: 0;
            width: 100%;
            padding: 30px 20px;
            border-radius: 30px 30px 0 0;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
        }

        .btn-action {
            height: 60px;
            border-radius: 12px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.2s;
        }
        .btn-go { background: #00e701; color: #012e01; }
        .btn-cash { background: #fbbf24; color: #3d2b01; }
        .btn-action:active { transform: scale(0.96); }

        /* تأثير الصدمة */
        .crash-shake { animation: shake 0.3s infinite; }
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            20% { transform: translate(-3px, 0px) rotate(-1deg); }
            50% { transform: translate(-1px, 2px) rotate(1deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
    </style>
</head>
<body>

    <div class="p-6 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <div class="w-2 h-8 bg-green-500 rounded-full"></div>
            <h1 class="font-black text-xl italic uppercase">Chicken Road</h1>
        </div>
        <div class="bg-[#2f4553] px-4 py-2 rounded-xl border border-white/5">
            <span class="text-zinc-400 text-[10px] block font-bold">WALLET</span>
            <span class="font-black text-green-400">$ 12,450.00</span>
        </div>
    </div>

    <div class="road-scene" id="gameArea">
        <div id="chicken-container" style="position: absolute; left: -80px; bottom: 80px; transition: 0.5s;">
            <div id="chicken-shadow"></div>
            <div id="chicken">🐔</div>
        </div>

        <div class="lane"><div class="multiplier-node" id="node-0">3.50x</div></div>
        <div class="lane"><div class="multiplier-node" id="node-1">7.20x</div></div>
        <div class="lane"><div class="multiplier-node" id="node-2">15.0x</div></div>
        <div class="lane" style="border: none;"><div class="multiplier-node" id="node-3">30.0x</div></div>
    </div>

    <div class="control-base">
        <div class="flex gap-4">
            <button onclick="handleAction()" id="primaryBtn" class="btn-action btn-go flex-[2]">Bet / Start</button>
            <button onclick="cashout()" id="cashBtn" class="btn-action btn-cash flex-1 hidden">Cashout</button>
        </div>
        <p class="text-center text-[10px] text-zinc-500 mt-4 font-bold tracking-widest uppercase">Select difficulty & cross the road</p>
    </div>

    <script>
        let currentStep = -1;
        let isPlaying = false;
        const chickenCont = document.getElementById('chicken-container');
        const chickenEmoji = document.getElementById('chicken');
        const shadow = document.getElementById('chicken-shadow');
        const pBtn = document.getElementById('primaryBtn');
        const cBtn = document.getElementById('cashBtn');

        // وظائف الصوت (محاكاة)
        const playSound = (type) => {
            // هنا يمكنك إضافة ملفات mp3 حقيقية
            console.log("Playing sound: " + type);
        };

        function handleAction() {
            if (!isPlaying) {
                startNewGame();
            } else {
                jumpNext();
            }
        }

        function startNewGame() {
            isPlaying = true;
            currentStep = -1;
            resetNodes();
            chickenEmoji.innerHTML = "🐔";
            chickenCont.style.left = "-80px";
            pBtn.innerText = "Jump!";
            cBtn.classList.remove('hidden');
            jumpNext();
        }

        function jumpNext() {
            if (currentStep >= 3) return;
            
            currentStep++;
            playSound('jump');
            
            // حساب مكان الحارة
            const lanes = document.querySelectorAll('.lane');
            const targetLane = lanes[currentStep];
            const targetX = targetLane.offsetLeft + (targetLane.offsetWidth / 2) - 40;

            // أنيميشن القفزة القوية
            chickenEmoji.style.transform = "translateY(-80px) scale(1.2)";
            shadow.style.transform = "scale(0.5)";
            shadow.style.opacity = "0.2";
            
            chickenCont.style.left = targetX + "px";

            setTimeout(() => {
                chickenEmoji.style.transform = "translateY(0) scale(1)";
                shadow.style.transform = "scale(1)";
                shadow.style.opacity = "1";
                
                checkSurvival(currentStep, targetLane);
            }, 400);
        }

        function checkSurvival(step, laneElement) {
            const risk = 0.25; // نسبة المخاطرة 25%
            
            if (Math.random() < risk) {
                hitByTruck(laneElement);
            } else {
                document.getElementById(`node-${step}`).classList.add('active');
                playSound('success');
                if (step === 3) {
                    setTimeout(() => alert("GOD MODE! You crossed the road!"), 300);
                    resetGame();
                }
            }
        }

        function hitByTruck(laneElement) {
            const truck = document.createElement('div');
            truck.className = 'truck-boss';
            truck.innerHTML = "🚛";
            laneElement.appendChild(truck);

            setTimeout(() => {
                truck.style.top = "80px";
                playSound('crash');
                document.body.classList.add('crash-shake');
                
                setTimeout(() => {
                    chickenEmoji.innerHTML = "🍗";
                    isPlaying = false;
                    alert("BOOM! Game Over");
                    resetGame();
                }, 200);
            }, 50);
        }

        function cashout() {
            playSound('cashout');
            alert("Money Secured!");
            resetGame();
        }

        function resetGame() {
            isPlaying = false;
            pBtn.innerText = "Bet / Start";
            cBtn.classList.add('hidden');
            document.body.classList.remove('crash-shake');
            document.querySelectorAll('.truck-boss').forEach(t => t.remove());
            setTimeout(() => { chickenCont.style.left = "-80px"; }, 1000);
        }

        function resetNodes() {
            document.querySelectorAll('.multiplier-node').forEach(n => n.classList.remove('active'));
        }
    </script>
</body>
</html>
