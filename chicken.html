<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chicken Road | VERTEX GAMES</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --road-gray: #4b5563; --line-white: rgba(255,255,255,0.5); }
        body { background-color: #1a2c38; color: white; font-family: sans-serif; overflow: hidden; }

        /* منطقة الشارع */
        .road-container {
            position: relative;
            height: 300px;
            background-color: var(--road-gray);
            margin-top: 50px;
            display: flex;
            border-top: 4px solid #374151;
            border-bottom: 4px solid #374151;
            overflow: visible;
        }

        /* الحارات */
        .lane {
            flex: 1;
            border-right: 2px dashed var(--line-white);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
        }

        /* مضاعف الربح */
        .multiplier-bubble {
            background: rgba(0,0,0,0.6);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            color: #9ca3af;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .multiplier-bubble.active { color: #fbbf24; border-color: #fbbf24; background: rgba(0,0,0,0.8); }

        /* الدجاجة والشاحنة */
        #chicken {
            position: absolute;
            font-size: 40px;
            transition: all 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28);
            z-index: 20;
            bottom: 20px;
            left: -50px; /* البداية خارج الشارع */
        }

        .truck {
            position: absolute;
            font-size: 45px;
            top: -60px;
            transition: top 0.5s ease-in;
            z-index: 10;
        }

        /* لوحة التحكم */
        .bottom-panel {
            background-color: #213743;
            position: fixed;
            bottom: 0;
            width: 100%;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn-go { background-color: #00e701; color: black; font-weight: 900; border-radius: 8px; flex: 1; height: 50px; }
        .btn-cash { background-color: #fbbf24; color: black; font-weight: 900; border-radius: 8px; flex: 1; height: 50px; display: none; }
        
        .difficulty-bar {
            display: flex;
            background: #0f212e;
            border-radius: 8px;
            padding: 4px;
        }
        .diff-opt { flex: 1; text-align: center; font-size: 10px; padding: 6px; border-radius: 6px; cursor: pointer; color: #64748b; font-weight: bold; }
        .diff-opt.active { background: #2f4553; color: white; }
    </style>
</head>
<body>

    <div class="p-4 flex justify-between items-center bg-[#0f212e]">
        <span class="font-bold text-xs">CHICKEN <span class="text-red-500 italic">ROAD</span></span>
        <div class="bg-black/40 px-3 py-1 rounded text-sm font-bold">$ 989,708.78</div>
    </div>

    <div class="road-container" id="road">
        <div id="chicken">🐔</div>
        
        <div class="lane"><div class="multiplier-bubble" id="m1">4.11x</div></div>
        <div class="lane"><div class="multiplier-bubble" id="m2">4.64x</div></div>
        <div class="lane"><div class="multiplier-bubble" id="m3">5.39x</div></div>
        <div class="lane"><div class="multiplier-bubble" id="m4">6.50x</div></div>
        <div class="lane"><div class="multiplier-bubble" id="m5">8.36x</div></div>
        <div class="lane" style="border-right: none;"><div class="multiplier-bubble" id="m6">12.08x</div></div>
    </div>

    <div class="bottom-panel">
        <div class="difficulty-bar">
            <div class="diff-opt">LOW</div>
            <div class="diff-opt active">MEDIUM</div>
            <div class="diff-opt">HIGH</div>
            <div class="diff-opt">EXTREME</div>
        </div>

        <div class="flex gap-3">
            <button onclick="startGame()" id="goBtn" class="btn-go uppercase">Go</button>
            <button onclick="cashout()" id="cashBtn" class="btn-cash uppercase">Cash Out</button>
        </div>
    </div>

    <script>
        const chicken = document.getElementById('chicken');
        const goBtn = document.getElementById('goBtn');
        const cashBtn = document.getElementById('cashBtn');
        let currentLane = -1;
        let isGameActive = false;

        function startGame() {
            if (isGameActive) {
                moveChicken();
            } else {
                // بدء لعبة جديدة
                isGameActive = true;
                currentLane = -1;
                chicken.innerHTML = "🐔";
                chicken.style.left = "-50px";
                chicken.style.bottom = "20px";
                goBtn.innerText = "Jump";
                cashBtn.style.display = "block";
                resetMultipliers();
                moveChicken();
            }
        }

        function moveChicken() {
            currentLane++;
            if (currentLane < 6) {
                const lanes = document.querySelectorAll('.lane');
                const targetLane = lanes[currentLane];
                const laneRect = targetLane.getBoundingClientRect();
                
                // تحريك الدجاجة لمنتصف الحارة
                chicken.style.left = (targetLane.offsetLeft + (targetLane.offsetWidth / 2) - 20) + "px";
                chicken.style.bottom = "120px"; // ترتفع قليلاً لتكون فوق علامة الطريق

                // فحص الخطر (احتمالية ظهور شاحنة)
                if (Math.random() < 0.2) { // 20% نسبة الخسارة
                    setTimeout(() => spawnTruck(currentLane), 300);
                } else {
                    document.getElementById(`m${currentLane+1}`).classList.add('active');
                }
            } else {
                alert("You crossed the road! MAX WIN!");
                cashout();
            }
        }

        function spawnTruck(laneIndex) {
            const lanes = document.querySelectorAll('.lane');
            const truck = document.createElement('div');
            truck.className = 'truck';
            truck.innerHTML = "🚚"; // أو صورة شاحنة
            lanes[laneIndex].appendChild(truck);
            
            setTimeout(() => {
                truck.style.top = "100px"; // الشاحنة تصدم الدجاجة
                chicken.innerHTML = "💥";
                isGameActive = false;
                setTimeout(() => {
                    alert("GAME OVER!");
                    resetGame();
                }, 500);
            }, 50);
        }

        function cashout() {
            alert("Cashed out successfully!");
            resetGame();
        }

        function resetGame() {
            isGameActive = false;
            goBtn.innerText = "Go";
            cashBtn.style.display = "none";
            chicken.style.left = "-50px";
            document.querySelectorAll('.truck').forEach(t => t.remove());
            resetMultipliers();
        }

        function resetMultipliers() {
            document.querySelectorAll('.multiplier-bubble').forEach(m => m.classList.remove('active'));
        }
    </script>
</body>
</html>
