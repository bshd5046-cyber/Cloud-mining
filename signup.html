<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vertex | Register</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
body{background:#010208;color:white;font-family:sans-serif}
.locked-ref{background:rgba(251,191,36,.08)}
</style>

</head>
<body class="flex items-center justify-center min-h-screen">

<div class="w-[420px] space-y-4">

<input id="fullName" placeholder="Full Name" class="w-full p-3 rounded bg-black/50">

<input id="email" placeholder="Email" class="w-full p-3 rounded bg-black/50">

<input id="phone" placeholder="Phone" class="w-full p-3 rounded bg-black/50">

<input id="password" type="password" placeholder="Password" class="w-full p-3 rounded bg-black/50">

<input id="confirmPassword" type="password" placeholder="Confirm Password" class="w-full p-3 rounded bg-black/50">

<input id="inviteCode" placeholder="Invite Code" class="w-full p-3 rounded bg-black/50 text-yellow-400">

<button id="signupBtn" class="w-full bg-white text-black p-3 rounded font-bold">
REGISTER
</button>

<p id="msg" class="text-center text-sm"></p>

</div>


<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import { getFirestore, doc, setDoc, collection, query, where, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


const firebaseConfig = {
apiKey: "AIzaSyAmlAKs35FG4hbcaPkVQ_s0FSaZsvWzFak",
authDomain: "cloud-mining-6f190.firebaseapp.com",
projectId: "cloud-mining-6f190",
storageBucket: "cloud-mining-6f190.firebasestorage.app",
messagingSenderId: "144227180849",
appId: "1:144227180849:web:ccbda447d074efbbddd010"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const signupBtn = document.getElementById("signupBtn");
const inviteInput = document.getElementById("inviteCode");

function showMsg(t){
document.getElementById("msg").innerText=t;
}

function normalize(code){
return String(code||"").trim().toUpperCase();
}

async function checkInvite(code){

const q = query(
collection(db,"users"),
where("referralId","==",code)
);

const snap = await getDocs(q);

return !snap.empty;

}

const params = new URLSearchParams(window.location.search);
const ref = normalize(params.get("ref"));

if(ref){
inviteInput.value = ref;
inviteInput.readOnly = true;
inviteInput.classList.add("locked-ref");
}

signupBtn.onclick = async ()=>{

const name = document.getElementById("fullName").value.trim();
const phone = document.getElementById("phone").value.trim();
const email = document.getElementById("email").value.trim();
const pass = document.getElementById("password").value;
const confirm = document.getElementById("confirmPassword").value;
const invite = normalize(inviteInput.value);

if(!name||!phone||!email||!pass||!confirm||!invite){
showMsg("Fill all fields");
return;
}

if(pass!==confirm){
showMsg("Passwords not match");
return;
}

signupBtn.innerText="Checking Invite...";
signupBtn.disabled=true;

try{

const validInvite = await checkInvite(invite);

if(!validInvite){

signupBtn.disabled=false;
signupBtn.innerText="REGISTER";

showMsg("Invalid invite code");

return;

}

signupBtn.innerText="Creating Account...";

const userCredential = await createUserWithEmailAndPassword(auth,email,pass);

const user = userCredential.user;

const personalCode = user.uid.substring(0,6).toUpperCase();

await setDoc(doc(db,"users",user.uid),{

fullName:name,
phone:phone,
email:email,
referralId:personalCode,
inviteCode:invite,

balance:0,
dailyEarn:0,
totalEarned:0,
teamEarn:0,
totalTeamEarned:0,

walletAddress:"",
securePin:"",

createdAt:serverTimestamp()

});

showMsg("Account created");

setTimeout(()=>{

window.location.href="index.html";

},1500);

}
catch(error){

signupBtn.disabled=false;
signupBtn.innerText="REGISTER";

if(error.code==="auth/email-already-in-use"){
showMsg("Email already registered");
return;
}

if(error.code==="auth/invalid-email"){
showMsg("Invalid email");
return;
}

if(error.code==="auth/weak-password"){
showMsg("Password must be 6 characters");
return;
}

if(error.code==="permission-denied"){
showMsg("Database permission error");
return;
}

showMsg("Unable to create account");

}

};

</script>

</body>
</html>
