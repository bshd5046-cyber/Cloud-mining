<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vertex | Initialize Stellar Node</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Plus+Jakarta+Sans:wght@300;400;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root { --brand: #3b82f6; --bg: #010208; }
        body { 
            background: var(--bg); color: white; font-family: 'Plus Jakarta Sans', sans-serif; 
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            overflow-x: hidden; position: relative;
        }

        /* خلفية السفر عبر النجوم (تأثير براق متحرك) */
        .starfield-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background: radial-gradient(circle at 50% 50%, rgba(59, 130, 246, 0.1) 0%, transparent 80%), #010208;
            background-image: url('https://www.transparenttextures.com/patterns/stardust.png');
            animation: starsMove 100s linear infinite;
        }
        @keyframes starsMove { from { background-position: 0 0; } to { background-position: 1000px 1000px; } }

        /* العنوان الكرومي البراق */
        .chrome-title {
            font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 2.8rem;
            background: linear-gradient(135deg, #fff 20%, #3b82f6 50%, #fff 80%);
            background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(59, 130, 246, 0.6));
            animation: shine 3s linear infinite;
        }
        @keyframes shine { to { background-position: 200% center; } }

        /* حاوية النيون النابضة */
        .stellar-card {
            background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(30px); border-radius: 40px; position: relative;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
        }
        .stellar-card::before {
            content: ""; position: absolute; -inset: 1px; border-radius: 41px; z-index: -1;
            background: linear-gradient(135deg, transparent, var(--brand), transparent);
            animation: borderFlow 3s infinite;
        }
        @keyframes borderFlow { 0% { opacity: 0.2; } 50% { opacity: 0.7; } 100% { opacity: 0.2; } }

        /* الحقول البراقة */
        .bright-input {
            background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.05);
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .bright-input:focus-within {
            border-color: var(--brand); transform: scale(1.02);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
        }

        .eye-icon { cursor: pointer; opacity: 0.5; transition: 0.3s; }
        .eye-icon:hover { opacity: 1; color: var(--brand); }

        /* زر الإحالة الذهبي المذهل */
        .referral-field {
            border: 1px dashed #f59e0b !important;
            box-shadow: inset 0 0 15px rgba(245, 158, 11, 0.1);
        }

        /* زر الإنشاد الأبيض المشتعل */
        .btn-ignite {
            background: #ffffff; color: #000; font-weight: 900;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.5);
            transition: 0.4s;
        }
        .btn-ignite:hover {
            box-shadow: 0 0 50px rgba(255, 255, 255, 0.8);
            transform: translateY(-3px);
        }

        #alertBox { transform: translateY(-150%); transition: 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55); }
        #alertBox.show { transform: translateY(0); }
    </style>
</head>
<body>
    <div class="starfield-bg"></div>

    <div id="alertBox" class="fixed top-8 left-6 right-6 z-[1000] hidden">
        <div class="p-5 rounded-3xl border border-white/20 bg-black/80 backdrop-blur-3xl flex items-center gap-4 shadow-[0_0_40px_rgba(0,0,0,0.5)]">
            <i id="alertIcon" class="fas fa-bolt-lightning text-blue-500 text-xl"></i>
            <p id="alertMsg" class="text-xs font-black uppercase tracking-widest text-white"></p>
        </div>
    </div>

    <div class="w-full max-w-[480px] p-6 relative z-10">
        <div class="text-center mb-10">
            <h1 class="chrome-title">VERTEX</h1>
            <p class="text-[10px] font-black text-blue-400 uppercase tracking-[0.6em] mt-2">Initialize Node Protocol</p>
        </div>

        <div class="stellar-card p-8 md:p-10 space-y-4">
            <div class="bright-input rounded-2xl p-4 flex items-center">
                <i class="fas fa-user-plus text-blue-500/60 mr-4"></i>
                <input type="text" id="fullName" placeholder="OPERATOR NAME" class="bg-transparent border-none outline-none w-full text-xs font-black tracking-widest">
            </div>

            <div class="flex gap-3">
                <div class="bright-input rounded-2xl p-4 w-32 flex items-center">
                    <select id="countryCode" class="bg-transparent border-none outline-none text-[10px] font-black text-blue-400 w-full">
                        <option value="+961">🇱🇧 +961</option>
                        <option value="+966">🇸🇦 +966</option>
                        <option value="+971">🇦🇪 +971</option>
                        <option value="+20">🇪🇬 +20</option>
                        <option value="+964">🇮🇶 +964</option>
                        <option value="+962">🇯🇴 +962</option>
                        <option value="+965">🇰🇼 +965</option>
                        <option value="+974">🇶🇦 +974</option>
                        <option value="+212">🇲🇦 +212</option>
                        <option value="+213">🇩🇿 +213</option>
                        <option value="+216">🇹🇳 +216</option>
                        <option value="+973">🇧🇭 +973</option>
                        <option value="+968">🇴🇲 +968</option>
                        <option value="+218">🇱🇾 +218</option>
                        <option value="+963">🇸🇾 +963</option>
                        <option value="+970">🇵🇸 +970</option>
                        <option value="+967">🇾🇪 +967</option>
                        <option value="+249">🇸🇩 +249</option>
                        <option value="+252">🇸🇴 +252</option>
                        <option value="+222">🇲🇷 +222</option>
                    </select>
                </div>
                <div class="bright-input rounded-2xl p-4 flex-1">
                    <input type="tel" id="phone" placeholder="PHONE NUMBER" class="bg-transparent border-none outline-none w-full text-xs font-black tracking-widest">
                </div>
            </div>

            <div class="bright-input rounded-2xl p-4 flex items-center">
                <i class="fas fa-satellite text-blue-500/60 mr-4"></i>
                <input type="email" id="email" placeholder="ACCESS EMAIL" class="bg-transparent border-none outline-none w-full text-xs font-black tracking-widest">
            </div>

            <div class="bright-input rounded-2xl p-4 flex items-center">
                <i class="fas fa-shield-halved text-blue-500/60 mr-4"></i>
                <input type="password" id="password" placeholder="PASSWORD" class="bg-transparent border-none outline-none w-full text-xs font-black tracking-widest">
                <i class="fas fa-eye eye-icon ml-2" onclick="togglePass('password')"></i>
            </div>

            <div class="bright-input rounded-2xl p-4 flex items-center">
                <i class="fas fa-lock text-blue-500/60 mr-4"></i>
                <input type="password" id="confirmPassword" placeholder="CONFIRM PASSWORD" class="bg-transparent border-none outline-none w-full text-xs font-black tracking-widest">
                <i class="fas fa-eye eye-icon ml-2" onclick="togglePass('confirmPassword')"></i>
            </div>

            <div class="bright-input referral-field rounded-2xl p-4 flex items-center">
                <i class="fas fa-key text-amber-500 mr-4"></i>
                <input type="text" id="inviteCode" placeholder="MANDATORY INVITE CODE" class="bg-transparent border-none outline-none w-full text-[11px] font-black text-amber-500 placeholder:text-amber-900/40">
            </div>

            <button id="signupBtn" class="btn-ignite w-full py-5 rounded-2xl text-[11px] uppercase tracking-[0.3em] mt-8">
                ESTABLISH NODE
            </button>

            <div class="text-center pt-8">
                <a href="login.html" class="text-gray-500 text-[9px] font-black uppercase tracking-[0.4em] hover:text-white transition-all">Back to Terminal</a>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAmlAKs35FG4hbcaPkVQ_s0FSaZsvWzFak",
            authDomain: "cloud-mining-6f190.firebaseapp.com",
            projectId: "cloud-mining-6f190",
            storageBucket: "cloud-mining-6f190.firebasestorage.app",
            messagingSenderId: "144227180849",
            appId: "1:144227180849:web:ccbda447d074efbbddd010"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // وظيفة العين لإظهار الباسورد
        window.togglePass = (id) => {
            const el = document.getElementById(id);
            el.type = el.type === 'password' ? 'text' : 'password';
        };

        function showAlert(message) {
            const box = document.getElementById('alertBox');
            const msg = document.getElementById('alertMsg');
            msg.innerText = message;
            box.classList.remove('hidden');
            setTimeout(() => box.classList.add('show'), 10);
            setTimeout(() => {
                box.classList.remove('show');
                setTimeout(() => box.classList.add('hidden'), 500);
            }, 3000);
        }

        document.getElementById('signupBtn').addEventListener('click', async () => {
            const name = document.getElementById('fullName').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const email = document.getElementById('email').value.trim();
            const pass = document.getElementById('password').value;
            const confirm = document.getElementById('confirmPassword').value;
            const invite = document.getElementById('inviteCode').value.trim();

            if (!name || !phone || !email || !pass || !invite) {
                showAlert("CRITICAL: ALL CHANNELS MUST BE AUTHORIZED");
                return;
            }

            if (pass !== confirm) {
                showAlert("PROTOCOL ERROR: PASSWORD MISMATCH");
                return;
            }

            const btn = document.getElementById('signupBtn');
            btn.innerText = "LINKING CORE...";
            btn.disabled = true;

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, pass);
                const user = userCredential.user;
                const personalCode = user.uid.substring(0, 5).toUpperCase();

                await setDoc(doc(db, "users", user.uid), {
                    fullName: name,
                    phone: document.getElementById('countryCode').value + phone,
                    email: email,
                    referralId: personalCode,
                    inviteCode: invite,
                    balance: 0,
                    createdAt: new Date().toISOString()
                });

                showAlert("SUCCESS: NODE ESTABLISHED");
                setTimeout(() => window.location.href = "index.html", 1500);
            } catch (error) {
                btn.innerText = "ESTABLISH NODE";
                btn.disabled = false;
                showAlert(error.message.toUpperCase());
            }
        });
    </script>
</body>
</html>
