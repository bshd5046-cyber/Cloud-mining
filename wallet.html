<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wallet | VERTEX PREMIER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { --bg-dark: #020617; --primary: #3b82f6; --nav-bg: rgba(7, 10, 22, 0.98); }
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body { background-color: var(--bg-dark); font-family: 'Plus Jakarta Sans', sans-serif; color: #ffffff; background: radial-gradient(circle at 50% 0%, rgba(59, 130, 246, 0.16) 0%, transparent 40%), #020617; min-height: 100vh; margin: 0; padding: 0; overflow-x: hidden; }
        .bottom-nav { background: var(--nav-bg); backdrop-filter: blur(20px); border-top: 1px solid rgba(255, 255, 255, 0.05); height: 85px; position: fixed; bottom: 0; left: 0; right: 0; display: flex; justify-content: space-around; align-items: center; z-index: 1000; padding-bottom: 15px; }
        .invest-fab { width: 68px; height: 68px; background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; position: relative; top: -28px; border: 6px solid #020617; box-shadow: 0 12px 30px rgba(37, 99, 235, 0.4); }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; color: #475569; text-decoration: none; font-size: 10px; font-weight: 700; }
        .nav-item i { font-size: 20px; margin-bottom: 4px; }
        .nav-item.active { color: var(--primary); }
        .crypto-card { background: linear-gradient(135deg, rgba(30, 64, 175, 0.5) 0%, rgba(124, 58, 237, 0.4) 100%); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 2.5rem; }
        .glass-panel { background: rgba(15, 23, 42, 0.62); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .slide-panel { position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(15px); z-index: 2000; display: none; align-items: flex-end; }
        .panel-content { width: 100%; background: #070b16; border-radius: 3rem 3rem 0 0; padding: 2rem; border-top: 1px solid rgba(59, 130, 246, 0.3); transform: translateY(100%); transition: 0.4s cubic-bezier(0.165, 0.84, 0.44, 1); max-height: 95vh; overflow-y: auto; padding-bottom: 5rem; }
        .show-panel { display: flex !important; }
        .show-panel .panel-content { transform: translateY(0); }
        .field { width: 100%; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); color: white; border-radius: 1.25rem; padding: 15px; outline: none; font-size: 14px; }
        .ios-alert { border-radius: 24px !important; background: rgba(10, 15, 29, 0.95) !important; backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1) !important; color: white !important; z-index: 9999 !important; }
        .ios-btn { border-radius: 14px !important; font-weight: 800 !important; text-transform: uppercase !important; }
        .animate-fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="pb-32">

    <div class="px-8 pt-12 flex justify-between items-center">
        <div>
            <p class="text-[10px] uppercase tracking-[0.2em] text-slate-500 font-black">Capital Management</p>
            <h1 class="text-3xl font-black italic uppercase">My <span class="text-blue-500">Vault</span></h1>
        </div>
    </div>

    <div class="px-6 mt-8">
        <div class="crypto-card p-8 relative overflow-hidden">
            <p class="text-blue-200 text-[10px] uppercase tracking-widest font-black opacity-60">Available Balance</p>
            <h2 id="userBalance" class="text-5xl font-black mt-3 tracking-tighter">$0.00</h2>
            <div class="mt-8 flex justify-between items-end">
                <div>
                    <p id="userName" class="text-xs font-bold tracking-widest uppercase text-slate-100 italic">---</p>
                </div>
                <div class="text-right">
                    <span id="userTier" class="text-[10px] font-black text-blue-400 border border-blue-400/30 px-3 py-1 rounded-lg uppercase">Tier 1</span>
                </div>
            </div>
        </div>
    </div>

    <div class="px-6 mt-6 flex gap-4">
        <button onclick="document.getElementById('depositPanel').classList.add('show-panel')" class="flex-1 bg-blue-600 py-5 rounded-[2rem] font-black uppercase text-[11px] tracking-widest active:scale-95 transition-transform">Deposit</button>
        <button id="withdrawTrigger" class="flex-1 glass-panel py-5 rounded-[2rem] font-black uppercase text-[11px] tracking-widest active:scale-95 transition-transform">Withdraw</button>
    </div>

    <div class="px-6 mt-10">
        <h3 class="font-black text-[11px] uppercase tracking-[0.3em] text-slate-600 italic mb-4 ml-2">Financial Logs</h3>
        <div id="transactionHistory" class="glass-panel rounded-[2.5rem] p-4 min-h-[150px] overflow-hidden">
            <p class="text-center text-[10px] text-slate-500 py-12 italic opacity-50">Syncing with secure node...</p>
        </div>
    </div>

    <div id="depositPanel" class="slide-panel">
        <div class="panel-content text-center">
            <div class="flex justify-between items-center mb-8">
                <h3 class="text-xl font-black uppercase text-blue-500 italic">Deposit Asset</h3>
                <button onclick="this.closest('.slide-panel').classList.remove('show-panel')" class="w-10 h-10 rounded-full bg-white/5 flex items-center justify-center">&times;</button>
            </div>
            <div id="qrcode" class="mb-6 bg-white p-4 rounded-[2rem] inline-block mx-auto shadow-2xl shadow-blue-500/20"></div>
            <p id="depositAddrText" class="text-[10px] font-mono text-blue-400 font-bold mb-6 break-all px-4">---</p>
            <button id="copyBtn" class="w-full bg-blue-600/10 text-blue-400 border border-blue-400/20 py-4 rounded-2xl font-black uppercase mb-8 active:bg-blue-600/20 transition-all">Copy Address</button>
            <div class="border-t border-white/5 pt-6 text-left">
                <input id="txHash" type="text" class="field mb-4" placeholder="Transaction Hash (TxID)">
                <button id="submitDeposit" class="w-full bg-emerald-600 py-5 rounded-2xl font-black uppercase tracking-widest shadow-lg shadow-emerald-900/40">Verify Payment</button>
            </div>
        </div>
    </div>

    <div id="withdrawPanel" class="slide-panel">
        <div class="panel-content">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-black uppercase italic text-blue-500">Initiate Payout</h3>
                <button onclick="this.closest('.slide-panel').classList.remove('show-panel')" class="w-10 h-10 rounded-full bg-white/5 flex items-center justify-center">&times;</button>
            </div>
            <div class="space-y-4">
                <div class="bg-blue-500/5 p-4 rounded-2xl border border-blue-500/10 text-center">
                    <p class="text-[10px] text-blue-400 font-black uppercase tracking-widest">Available to Withdraw</p>
                    <p class="text-xl font-black mt-1" id="withdrawAvailableBalance">$0.00</p>
                </div>
                <select id="withdrawNetwork" class="field">
                    <option value="TRC20">USDT (TRC20) - Fast</option>
                    <option value="BEP20">USDT (BEP20) - Low Fee</option>
                </select>
                <input id="withdrawAddress" type="text" class="field" placeholder="Recipient Wallet Address">
                <input id="withdrawAmount" type="number" class="field" placeholder="Amount (Min $10.00)">
                <input id="vaultPin" type="password" maxlength="6" class="field text-center tracking-[1.2em] font-black" placeholder="******">
                <button id="submitWithdrawBtn" class="w-full bg-blue-600 py-5 rounded-2xl font-black uppercase tracking-widest active:scale-95 transition-transform shadow-xl shadow-blue-900/40">Confirm Withdrawal</button>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item"><i class="fas fa-house"></i><span>Home</span></a>
        <a href="wallet.html" class="nav-item active"><i class="fas fa-wallet"></i><span>Wallet</span></a>
        <div class="relative flex-1 flex justify-center"><a href="invest.html" class="invest-fab"><i class="fas fa-bolt-lightning text-white"></i></a></div>
        <a href="support.html" class="nav-item"><i class="fas fa-headset"></i><span>Support</span></a>
        <a href="profile.html" class="nav-item"><i class="fas fa-circle-user"></i><span>Profile</span></a>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, collection, query, addDoc, serverTimestamp, updateDoc, where, getDocs, increment, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAmlAKs35FG4hbcaPkVQ_s0FSaZsvWzFak",
            authDomain: "cloud-mining-6f190.firebaseapp.com",
            projectId: "cloud-mining-6f190",
            storageBucket: "cloud-mining-6f190.firebasestorage.app",
            messagingSenderId: "144227180849",
            appId: "1:144227180849:web:ccbda447d074efbbddd010"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let currentUserData = null;

        function showError(msg) {
            Swal.fire({
                icon: 'error', title: 'ACCESS DENIED', text: msg,
                background: '#070b16', color: '#fff', confirmButtonColor: '#3b82f6',
                backdrop: `rgba(0,0,0,0.8)`, customClass: { popup: 'ios-alert', confirmButton: 'ios-btn' }
            });
        }

        onAuthStateChanged(auth, user => {
            if (user) {
                currentUser = user;
                onSnapshot(doc(db, "users", user.uid), (snap) => {
                    currentUserData = snap.data();
                    if (currentUserData) {
                        document.getElementById('userBalance').innerText = `$${parseFloat(currentUserData.balance || 0).toLocaleString(undefined, {minimumFractionDigits: 2})}`;
                        document.getElementById('userName').innerText = currentUserData.fullName || "IDENTIFIED USER";
                        document.getElementById('userTier').innerText = currentUserData.tier || "Tier 1";
                        if (currentUserData.depositAddress) enableAddressUI(currentUserData.depositAddress);
                    }
                });
                loadTransactions(user.uid);
            } else {
                window.location.href = 'login.html';
            }
        });

        // Withdrawal Logic
        document.getElementById('withdrawTrigger').onclick = () => {
            if (!currentUserData?.securePin) {
                return Swal.fire({
                    icon: 'lock', title: 'Security Required', text: 'Please set your 6-digit Vault PIN in Profile.',
                    showCancelButton: true, confirmButtonText: 'Go to Profile', background: '#070b16', color: '#fff'
                }).then(res => { if(res.isConfirmed) window.location.href='profile.html' });
            }
            document.getElementById('withdrawAvailableBalance').innerText = `$${parseFloat(currentUserData.balance || 0).toFixed(2)}`;
            document.getElementById('withdrawPanel').classList.add('show-panel');
        };

        document.getElementById('submitWithdrawBtn').onclick = async () => {
            const btn = document.getElementById('submitWithdrawBtn');
            const amount = parseFloat(document.getElementById('withdrawAmount').value);
            const address = document.getElementById('withdrawAddress').value;
            const enteredPin = document.getElementById('vaultPin').value;
            const network = document.getElementById('withdrawNetwork').value;

            if (!address || isNaN(amount) || enteredPin.length !== 6) return showError("Invalid parameters provided.");
            if (enteredPin !== currentUserData.securePin) return showError("Unauthorized Security PIN.");
            if (amount < 10) return showError("Minimum payout is $10.00.");
            if (amount > (currentUserData.balance || 0)) return showError("Insufficient available balance.");

            try {
                btn.disabled = true; btn.innerText = "Encrypting...";
                
                const withdrawalData = {
                    uid: currentUser.uid,
                    email: currentUser.email,
                    fullName: currentUserData.fullName,
                    amount: amount,
                    address: address,
                    network: network,
                    status: "pending",
                    timestamp: serverTimestamp(),
                    type: "Withdrawal"
                };

                await updateDoc(doc(db, "users", currentUser.uid), { balance: increment(-amount) });
                await addDoc(collection(db, "withdrawals"), withdrawalData);

                Swal.fire({ icon: 'success', title: 'Request Sent', text: 'Transaction is being verified by the node.', background: '#070b16', color: '#fff' });
                document.getElementById('withdrawPanel').classList.remove('show-panel');
                document.getElementById('vaultPin').value = "";
                document.getElementById('withdrawAmount').value = "";
            } catch (e) {
                showError("Relay timeout.");
            } finally {
                btn.disabled = false; btn.innerText = "Confirm Withdrawal";
            }
        };

        // LOAD TRANSACTIONS (FIXED)
        async function loadTransactions(uid) {
            const cont = document.getElementById('transactionHistory');

            // دمج سحوبات وإيداعات المستخدم من المجموعات العامة مباشرة كما في صورك
            const wQ = query(collection(db, "withdrawals"), where("uid", "==", uid));
            const dQ = query(collection(db, "deposits"), where("uid", "==", uid));

            const syncLogs = () => {
                getDocs(wQ).then(wSnap => {
                    getDocs(dQ).then(dSnap => {
                        let allTx = [];
                        wSnap.forEach(doc => allTx.push({id: doc.id, ...doc.data()}));
                        dSnap.forEach(doc => allTx.push({id: doc.id, ...doc.data()}));

                        if (allTx.length === 0) {
                            cont.innerHTML = '<p class="text-center text-[10px] py-12 opacity-30 italic font-black uppercase tracking-widest">No Activity Found</p>';
                            return;
                        }

                        // ترتيب يدوي للأحدث
                        allTx.sort((a,b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));

                        cont.innerHTML = "";
                        allTx.forEach(tx => {
                            let color = 'text-amber-500';
                            let icon = 'fa-clock';
                            if (tx.status === 'approved' || tx.status === 'success') { color = 'text-emerald-500'; icon = 'fa-check-circle'; }
                            if (tx.status === 'rejected' || tx.status === 'failed') { color = 'text-red-500'; icon = 'fa-times-circle'; }

                            const date = tx.timestamp ? new Date(tx.timestamp.seconds * 1000).toLocaleDateString([], {month:'short', day:'numeric'}) : 'Pending';

                            cont.innerHTML += `
                            <div class="p-4 border-b border-white/5 flex justify-between items-center animate-fade-in">
                                <div class="flex items-center gap-3">
                                    <div class="w-8 h-8 rounded-full bg-white/5 flex items-center justify-center">
                                        <i class="fas ${tx.type === 'Deposit' ? 'fa-arrow-down text-emerald-500' : 'fa-arrow-up text-blue-500'} text-[10px]"></i>
                                    </div>
                                    <div>
                                        <span class="text-[10px] font-black uppercase text-slate-300 tracking-tighter">${tx.type || 'TX'}</span>
                                        <p class="text-[8px] text-slate-500 font-bold">${date}</p>
                                    </div>
                                </div>
                                <div class="text-right">
                                    <p class="text-xs font-black italic">$${parseFloat(tx.amount || 0).toFixed(2)}</p>
                                    <p class="text-[8px] font-black uppercase ${color} flex items-center justify-end gap-1">
                                        <i class="fas ${icon} text-[7px]"></i> ${tx.status || 'pending'}
                                    </p>
                                </div>
                            </div>`;
                        });
                    });
                });
            };

            // تشغيل التزامن كل 5 ثواني أو عند التحميل
            syncLogs();
            setInterval(syncLogs, 10000); 
        }

        // Deposit Logic
        document.getElementById('submitDeposit').onclick = async () => {
            const hash = document.getElementById('txHash').value;
            if (!hash || hash.length < 10) return showError("Valid Transaction Hash required.");
            
            const depData = {
                uid: currentUser.uid,
                email: currentUser.email,
                fullName: currentUserData.fullName,
                amount: 0,
                hash: hash,
                status: "pending",
                timestamp: serverTimestamp(),
                type: "Deposit"
            };

            await addDoc(collection(db, "deposits"), depData);
            Swal.fire({ icon: 'success', title: 'Hash Received', text: 'Nodes are verifying your transaction.', background: '#070b16', color: '#fff' });
            document.getElementById('txHash').value = "";
            document.getElementById('depositPanel').classList.remove('show-panel');
        };

        function enableAddressUI(addr) {
            document.getElementById('depositAddrText').innerText = addr;
            const qrBox = document.getElementById('qrcode');
            qrBox.innerHTML = "";
            new QRCode(qrBox, { text: addr, width: 140, height: 140, colorDark : "#000000", colorLight : "#ffffff" });
        }

        document.getElementById('copyBtn').onclick = () => {
            navigator.clipboard.writeText(document.getElementById('depositAddrText').innerText);
            Swal.fire({ icon: 'success', title: 'Copied', toast: true, position: 'top', showConfirmButton: false, timer: 1500 });
        };
    </script>
</body>
</html>
