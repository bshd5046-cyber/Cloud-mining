<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wallet | VERTEX PREMIER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { --bg-dark: #020617; --primary: #3b82f6; --nav-bg: rgba(7, 10, 22, 0.98); }
        body { background-color: var(--bg-dark); font-family: 'Plus Jakarta Sans', sans-serif; color: #ffffff; background: radial-gradient(circle at 50% 0%, rgba(59, 130, 246, 0.15) 0%, transparent 50%), #020617; min-height: 100vh; margin: 0; padding: 0; overflow-x: hidden; }
        .bottom-nav { background: var(--nav-bg); backdrop-filter: blur(20px); border-top: 1px solid rgba(255, 255, 255, 0.05); height: 85px; position: fixed; bottom: 0; left: 0; right: 0; display: flex; justify-content: space-around; align-items: center; z-index: 1000; padding-bottom: 15px; }
        .invest-fab { width: 68px; height: 68px; background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; position: relative; top: -28px; border: 6px solid #020617; box-shadow: 0 12px 30px rgba(37, 99, 235, 0.4); }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; color: #475569; text-decoration: none; font-size: 10px; font-weight: 700; }
        .nav-item i { font-size: 20px; margin-bottom: 4px; }
        .nav-item.active { color: var(--primary); }
        .crypto-card { background: linear-gradient(135deg, rgba(30, 64, 175, 0.4) 0%, rgba(124, 58, 237, 0.4) 100%); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 2.5rem; }
        .glass-panel { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .slide-panel { position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(15px); z-index: 2000; display: none; align-items: flex-end; }
        .panel-content { width: 100%; background: #070b16; border-radius: 3rem 3rem 0 0; padding: 2.5rem; border-top: 1px solid rgba(59, 130, 246, 0.2); transform: translateY(100%); transition: 0.4s cubic-bezier(0.165, 0.84, 0.44, 1); }
        .show-panel { display: flex !important; }
        .show-panel .panel-content { transform: translateY(0); }
        input, select { background: rgba(255,255,255,0.05) !important; border: 1px solid rgba(255,255,255,0.1) !important; color: white !important; }
        .swal2-popup { background: #0f172a !important; color: white !important; border-radius: 2rem !important; border: 1px solid rgba(59, 130, 246, 0.2) !important; }
    </style>
</head>
<body class="pb-32">

    <div id="mainContent">
        <div class="px-8 pt-16 flex justify-between items-center">
            <h1 class="text-3xl font-black italic uppercase tracking-tighter">My <span class="text-blue-500">Vault</span></h1>
            <div class="w-12 h-12 rounded-2xl bg-blue-500/10 flex items-center justify-center border border-blue-500/20">
                <i class="fas fa-shield-halved text-blue-500 text-xl"></i>
            </div>
        </div>

        <div class="px-6 mt-8">
            <div class="crypto-card p-9 text-center sm:text-left">
                <p class="text-blue-200 text-[10px] uppercase tracking-[0.2em] font-black opacity-60">Secured Balance</p>
                <h2 id="userBalance" class="text-5xl font-black mt-2 tracking-tighter">$ 0.00</h2>
                <div class="mt-8 flex justify-between items-end">
                    <p id="userName" class="text-sm font-black tracking-widest italic uppercase text-slate-200">---</p>
                    <p class="text-xs font-black text-white italic">USDT Ecosystem</p>
                </div>
            </div>
        </div>

        <div class="px-6 mt-10 flex gap-4">
            <button id="depositTrigger" class="flex-1 bg-blue-600 py-5 rounded-[2rem] font-black uppercase text-[11px] tracking-widest active:scale-95 transition-all">Deposit</button>
            <button id="withdrawTrigger" class="flex-1 glass-panel py-5 rounded-[2rem] font-black uppercase text-[11px] tracking-widest active:scale-95 transition-all">Withdraw</button>
        </div>

        <div class="px-6 mt-8">
            <h3 class="font-black text-[11px] uppercase tracking-[0.3em] text-slate-600 mb-6 px-2">Recent Transactions</h3>
            <div id="transactionHistory" class="glass-panel rounded-[2.5rem] overflow-hidden p-4 space-y-4">
                <p class="text-center text-[10px] text-slate-500 py-4 font-bold uppercase italic">Scanning Blockchain...</p>
            </div>
        </div>
    </div>

    <div id="depositPanel" class="slide-panel">
        <div class="panel-content">
            <div class="flex items-center gap-4 mb-8">
                <button id="closeDep" class="w-10 h-10 rounded-full bg-white/5 flex items-center justify-center"><i class="fas fa-arrow-left text-sm"></i></button>
                <h3 class="text-xl font-black uppercase italic text-blue-500">Deposit Node</h3>
            </div>
            <div class="glass-panel p-6 rounded-2xl mb-6">
                <p class="text-[10px] text-slate-500 uppercase font-black mb-2">Admin TRC20 Address</p>
                <div class="flex justify-between items-center bg-black/40 p-4 rounded-xl border border-white/5">
                    <p id="walletAddrDisplay" class="text-[10px] font-mono text-blue-400 truncate">Fetching...</p>
                    <button id="copyBtn" class="text-blue-500 ml-2"><i class="fas fa-copy"></i></button>
                </div>
            </div>
            <input type="number" id="depAmount" placeholder="Amount USDT" class="w-full p-5 rounded-2xl mb-4 outline-none">
            <button id="confirmDepositBtn" class="w-full bg-blue-600 py-5 rounded-2xl font-black uppercase">Confirm Request</button>
        </div>
    </div>

    <div id="withdrawPanel" class="slide-panel">
        <div class="panel-content">
            <div class="flex items-center justify-between mb-6">
                <div class="flex items-center gap-4">
                    <button id="closeWith" class="w-10 h-10 rounded-full bg-white/5 flex items-center justify-center"><i class="fas fa-arrow-left text-sm"></i></button>
                    <h3 class="text-xl font-black uppercase italic text-red-500">Withdrawal</h3>
                </div>
                <button id="infoTrigger" class="w-10 h-10 rounded-full bg-blue-500/10 flex items-center justify-center border border-blue-500/20">
                    <i class="fas fa-info text-blue-500"></i>
                </button>
            </div>
            
            <div class="space-y-4">
                <select id="withdrawNetwork" class="w-full p-5 rounded-2xl outline-none">
                    <option value="TRC20">USDT (TRC20)</option>
                    <option value="BEP20">USDT (BEP20)</option>
                </select>
                <input type="text" id="withdrawAddr" placeholder="Destination Address" class="w-full p-5 rounded-2xl outline-none">
                <input type="number" id="withdrawAmount" placeholder="Amount" class="w-full p-5 rounded-2xl outline-none">
                <button id="startWithdrawBtn" class="w-full bg-white text-black py-5 rounded-2xl font-black uppercase tracking-widest">Verify & Next</button>
            </div>
        </div>
    </div>

    <div id="pinPanel" class="slide-panel !z-[3000]">
        <div class="panel-content !bg-slate-950">
            <h3 class="text-center font-black mb-6 uppercase tracking-widest text-blue-400">Security Vault Access</h3>
            <input type="password" id="withdrawPin" maxlength="6" inputmode="numeric" placeholder="••••••" class="w-full text-center text-3xl tracking-[0.5em] p-6 rounded-2xl bg-black/40 border border-blue-500/30 mb-6 outline-none">
            <button id="finalConfirmBtn" class="w-full bg-blue-500 py-5 rounded-2xl font-black uppercase">Verify & Submit</button>
            <button id="closePin" class="w-full mt-4 text-[10px] font-black text-slate-500 uppercase">Cancel Action</button>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item"><i class="fas fa-house"></i><span>Home</span></a>
        <a href="wallet.html" class="nav-item active"><i class="fas fa-wallet"></i><span>Wallet</span></a>
        <div class="relative flex-1 flex justify-center"><a href="invest.html" class="invest-fab"><i class="fas fa-bolt-lightning text-2xl text-white"></i></a></div>
        <a href="support.html" class="nav-item"><i class="fas fa-headset"></i><span>Support</span></a>
        <a href="profile.html" class="nav-item"><i class="fas fa-circle-user"></i><span>Profile</span></a>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, addDoc, collection, query, orderBy, limit, getDoc, getDocs, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAmlAKs35FG4hbcaPkVQ_s0FSaZsvWzFak",
            authDomain: "cloud-mining-6f190.firebaseapp.com",
            projectId: "cloud-mining-6f190",
            storageBucket: "cloud-mining-6f190.firebasestorage.app",
            messagingSenderId: "144227180849",
            appId: "1:144227180849:web:ccbda447d074efbbddd010"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        let userData = {};

        const openP = (id) => document.getElementById(id).classList.add('show-panel');
        const closeP = (id) => document.getElementById(id).classList.remove('show-panel');

        // Info Button Logic
        document.getElementById('infoTrigger').onclick = () => {
            Swal.fire({
                title: 'Withdrawal Terms',
                html: `<div class="text-left text-[11px] leading-relaxed space-y-2 opacity-80">
                    <p>• Processing takes 2 - 96 business hours.</p>
                    <p>• In case of cancellation, you can re-apply immediately.</p>
                    <p>• Withdrawal Fee: 5% Network processing fee.</p>
                    <p>• Limit: One withdrawal every 5 business days after approval.</p>
                    <p>• Warning: We are not responsible for funds lost due to incorrect address or network selection.</p>
                </div>`,
                confirmButtonText: 'Understood'
            });
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                onSnapshot(doc(db, "users", user.uid), (docSnap) => {
                    if (docSnap.exists()) {
                        userData = docSnap.data();
                        document.getElementById('userBalance').innerText = `$${parseFloat(userData.balance || 0).toLocaleString(undefined, {minimumFractionDigits: 2})}`;
                        document.getElementById('userName').innerText = userData.fullName || "AGENT";
                        document.getElementById('walletAddrDisplay').innerText = userData.walletAddress || "No Admin Address";
                        fetchTransactions(user.uid);
                    }
                });
            } else { window.location.replace('login.html'); }
        });

        // Withdrawal Lock Logic
        document.getElementById('withdrawTrigger').onclick = async () => {
            if(!auth.currentUser) return;
            
            // Check for pending withdrawals
            const q = query(collection(db, "users", auth.currentUser.uid, "withdrawals"), where("status", "==", "pending"));
            const pendingSnap = await getDocs(q);
            if (!pendingSnap.empty) {
                return Swal.fire('Action Locked', 'You have a pending withdrawal request under review.', 'warning');
            }

            // Check for 5-day rule
            const lastQ = query(collection(db, "users", auth.currentUser.uid, "withdrawals"), where("status", "==", "completed"), orderBy("timestamp", "desc"), limit(1));
            const lastSnap = await getDocs(lastQ);
            if (!lastSnap.empty) {
                const lastDate = new Date(lastSnap.docs[0].data().timestamp);
                const diff = (new Date() - lastDate) / (1000 * 60 * 60 * 24);
                if (diff < 5) return Swal.fire('Cooldown', `Please wait ${Math.ceil(5 - diff)} more days before next withdrawal.`, 'info');
            }

            openP('withdrawPanel');
        };

        document.getElementById('depositTrigger').onclick = () => openP('depositPanel');
        document.getElementById('closeDep').onclick = () => closeP('depositPanel');
        document.getElementById('closeWith').onclick = () => closeP('withdrawPanel');
        document.getElementById('closePin').onclick = () => closeP('pinPanel');

        document.getElementById('startWithdrawBtn').onclick = () => {
            const amt = parseFloat(document.getElementById('withdrawAmount').value);
            if (!amt || amt < 10 || amt > (userData.balance || 0)) return Swal.fire('Error', 'Invalid amount or insufficient balance', 'error');
            closeP('withdrawPanel');
            setTimeout(() => openP('pinPanel'), 400);
        };

        document.getElementById('finalConfirmBtn').onclick = async () => {
            const pin = document.getElementById('withdrawPin').value;
            const userSnap = await getDoc(doc(db, "users", auth.currentUser.uid));
            const actualPin = String(userSnap.data().securePin || userSnap.data().pin);

            if (pin !== actualPin) return Swal.fire('Error', 'Incorrect Security PIN', 'error');

            const amount = parseFloat(document.getElementById('withdrawAmount').value);
            const address = document.getElementById('withdrawAddr').value;
            const network = document.getElementById('withdrawNetwork').value;

            // Submit to User history AND Admin Global Withdrawals
            const requestData = {
                uid: auth.currentUser.uid,
                email: auth.currentUser.email,
                fullName: userData.fullName || 'N/A',
                amount: amount,
                fee: (amount * 0.05).toFixed(2),
                netAmount: (amount * 0.95).toFixed(2),
                address: address,
                network: network,
                status: "pending",
                timestamp: new Date().toISOString(),
                type: "Withdrawal",
                ip: "Captured" 
            };

            await addDoc(collection(db, "users", auth.currentUser.uid, "withdrawals"), requestData);
            
            Swal.fire('Request Submitted', 'Your withdrawal is being processed by the blockchain node.', 'success').then(() => location.reload());
        };

        document.getElementById('confirmDepositBtn').onclick = async () => {
            const amt = document.getElementById('depAmount').value;
            if(!amt) return;
            await addDoc(collection(db, "users", auth.currentUser.uid, "withdrawals"), {
                amount: parseFloat(amt),
                status: "pending",
                type: "Deposit",
                timestamp: new Date().toISOString()
            });
            Swal.fire('Notification', 'Deposit request logged. Please complete the transfer.', 'success').then(() => location.reload());
        };

        function fetchTransactions(uid) {
            const q = query(collection(db, "users", uid, "withdrawals"), orderBy("timestamp", "desc"), limit(5));
            onSnapshot(q, (sn) => {
                let h = '';
                sn.forEach(d => {
                    const data = d.data();
                    const color = data.type === 'Withdrawal' ? 'text-red-400' : 'text-green-400';
                    const statusColor = data.status === 'pending' ? 'text-yellow-500' : (data.status === 'completed' ? 'text-green-500' : 'text-red-500');
                    h += `<div class="flex justify-between items-center border-b border-white/5 pb-3">
                        <div class="text-left">
                            <p class="text-[10px] font-black uppercase">${data.type}</p>
                            <p class="text-[8px] font-bold ${statusColor} uppercase italic">${data.status}</p>
                        </div>
                        <span class="text-[11px] font-black ${color}">${data.type === 'Withdrawal' ? '-' : '+'}$${data.amount}</span>
                    </div>`;
                });
                document.getElementById('transactionHistory').innerHTML = h || '<p class="text-[10px] opacity-30">No transaction logs</p>';
            });
        }

        document.getElementById('copyBtn').onclick = () => {
            navigator.clipboard.writeText(document.getElementById('walletAddrDisplay').innerText);
            Swal.fire({toast:true, position:'top', title:'Address Copied', icon:'success', showConfirmButton:false, timer:1500});
        };
    </script>
</body>
</html>
