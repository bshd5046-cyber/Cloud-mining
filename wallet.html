<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wallet | VERTEX PREMIER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { --bg-dark: #020617; --primary: #3b82f6; --nav-bg: rgba(7, 10, 22, 0.98); }
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body { background-color: var(--bg-dark); font-family: 'Plus Jakarta Sans', sans-serif; color: #ffffff; background: radial-gradient(circle at 50% 0%, rgba(59, 130, 246, 0.16) 0%, transparent 40%), radial-gradient(circle at 100% 20%, rgba(124, 58, 237, 0.12) 0%, transparent 30%), #020617; min-height: 100vh; margin: 0; padding: 0; overflow-x: hidden; }
        .bottom-nav { background: var(--nav-bg); backdrop-filter: blur(20px); border-top: 1px solid rgba(255, 255, 255, 0.05); height: 85px; position: fixed; bottom: 0; left: 0; right: 0; display: flex; justify-content: space-around; align-items: center; z-index: 1000; padding-bottom: 15px; }
        .invest-fab { width: 68px; height: 68px; background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; position: relative; top: -28px; border: 6px solid #020617; box-shadow: 0 12px 30px rgba(37, 99, 235, 0.4); transition: transform 0.2s ease; }
        .invest-fab:active { transform: scale(0.96); }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; color: #475569; text-decoration: none; font-size: 10px; font-weight: 700; transition: color 0.2s ease; }
        .nav-item i { font-size: 20px; margin-bottom: 4px; }
        .nav-item.active { color: var(--primary); }
        .crypto-card { position: relative; overflow: hidden; background: linear-gradient(135deg, rgba(30, 64, 175, 0.52) 0%, rgba(124, 58, 237, 0.48) 100%); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 2.5rem; box-shadow: 0 20px 50px rgba(37, 99, 235, 0.15); }
        .glass-panel { background: rgba(15, 23, 42, 0.62); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .stat-card { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.06); }
        .history-item { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.04); border-radius: 1.5rem; transition: transform 0.18s ease; }
        .tx-icon { width: 42px; height: 42px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 15px; }
        .slide-panel { position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(15px); z-index: 2000; display: none; align-items: flex-end; }
        .panel-content { width: 100%; background: #070b16; border-radius: 3rem 3rem 0 0; padding: 2.5rem; border-top: 1px solid rgba(59, 130, 246, 0.2); transform: translateY(100%); transition: 0.4s cubic-bezier(0.165, 0.84, 0.44, 1); max-height: 90vh; overflow-y: auto; }
        .show-panel { display: flex !important; }
        .show-panel .panel-content { transform: translateY(0); }
        #qrcode { padding: 12px; background: white; border-radius: 1.25rem; width: fit-content; margin: 0 auto; }
        .status-dot { width: 8px; height: 8px; border-radius: 999px; background: #22c55e; box-shadow: 0 0 0 6px rgba(34, 197, 94, 0.12); }
        .mini-pill { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.06); }
        .field { width: 100%; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); color: white; border-radius: 1rem; padding: 16px; outline: none; }
        .copy-disabled { opacity: 0.55; cursor: not-allowed; }
        .copy-ready { box-shadow: 0 10px 30px rgba(37, 99, 235, 0.22); }
        .status-pending { color: #f59e0b; } .status-approved { color: #22c55e; } .status-rejected { color: #ef4444; }
    </style>
</head>
<body class="pb-32">
    <div id="mainContent">
        <div class="px-8 pt-16 flex justify-between items-center">
            <div>
                <p class="text-[10px] uppercase tracking-[0.28em] text-slate-500 font-black">Secure Wallet</p>
                <h1 class="text-3xl font-black italic uppercase tracking-tighter">My <span class="text-blue-500">Vault</span></h1>
            </div>
            <div class="flex items-center gap-2 mini-pill px-3 py-2 rounded-full">
                <span class="status-dot"></span>
                <span class="text-[10px] font-extrabold uppercase tracking-wider text-slate-200">Live</span>
            </div>
        </div>

        <div class="px-6 mt-8">
            <div class="crypto-card p-8">
                <div class="flex justify-between items-start">
                    <div>
                        <p class="text-blue-200 text-[10px] uppercase tracking-[0.2em] font-black opacity-60">Secured Balance</p>
                        <h2 id="userBalance" class="text-5xl font-black mt-3 tracking-tighter">$0.00</h2>
                    </div>
                    <div class="mini-pill px-3 py-2 rounded-xl">
                        <p class="text-[8px] uppercase tracking-[0.2em] text-slate-400 font-black text-right">Network</p>
                        <p class="text-[11px] font-black text-blue-300">USDT TRC20</p>
                    </div>
                </div>
                <div class="mt-8 flex justify-between items-end">
                    <div>
                        <p class="text-[9px] uppercase tracking-[0.25em] text-slate-400 font-black mb-2">Account Holder</p>
                        <p id="userName" class="text-sm font-black tracking-widest italic uppercase text-slate-100">---</p>
                    </div>
                    <p id="userTier" class="text-[9px] font-black text-blue-400 border border-blue-400/30 px-2 py-1 rounded-md uppercase">Tier 1</p>
                </div>
            </div>
        </div>

        <div class="px-6 mt-6 flex gap-4">
            <button id="depositTrigger" class="flex-1 bg-blue-600 py-5 rounded-[2rem] font-black uppercase text-[11px] tracking-widest shadow-lg">
                <i class="fas fa-arrow-down mr-2"></i>Deposit
            </button>
            <button id="withdrawTrigger" class="flex-1 glass-panel py-5 rounded-[2rem] font-black uppercase text-[11px] tracking-widest">
                <i class="fas fa-arrow-up mr-2"></i>Withdraw
            </button>
        </div>

        <div class="px-6 mt-10">
            <h3 class="font-black text-[11px] uppercase tracking-[0.3em] text-slate-600 mb-6">Live Ledger</h3>
            <div id="transactionHistory" class="glass-panel rounded-[2.5rem] p-4 space-y-3">
                <p class="text-center text-[10px] text-slate-500 py-4">SYNCING...</p>
            </div>
        </div>
    </div>

    <div id="depositPanel" class="slide-panel">
        <div class="panel-content text-center">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-black uppercase italic text-blue-500">Fast Deposit</h3>
                <button id="closeDep" class="w-10 h-10 rounded-full bg-white/5 text-white text-xl">&times;</button>
            </div>
            <div id="qrcode" class="mb-6"></div>
            <div class="bg-black/40 border border-white/10 p-4 rounded-2xl mb-4 break-all">
                <p id="depositAddrText" class="text-xs font-mono text-blue-300 italic">Waiting for system...</p>
            </div>
            <button id="copyBtn" class="w-full bg-blue-600 text-white py-5 rounded-2xl font-black uppercase tracking-widest copy-disabled" disabled>Copy Address</button>
        </div>
    </div>

    <div id="withdrawPanel" class="slide-panel">
        <div class="panel-content">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-black uppercase italic text-blue-500">Withdrawal</h3>
                <button id="closeWithdraw" class="w-10 h-10 rounded-full bg-white/5 text-white text-xl">&times;</button>
            </div>
            <div class="mini-pill rounded-2xl p-4 mb-5">
                <p class="text-[8px] uppercase tracking-[0.2em] text-slate-500 font-black">Available Balance</p>
                <p id="withdrawAvailableBalance" class="text-2xl font-black mt-2">$0.00</p>
            </div>
            <input id="withdrawAddress" type="text" class="field mb-4" placeholder="Wallet Address">
            <input id="withdrawAmount" type="number" class="field" placeholder="Amount (USDT)">
            <button id="submitWithdrawBtn" class="w-full bg-blue-600 text-white py-5 rounded-2xl font-black uppercase tracking-widest mt-6">Submit Request</button>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item"><i class="fas fa-house"></i><span>Home</span></a>
        <a href="wallet.html" class="nav-item active"><i class="fas fa-wallet"></i><span>Wallet</span></a>
        <div class="relative flex-1 flex justify-center"><a href="invest.html" class="invest-fab"><i class="fas fa-bolt-lightning text-2xl text-white"></i></a></div>
        <a href="support.html" class="nav-item"><i class="fas fa-headset"></i><span>Support</span></a>
        <a href="profile.html" class="nav-item"><i class="fas fa-circle-user"></i><span>Profile</span></a>
    </nav>

    <script type="module" src="wallet.js"></script>
</body>
</html>
