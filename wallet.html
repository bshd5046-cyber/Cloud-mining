<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wallet | VERTEX PREMIER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { --bg-dark: #020617; --primary: #3b82f6; --nav-bg: rgba(7, 10, 22, 0.98); }
        body { background-color: var(--bg-dark); font-family: 'Plus Jakarta Sans', sans-serif; color: #ffffff; background: radial-gradient(circle at 50% 0%, rgba(59, 130, 246, 0.15) 0%, transparent 50%), #020617; min-height: 100vh; margin: 0; padding: 0; overflow-x: hidden; }
        .bottom-nav { background: var(--nav-bg); backdrop-filter: blur(20px); border-top: 1px solid rgba(255, 255, 255, 0.05); height: 85px; position: fixed; bottom: 0; left: 0; right: 0; display: flex; justify-content: space-around; align-items: center; z-index: 1000; padding-bottom: 15px; }
        .invest-fab { width: 68px; height: 68px; background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; position: relative; top: -28px; border: 6px solid #020617; box-shadow: 0 12px 30px rgba(37, 99, 235, 0.4); }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; color: #475569; text-decoration: none; font-size: 10px; font-weight: 700; }
        .nav-item i { font-size: 20px; margin-bottom: 4px; }
        .nav-item.active { color: var(--primary); }
        .crypto-card { background: linear-gradient(135deg, rgba(30, 64, 175, 0.4) 0%, rgba(124, 58, 237, 0.4) 100%); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 2.5rem; }
        .glass-panel { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .slide-panel { position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(15px); z-index: 2000; display: none; align-items: flex-end; }
        .panel-content { width: 100%; background: #070b16; border-radius: 3rem 3rem 0 0; padding: 2.5rem; border-top: 1px solid rgba(59, 130, 246, 0.2); transform: translateY(100%); transition: 0.4s cubic-bezier(0.165, 0.84, 0.44, 1); }
        .show-panel { display: flex !important; }
        .show-panel .panel-content { transform: translateY(0); }
        input, select { background: rgba(255,255,255,0.05) !important; border: 1px solid rgba(255,255,255,0.1) !important; color: white !important; }
        .status-pill { display: inline-flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 9999px; font-size: 9px; font-weight: 800; letter-spacing: 0.18em; text-transform: uppercase; }
        .status-dot { width: 8px; height: 8px; border-radius: 9999px; }
    </style>
</head>
<body class="pb-32">

    <div id="mainContent">
        <div class="px-8 pt-16 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <h1 class="text-3xl font-black italic uppercase tracking-tighter">My <span class="text-blue-500">Vault</span></h1>
                <button onclick="showRules()" class="w-6 h-6 rounded-full bg-blue-500/20 flex items-center justify-center border border-blue-500/30">
                    <i class="fas fa-info text-[10px] text-blue-400"></i>
                </button>
            </div>
            <div id="cooldownTimer" class="hidden text-[10px] font-bold text-red-400 bg-red-500/10 px-3 py-1 rounded-full border border-red-500/20">
                LOCKED
            </div>
        </div>

        <div class="px-6 mt-8">
            <div class="crypto-card p-9">
                <p class="text-blue-200 text-[10px] uppercase tracking-[0.2em] font-black opacity-60">Secured Balance</p>
                <h2 id="userBalance" class="text-5xl font-black mt-2 tracking-tighter">$ 0.00</h2>
                <div class="mt-8 flex justify-between items-end">
                    <p id="userName" class="text-sm font-black tracking-widest italic uppercase text-slate-200">---</p>
                    <p id="userTier" class="text-[9px] font-black text-blue-400 border border-blue-400/30 px-2 py-1 rounded-md uppercase">Tier 1</p>
                </div>
            </div>
        </div>

        <div class="px-6 mt-5">
            <div class="glass-panel rounded-[2rem] p-4 flex flex-col gap-3">
                <div class="flex items-center justify-between">
                    <span class="text-[10px] font-black uppercase tracking-[0.25em] text-slate-500">System Checks</span>
                </div>
                <div class="flex flex-wrap gap-2">
                    <div id="emailVerifiedBadge" class="status-pill bg-amber-500/10 text-amber-400 border border-amber-500/20">
                        <span class="status-dot bg-amber-400"></span><span>Email...</span>
                    </div>
                    <div id="pinStatusBadge" class="status-pill bg-red-500/10 text-red-400 border border-red-500/20">
                        <span class="status-dot bg-red-400"></span><span>PIN...</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="px-6 mt-10 flex gap-4">
            <button id="depositTrigger" class="flex-1 bg-blue-600 py-5 rounded-[2rem] font-black uppercase text-[11px] tracking-widest">Deposit</button>
            <button id="withdrawTrigger" class="flex-1 glass-panel py-5 rounded-[2rem] font-black uppercase text-[11px] tracking-widest">Withdraw</button>
        </div>

        <div class="px-6 mt-10">
            <h3 class="font-black text-[11px] uppercase tracking-[0.3em] text-slate-600 mb-6 px-2">Live Ledger</h3>
            <div id="transactionHistory" class="glass-panel rounded-[2.5rem] overflow-hidden p-4 space-y-4">
                <p class="text-center text-[10px] text-slate-500 py-4">SYNCING...</p>
            </div>
        </div>
    </div>

    <div id="withdrawPanel" class="slide-panel">
        <div class="panel-content">
            <div class="flex items-center gap-4 mb-8">
                <button id="closeWith" class="w-10 h-10 rounded-full bg-white/5 flex items-center justify-center"><i class="fas fa-arrow-left text-red-500"></i></button>
                <h3 class="text-xl font-black uppercase italic text-red-500">Withdrawal Request</h3>
            </div>
            <div class="space-y-4">
                <select id="withdrawNetwork" class="w-full p-5 rounded-2xl outline-none font-bold">
                    <option value="TRC20">USDT (TRC20 Network)</option>
                    <option value="BEP20">USDT (BEP20 Network)</option>
                </select>
                <input type="text" id="withdrawAddr" placeholder="Destination Wallet Address" class="w-full p-5 rounded-2xl outline-none">
                
                <div class="relative">
                    <input type="number" id="withdrawAmount" placeholder="Amount to Withdraw" class="w-full p-5 rounded-2xl outline-none mb-1">
                    <div class="flex justify-between px-2">
                        <p id="feeDisplay" class="text-[9px] font-bold text-slate-500">FEE (5%): $0.00</p>
                        <p id="netReceiveDisplay" class="text-[9px] font-bold text-green-500">YOU RECEIVE: $0.00</p>
                    </div>
                </div>

                <button id="startWithdrawBtn" class="w-full bg-white text-black py-5 rounded-2xl font-black uppercase tracking-widest mt-4">Validate & Authorize</button>
            </div>
        </div>
    </div>

    <div id="pinPanel" class="slide-panel !z-[3000]">
        <div class="panel-content !bg-slate-950">
            <h3 class="text-center font-black mb-6 uppercase tracking-widest text-blue-400">Vault Security PIN</h3>
            <input type="password" id="withdrawPin" maxlength="6" inputmode="numeric" placeholder="••••••" class="w-full text-center text-3xl tracking-[0.5em] p-6 rounded-2xl bg-black/40 border border-blue-500/30 mb-6 outline-none">
            <button id="finalConfirmBtn" class="w-full bg-blue-500 py-5 rounded-2xl font-black uppercase">Complete Transaction</button>
            <button id="closePin" class="w-full mt-4 text-[10px] font-black text-slate-500 uppercase">Return</button>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item"><i class="fas fa-house"></i><span>Home</span></a>
        <a href="wallet.html" class="nav-item active"><i class="fas fa-wallet"></i><span>Wallet</span></a>
        <div class="relative flex-1 flex justify-center"><a href="invest.html" class="invest-fab"><i class="fas fa-bolt-lightning text-2xl text-white"></i></a></div>
        <a href="support.html" class="nav-item"><i class="fas fa-headset"></i><span>Support</span></a>
        <a href="profile.html" class="nav-item"><i class="fas fa-circle-user"></i><span>Profile</span></a>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, reload } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, updateDoc, addDoc, collection, query, orderBy, limit, getDocs, where, deleteDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAmlAKs35FG4hbcaPkVQ_s0FSaZsvWzFak",
            authDomain: "cloud-mining-6f190.firebaseapp.com",
            projectId: "cloud-mining-6f190",
            storageBucket: "cloud-mining-6f190.firebasestorage.app",
            messagingSenderId: "144227180849",
            appId: "1:144227180849:web:ccbda447d074efbbddd010"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        let userData = {};

        const openP = (id) => document.getElementById(id).classList.add('show-panel');
        const closeP = (id) => document.getElementById(id).classList.remove('show-panel');

        // --- Logic: Real-time Fee Calculation ---
        document.getElementById('withdrawAmount').oninput = (e) => {
            const val = parseFloat(e.target.value) || 0;
            const fee = val * 0.05;
            const net = val - fee;
            document.getElementById('feeDisplay').innerText = `FEE (5%): $${fee.toFixed(2)}`;
            document.getElementById('netReceiveDisplay').innerText = `YOU RECEIVE: $${net > 0 ? net.toFixed(2) : '0.00'}`;
        };

        // --- Logic: Cooldown Check ---
        function checkCooldown() {
            if (!userData.lastWithdrawalDate) return true;
            const lastDate = new Date(userData.lastWithdrawalDate);
            const now = new Date();
            const diffDays = Math.floor((now - lastDate) / (1000 * 60 * 60 * 24));
            
            if (diffDays < 5) {
                const remaining = 5 - diffDays;
                document.getElementById('cooldownTimer').innerText = `${remaining} DAYS COOLDOWN`;
                document.getElementById('cooldownTimer').classList.remove('hidden');
                return false;
            }
            document.getElementById('cooldownTimer').classList.add('hidden');
            return true;
        }

        // --- Logic: Withdrawal Limits ---
        function getMaxLimit(tier) {
            const limits = { 1: 500, 2: 2000, 3: 5000, 4: 8000, 5: 10000 };
            return limits[tier] || 500;
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                onSnapshot(doc(db, "users", user.uid), (snap) => {
                    if (snap.exists()) {
                        userData = snap.data();
                        document.getElementById('userBalance').innerText = `$${parseFloat(userData.balance || 0).toLocaleString(undefined, { minimumFractionDigits: 2 })}`;
                        document.getElementById('userName').innerText = userData.fullName || "USER";
                        document.getElementById('userTier').innerText = `Tier ${userData.tier || 1}`;
                        updateSecurityBadges();
                        fetchTransactions(user.uid);
                    }
                });
            } else { window.location.replace('login.html'); }
        });

        document.getElementById('withdrawTrigger').onclick = async () => {
            const user = auth.currentUser;
            await reload(user);

            // 1. Check Pending
            const q = query(collection(db, "users", user.uid, "withdrawals"), where("status", "==", "pending"), where("type", "==", "Withdrawal"));
            const pendingSnap = await getDocs(q);
            if (!pendingSnap.empty) return Swal.fire('Action Blocked', 'You have a pending withdrawal request in progress.', 'warning');

            // 2. Check Verification
            if (!user.emailVerified) return Swal.fire('Unverified', 'Please verify email in profile first.', 'error');
            
            // 3. Check Cooldown
            if (!checkCooldown()) return Swal.fire('Cooldown Active', 'System safety: Wait 5 days between successful withdrawals.', 'info');

            openP('withdrawPanel');
        };

        document.getElementById('startWithdrawBtn').onclick = () => {
            const amt = parseFloat(document.getElementById('withdrawAmount').value);
            const addr = document.getElementById('withdrawAddr').value.trim();
            const max = getMaxLimit(userData.tier || 1);

            if (!amt || amt < 10) return Swal.fire('Error', 'Minimum withdrawal is $10', 'error');
            if (amt > max) return Swal.fire('Limit Exceeded', `Your current Tier limit is $${max}`, 'warning');
            if (amt > (userData.balance || 0)) return Swal.fire('Insufficient', 'Balance too low.', 'error');
            if (addr.length < 10) return Swal.fire('Invalid Address', 'Check your wallet address.', 'error');

            closeP('withdrawPanel');
            setTimeout(() => openP('pinPanel'), 400);
        };

        document.getElementById('finalConfirmBtn').onclick = async () => {
            const pinEntered = document.getElementById('withdrawPin').value;
            const actualPin = String(userData.securePin || userData.pin || "");

            if (pinEntered !== actualPin) return Swal.fire('Error', 'Incorrect PIN', 'error');

            const amt = parseFloat(document.getElementById('withdrawAmount').value);
            const net = (amt * 0.95).toFixed(2);
            
            const requestData = {
                uid: auth.currentUser.uid,
                email: auth.currentUser.email,
                fullName: userData.fullName || 'N/A',
                amount: amt,
                netAmount: net,
                address: document.getElementById('withdrawAddr').value.trim(),
                network: document.getElementById('withdrawNetwork').value,
                status: "pending",
                timestamp: new Date().toISOString(),
                type: "Withdrawal"
            };

            try {
                // الخصم من الرصيد فوراً
                await updateDoc(doc(db, "users", auth.currentUser.uid), {
                    balance: increment(-amt)
                });
                
                await addDoc(collection(db, "users", auth.currentUser.uid, "withdrawals"), requestData);
                
                Swal.fire('Success', 'Funds locked. Waiting for admin approval.', 'success').then(() => {
                    location.reload();
                });
            } catch (e) {
                Swal.fire('System Error', 'Could not process.', 'error');
            }
        };

        // --- Logic: Cancel Transaction & Refund ---
        window.cancelWithdraw = async (id, amount) => {
            const result = await Swal.fire({
                title: 'Cancel Request?',
                text: "Amount will be refunded to your balance.",
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#3b82f6',
                confirmButtonText: 'Yes, cancel it'
            });

            if (result.isConfirmed) {
                try {
                    await deleteDoc(doc(db, "users", auth.currentUser.uid, "withdrawals", id));
                    await updateDoc(doc(db, "users", auth.currentUser.uid), {
                        balance: increment(amount)
                    });
                    Swal.fire('Cancelled', 'Funds returned to balance.', 'success');
                } catch (e) {
                    Swal.fire('Error', 'Failed to cancel.', 'error');
                }
            }
        };

        function fetchTransactions(uid) {
            const q = query(collection(db, "users", uid, "withdrawals"), orderBy("timestamp", "desc"), limit(10));
            onSnapshot(q, (sn) => {
                let h = '';
                sn.forEach(d => {
                    const data = d.data();
                    const id = d.id;
                    const isWithdraw = data.type === 'Withdrawal';
                    const color = isWithdraw ? 'text-red-400' : 'text-green-400';
                    const sColor = data.status === 'pending' ? 'text-yellow-500' : (data.status === 'completed' ? 'text-green-500' : 'text-red-500');
                    
                    h += `<div class="flex justify-between items-center border-b border-white/5 pb-4 last:border-0">
                        <div class="text-left">
                            <p class="text-[10px] font-black uppercase tracking-widest">${data.type}</p>
                            <div class="flex items-center gap-2">
                                <p class="text-[8px] font-bold ${sColor} uppercase italic">${data.status}</p>
                                ${data.status === 'pending' && isWithdraw ? `<button onclick="cancelWithdraw('${id}', ${data.amount})" class="text-[8px] bg-red-500/10 text-red-500 px-2 rounded font-black">CANCEL</button>` : ''}
                            </div>
                        </div>
                        <div class="text-right">
                            <span class="text-[12px] font-black ${color}">${isWithdraw ? '-' : '+'}$${data.amount}</span>
                            <p class="text-[7px] text-slate-600 font-bold">${new Date(data.timestamp).toLocaleDateString()}</p>
                        </div>
                    </div>`;
                });
                document.getElementById('transactionHistory').innerHTML = h || '<p class="text-center text-[10px] opacity-20">NO RECENT ACTIVITY</p>';
            });
        }

        // ... بقية الوظائف (Badges, Close buttons, Rules)
        function updateSecurityBadges() {
            const pinReady = String(userData.securePin || "").length === 6;
            document.getElementById('emailVerifiedBadge').innerHTML = auth.currentUser.emailVerified ? `<span class="status-dot bg-emerald-400"></span><span>Verified</span>` : `<span class="status-dot bg-amber-400"></span><span>Unverified</span>`;
            document.getElementById('pinStatusBadge').innerHTML = pinReady ? `<span class="status-dot bg-emerald-400"></span><span>PIN OK</span>` : `<span class="status-dot bg-red-400"></span><span>PIN ERROR</span>`;
        }

        document.getElementById('closeWith').onclick = () => closeP('withdrawPanel');
        document.getElementById('closePin').onclick = () => closeP('pinPanel');
    </script>
</body>
</html>
