<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wallet | VERTEX PREMIER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { --bg-dark: #020617; --primary: #3b82f6; --nav-bg: rgba(7, 10, 22, 0.98); }
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body { background-color: var(--bg-dark); font-family: 'Plus Jakarta Sans', sans-serif; color: #ffffff; background: radial-gradient(circle at 50% 0%, rgba(59, 130, 246, 0.16) 0%, transparent 40%), #020617; min-height: 100vh; margin: 0; padding: 0; overflow-x: hidden; }
        .bottom-nav { background: var(--nav-bg); backdrop-filter: blur(20px); border-top: 1px solid rgba(255, 255, 255, 0.05); height: 85px; position: fixed; bottom: 0; left: 0; right: 0; display: flex; justify-content: space-around; align-items: center; z-index: 1000; padding-bottom: 15px; }
        .invest-fab { width: 68px; height: 68px; background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; position: relative; top: -28px; border: 6px solid #020617; box-shadow: 0 12px 30px rgba(37, 99, 235, 0.4); }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; color: #475569; text-decoration: none; font-size: 10px; font-weight: 700; }
        .nav-item i { font-size: 20px; margin-bottom: 4px; }
        .nav-item.active { color: var(--primary); }
        .crypto-card { background: linear-gradient(135deg, rgba(30, 64, 175, 0.5) 0%, rgba(124, 58, 237, 0.4) 100%); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 2.5rem; }
        .glass-panel { background: rgba(15, 23, 42, 0.62); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .slide-panel { position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(15px); z-index: 2000; display: none; align-items: flex-end; }
        .panel-content { width: 100%; background: #070b16; border-radius: 3rem 3rem 0 0; padding: 2rem; border-top: 1px solid rgba(59, 130, 246, 0.3); transform: translateY(100%); transition: 0.4s cubic-bezier(0.165, 0.84, 0.44, 1); max-height: 95vh; overflow-y: auto; padding-bottom: 5rem; }
        .show-panel { display: flex !important; }
        .show-panel .panel-content { transform: translateY(0); }
        .field { width: 100%; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); color: white; border-radius: 1.25rem; padding: 15px; outline: none; font-size: 14px; }
        
        .ios-alert { border-radius: 24px !important; background: rgba(10, 15, 29, 0.95) !important; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1) !important; color: white !important; }
        .ios-btn { border-radius: 14px !important; font-weight: 800 !important; text-transform: uppercase !important; }
    </style>
</head>
<body class="pb-32">

    <div class="px-8 pt-12 flex justify-between items-center">
        <div>
            <p class="text-[10px] uppercase tracking-[0.2em] text-slate-500 font-black">Capital Management</p>
            <h1 class="text-3xl font-black italic uppercase">My <span class="text-blue-500">Vault</span></h1>
        </div>
    </div>

    <div class="px-6 mt-8">
        <div class="crypto-card p-8 relative overflow-hidden">
            <p class="text-blue-200 text-[10px] uppercase tracking-widest font-black opacity-60">Available Balance</p>
            <h2 id="userBalance" class="text-5xl font-black mt-3 tracking-tighter">$0.00</h2>
            <div class="mt-8 flex justify-between items-end">
                <div>
                    <p id="userName" class="text-xs font-bold tracking-widest uppercase text-slate-100 italic">---</p>
                </div>
                <div class="text-right">
                    <span id="userTier" class="text-[10px] font-black text-blue-400 border border-blue-400/30 px-3 py-1 rounded-lg uppercase">Tier 1</span>
                </div>
            </div>
        </div>
    </div>

    <div class="px-6 mt-6 flex gap-4">
        <button id="depositTrigger" onclick="document.getElementById('depositPanel').classList.add('show-panel')" class="flex-1 bg-blue-600 py-5 rounded-[2rem] font-black uppercase text-[11px] tracking-widest">Deposit</button>
        <button id="withdrawTrigger" class="flex-1 glass-panel py-5 rounded-[2rem] font-black uppercase text-[11px] tracking-widest">Withdraw</button>
    </div>

    <div class="px-6 mt-10">
        <h3 class="font-black text-[11px] uppercase tracking-[0.3em] text-slate-600 italic mb-4 ml-2">Financial Logs</h3>
        <div id="transactionHistory" class="glass-panel rounded-[2.5rem] p-4 min-h-[100px]">
            <p class="text-center text-[10px] text-slate-500 py-10">Loading Vault...</p>
        </div>
    </div>

    <div id="depositPanel" class="slide-panel">
        <div class="panel-content text-center">
            <div class="flex justify-between items-center mb-8">
                <h3 class="text-xl font-black uppercase text-blue-500 italic">Deposit</h3>
                <button id="closeDep" class="w-10 h-10 rounded-full bg-white/5">&times;</button>
            </div>
            <div id="qrcode" class="mb-6 bg-white p-4 rounded-[2rem] inline-block mx-auto"></div>
            <p id="depositAddrText" class="text-[10px] font-mono text-blue-400 font-bold mb-6 break-all">---</p>
            <button id="copyBtn" class="w-full bg-blue-600/20 text-blue-400 border border-blue-400/30 py-4 rounded-2xl font-black uppercase mb-8">Copy Address</button>
            
            <div class="border-t border-white/5 pt-6 text-left">
                <p class="text-[10px] text-slate-500 font-black uppercase mb-3 ml-2 italic">Confirm Transaction</p>
                <input id="txHash" type="text" class="field mb-3" placeholder="Paste Transaction ID (Hash)">
                <button id="submitDeposit" class="w-full bg-emerald-600 py-5 rounded-2xl font-black uppercase tracking-widest">Confirm Payment</button>
            </div>
        </div>
    </div>

    <div id="withdrawPanel" class="slide-panel">
        <div class="panel-content">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-black uppercase italic text-blue-500">Withdraw</h3>
                <button id="closeWithdraw" class="w-10 h-10 rounded-full bg-white/5">&times;</button>
            </div>
            
            <div class="space-y-4">
                <p class="text-center text-xs text-amber-500 font-bold" id="withdrawAvailableBalance"></p>
                <select id="withdrawNetwork" class="field">
                    <option value="TRC20">USDT (TRC20)</option>
                    <option value="BEP20">USDT (BEP20)</option>
                </select>
                <input id="withdrawAddress" type="text" class="field" placeholder="Wallet Address">
                <input id="withdrawAmount" type="number" class="field" placeholder="Amount (Min $10)">
                <input id="vaultPin" type="password" maxlength="6" class="field text-center tracking-[1em]" placeholder="******">
                
                <button id="submitWithdrawBtn" class="w-full bg-blue-600 py-5 rounded-2xl font-black uppercase tracking-widest">
                    Initiate Payout
                </button>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item"><i class="fas fa-house"></i><span>Home</span></a>
        <a href="wallet.html" class="nav-item active"><i class="fas fa-wallet"></i><span>Wallet</span></a>
        <div class="relative flex-1 flex justify-center"><a href="invest.html" class="invest-fab"><i class="fas fa-bolt-lightning text-white"></i></a></div>
        <a href="support.html" class="nav-item"><i class="fas fa-headset"></i><span>Support</span></a>
        <a href="profile.html" class="nav-item"><i class="fas fa-circle-user"></i><span>Profile</span></a>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, collection, query, orderBy, limit, addDoc, serverTimestamp, updateDoc, where, getDocs, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAmlAKs35FG4hbcaPkVQ_s0FSaZsvWzFak",
            authDomain: "cloud-mining-6f190.firebaseapp.com",
            projectId: "cloud-mining-6f190",
            storageBucket: "cloud-mining-6f190.firebasestorage.app",
            messagingSenderId: "144227180849",
            appId: "1:144227180849:web:ccbda447d074efbbddd010"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let currentUserData = null;

        function showError(msg) {
            Swal.fire({
                icon: 'error',
                title: 'DENIED',
                text: msg,
                background: '#070b16',
                color: '#fff',
                confirmButtonColor: '#3b82f6',
                customClass: { popup: 'ios-alert', confirmButton: 'ios-btn' }
            });
        }

        onAuthStateChanged(auth, user => {
            if (user) {
                currentUser = user;
                onSnapshot(doc(db, "users", user.uid), (snap) => {
                    currentUserData = snap.data();
                    if (currentUserData) {
                        document.getElementById('userBalance').innerText = `$${parseFloat(currentUserData.balance || 0).toLocaleString(undefined, {minimumFractionDigits: 2})}`;
                        document.getElementById('userName').innerText = currentUserData.fullName || "GUEST";
                        document.getElementById('userTier').innerText = currentUserData.tier || "Tier 1";
                        if (currentUserData.depositAddress) enableAddressUI(currentUserData.depositAddress);
                    }
                });
                loadTransactions(user.uid);
            } else {
                window.location.href = 'login.html';
            }
        });

        // --- Withdrawal Logic (Fixed securePin) ---
        document.getElementById('withdrawTrigger').onclick = () => {
            // التصحيح: استبدال withdrawalPin بـ securePin
            if (!currentUserData?.securePin) {
                return Swal.fire({
                    icon: 'lock',
                    title: 'Security Required',
                    text: 'Please set your 6-digit Vault PIN in Profile settings first.',
                    showCancelButton: true,
                    confirmButtonText: 'Set PIN Now',
                    background: '#070b16', color: '#fff'
                }).then(res => { if(res.isConfirmed) window.location.href='profile.html' });
            }
            document.getElementById('withdrawAvailableBalance').innerText = `Available: $${parseFloat(currentUserData.balance || 0).toFixed(2)}`;
            document.getElementById('withdrawPanel').classList.add('show-panel');
        };

        document.getElementById('submitWithdrawBtn').onclick = async () => {
            const btn = document.getElementById('submitWithdrawBtn');
            const amount = parseFloat(document.getElementById('withdrawAmount').value);
            const address = document.getElementById('withdrawAddress').value;
            const enteredPin = document.getElementById('vaultPin').value;

            if (!address || isNaN(amount) || enteredPin.length !== 6) return showError("Enter valid Address, Amount and 6-digit PIN");
            
            // التصحيح: المقارنة مع securePin
            if (enteredPin !== currentUserData.securePin) return showError("Invalid Security PIN");
            
            if (amount < 10) return showError("Minimum payout is $10.00");
            if (amount > (currentUserData.balance || 0)) return showError("Insufficient Vault Balance");

            try {
                btn.disabled = true; btn.innerText = "Authorizing...";

                const q = query(collection(db, "withdrawals"), where("uid", "==", currentUser.uid), where("status", "==", "pending"));
                const snap = await getDocs(q);
                if (!snap.empty) {
                    btn.disabled = false; btn.innerText = "Initiate Payout";
                    return showError("You already have a pending withdrawal.");
                }

                await updateDoc(doc(db, "users", currentUser.uid), { balance: increment(-amount) });

                const txData = {
                    uid: currentUser.uid,
                    email: currentUser.email,
                    fullName: currentUserData.fullName,
                    amount: amount,
                    address: address,
                    status: "pending",
                    timestamp: serverTimestamp(),
                    type: "Withdrawal"
                };
                
                await addDoc(collection(db, "withdrawals"), txData);
                await addDoc(collection(db, "users", currentUser.uid, "transactions"), txData);

                Swal.fire({ icon: 'success', title: 'Success', text: 'Payout initiated. Funds locked for audit.', background: '#070b16', color: '#fff' });
                document.getElementById('withdrawPanel').classList.remove('show-panel');
                document.getElementById('vaultPin').value = "";
                document.getElementById('withdrawAmount').value = "";
            } catch (e) {
                showError("Relay Error. Try again.");
            } finally {
                btn.disabled = false; btn.innerText = "Initiate Payout";
            }
        };

        // --- Deposit Proof Logic ---
        document.getElementById('submitDeposit').onclick = async () => {
            const hash = document.getElementById('txHash').value;
            if (!hash) return showError("Please provide Transaction Hash");

            await addDoc(collection(db, "deposits"), {
                uid: currentUser.uid,
                email: currentUser.email,
                fullName: currentUserData.fullName,
                hash: hash,
                status: "pending",
                timestamp: serverTimestamp()
            });
            Swal.fire({ icon: 'success', title: 'Submitted', text: 'Admin is verifying your deposit.', background: '#070b16', color: '#fff' });
            document.getElementById('txHash').value = "";
            document.getElementById('depositPanel').classList.remove('show-panel');
        };

        // --- Helpers ---
        function loadTransactions(uid) {
            const q = query(collection(db, "users", uid, "transactions"), orderBy("timestamp", "desc"), limit(10));
            onSnapshot(q, snap => {
                const cont = document.getElementById('transactionHistory');
                cont.innerHTML = snap.empty ? '<p class="text-center text-[10px] py-10 opacity-30 italic">No activity</p>' : "";
                snap.forEach(d => {
                    const tx = d.data();
                    const color = tx.status === 'pending' ? 'text-amber-500' : 'text-emerald-500';
                    cont.innerHTML += `<div class="p-4 border-b border-white/5 flex justify-between items-center">
                        <span class="text-[10px] font-black uppercase text-slate-400">${tx.type || 'TX'}</span>
                        <div class="text-right">
                            <p class="text-xs font-black italic">$${parseFloat(tx.amount || 0).toFixed(2)}</p>
                            <p class="text-[8px] font-black uppercase ${color}">${tx.status}</p>
                        </div>
                    </div>`;
                });
            });
        }

        function enableAddressUI(addr) {
            document.getElementById('depositAddrText').innerText = addr;
            const qrBox = document.getElementById('qrcode');
            qrBox.innerHTML = "";
            new QRCode(qrBox, { text: addr, width: 140, height: 140, colorDark : "#000000", colorLight : "#ffffff" });
        }

        document.getElementById('copyBtn').onclick = () => {
            navigator.clipboard.writeText(document.getElementById('depositAddrText').innerText);
            Swal.fire({ icon: 'success', title: 'Copied', toast: true, position: 'top', showConfirmButton: false, timer: 1500 });
        };

        document.getElementById('closeDep').onclick = () => document.getElementById('depositPanel').classList.remove('show-panel');
        document.getElementById('closeWithdraw').onclick = () => document.getElementById('withdrawPanel').classList.remove('show-panel');
    </script>
</body>
</html>
