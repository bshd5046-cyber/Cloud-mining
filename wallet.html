<div id="withdrawPanel" class="slide-panel">
    <div class="panel-content">
        <div class="flex justify-between items-center mb-6">
            <h3 class="text-xl font-black uppercase italic text-blue-500">Withdrawal</h3>
            <button id="closeWithdraw" class="w-10 h-10 rounded-full bg-white/5 text-white text-xl">&times;</button>
        </div>

        <div class="bg-blue-500/10 border border-blue-500/20 p-4 rounded-2xl mb-5">
            <div class="flex justify-between items-center">
                <span id="displayCurrentTier" class="text-[10px] font-black uppercase text-blue-400 tracking-widest">Tier 1</span>
                <span id="displayMaxLimit" class="text-[10px] font-black text-slate-300">Max: $500.00</span>
            </div>
            <p class="text-[9px] text-slate-500 mt-2 leading-relaxed">
                <i class="fas fa-circle-exclamation mr-1 text-amber-500"></i> 
                Processing time: 2-120 hours. Assets are locked for 7 days after deposit. 
                We are NOT responsible for incorrect network or address details.
            </p>
        </div>

        <div class="space-y-4">
            <div>
                <label class="text-[9px] uppercase tracking-widest text-slate-500 font-black mb-2 block ml-2">Network Selection</label>
                <select id="withdrawNetwork" class="field">
                    <option value="TRC20">USDT (TRC20) - Fast Transfer</option>
                    <option value="BEP20">USDT (BEP20) - Low Fee</option>
                </select>
            </div>

            <div>
                <label class="text-[9px] uppercase tracking-widest text-slate-500 font-black mb-2 block ml-2">Wallet Address</label>
                <input id="withdrawAddress" type="text" class="field" placeholder="Paste your address here">
            </div>

            <div>
                <label class="text-[9px] uppercase tracking-widest text-slate-500 font-black mb-2 block ml-2">Amount</label>
                <input id="withdrawAmount" type="number" class="field" placeholder="Min $10">
            </div>

            <div>
                <label class="text-[9px] uppercase tracking-widest text-blue-500 font-black mb-2 block ml-2 italic">Vault Security PIN (6 Digits)</label>
                <input id="vaultPinInput" type="password" maxlength="6" class="field text-center tracking-[0.8em] font-black border-blue-500/30" placeholder="******">
            </div>

            <div class="bg-black/40 rounded-2xl p-4 border border-white/5 space-y-2">
                <div class="flex justify-between text-[10px] font-bold uppercase">
                    <span class="text-slate-500 tracking-widest">Network Fee (5%)</span>
                    <span id="feeAmount" class="text-red-400">$0.00</span>
                </div>
                <div class="flex justify-between text-[11px] font-black uppercase pt-2 border-t border-white/5">
                    <span class="text-emerald-400">Net Arrival</span>
                    <span id="finalAmount" class="text-emerald-400">$0.00</span>
                </div>
            </div>

            <button id="submitWithdrawBtn" class="w-full bg-blue-600 text-white py-5 rounded-2xl font-black uppercase tracking-widest shadow-lg active:scale-95 transition-transform">
                Initiate Withdrawal
            </button>
        </div>
    </div>
</div>
