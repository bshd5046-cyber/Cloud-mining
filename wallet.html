<div id="withdrawPanel" class="slide-panel">
    <div class="panel-content">
        <div class="flex justify-between items-center mb-6">
            <h3 class="text-xl font-black uppercase italic text-blue-500">Withdrawal</h3>
            <button id="closeWithdraw" class="w-10 h-10 rounded-full bg-white/5 text-white text-xl">&times;</button>
        </div>

        <div class="mini-pill rounded-2xl p-4 mb-5 border-blue-500/20 bg-blue-500/5">
            <p class="text-[8px] uppercase tracking-[0.2em] text-slate-500 font-black">Available Balance</p>
            <p id="withdrawAvailableBalance" class="text-2xl font-black mt-2 text-white">$0.00</p>
        </div>

        <div class="space-y-4">
            <div>
                <label class="text-[9px] uppercase tracking-widest text-slate-500 font-black mb-2 block ml-2">Select Network</label>
                <select id="withdrawNetwork" class="field appearance-none">
                    <option value="TRC20">USDT (TRC20) - Fast</option>
                    <option value="ERC20">USDT (ERC20) - High Fee</option>
                    <option value="BEP20">USDT (BEP20) - Low Fee</option>
                </select>
            </div>

            <div>
                <label class="text-[9px] uppercase tracking-widest text-slate-500 font-black mb-2 block ml-2">Wallet Address</label>
                <input id="withdrawAddress" type="text" class="field" placeholder="Paste your address here">
            </div>

            <div>
                <label class="text-[9px] uppercase tracking-widest text-slate-500 font-black mb-2 block ml-2">Amount (Min $10)</label>
                <input id="withdrawAmount" type="number" class="field" placeholder="0.00">
            </div>

            <div class="bg-black/40 rounded-2xl p-4 border border-white/5 space-y-2">
                <div class="flex justify-between text-[10px] font-bold uppercase tracking-tighter">
                    <span class="text-slate-500">Platform Fee (5%)</span>
                    <span id="feeAmount" class="text-red-400">$0.00</span>
                </div>
                <div class="flex justify-between text-[11px] font-black uppercase tracking-tighter pt-2 border-t border-white/5">
                    <span class="text-blue-400">Total Settlement</span>
                    <span id="finalAmount" class="text-green-400">$0.00</span>
                </div>
            </div>

            <button id="submitWithdrawBtn" class="w-full bg-blue-600 text-white py-5 rounded-2xl font-black uppercase tracking-widest mt-4 shadow-lg shadow-blue-900/20 active:scale-[0.98] transition-transform">
                Confirm Withdrawal
            </button>
        </div>
    </div>
</div>
