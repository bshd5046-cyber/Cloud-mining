<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Panel | VERTEX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body {
            background-color: #02040a;
            font-family: 'Inter', sans-serif;
            color: #e2e8f0;
            overflow-x: hidden;
        }

        .admin-card {
            background: rgba(17, 24, 39, 0.72);
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
        }

        .tab-btn.active {
            border-bottom: 2px solid #3b82f6;
            color: #3b82f6;
            opacity: 1;
        }

        .tab-btn {
            opacity: 0.45;
        }

        #authOverlay {
            position: fixed;
            inset: 0;
            background: #02040a;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .badge {
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .08em;
            padding: 6px 10px;
            border-radius: 999px;
        }

        .badge-green {
            background: rgba(34, 197, 94, 0.12);
            color: #22c55e;
            border: 1px solid rgba(34, 197, 94, 0.18);
        }

        .badge-red {
            background: rgba(239, 68, 68, 0.12);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.18);
        }

        .badge-yellow {
            background: rgba(245, 158, 11, 0.12);
            color: #f59e0b;
            border: 1px solid rgba(245, 158, 11, 0.18);
        }

        .badge-blue {
            background: rgba(59, 130, 246, 0.12);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.18);
        }

        .soft-btn {
            transition: 0.18s ease;
        }

        .soft-btn:hover {
            transform: translateY(-1px);
        }

        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }

        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div id="authOverlay">
        <div class="text-center w-full max-w-xs p-6">
            <h1 class="text-xl font-black italic uppercase text-blue-500 mb-6">Vertex <span class="text-white">Admin</span></h1>
            <div class="space-y-4">
                <input type="text" id="adminUser" placeholder="Admin Email" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm outline-none focus:border-blue-500">
                <input type="password" id="adminPass" placeholder="Access Key" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm outline-none focus:border-blue-500">
                <button id="unlockBtn" class="w-full bg-blue-600 py-3 rounded-xl font-black uppercase text-xs soft-btn">Unlock System</button>
            </div>
        </div>
    </div>

    <header class="p-6 border-b border-white/5 bg-black/20 flex justify-between items-center sticky top-0 z-50 backdrop-blur-xl">
        <div>
            <h1 class="text-xl font-black italic uppercase tracking-tighter text-blue-500">Vertex <span class="text-white">Master</span></h1>
            <p class="text-[10px] text-slate-500 font-bold uppercase tracking-widest mt-1">Admin Control Center</p>
        </div>
        <button onclick="location.reload()" class="text-[10px] font-black uppercase bg-red-500/10 text-red-500 px-4 py-2 rounded-lg soft-btn">
            Lock Panel
        </button>
    </header>

    <main class="p-6 space-y-8 max-w-7xl mx-auto">

        <section class="admin-card p-6 rounded-[2.5rem]">
            <h2 class="text-[10px] font-black uppercase mb-4 text-gray-500 tracking-widest">Global Search (UID or Phone)</h2>
            <div class="flex gap-2 mb-4 flex-col sm:flex-row">
                <input type="text" id="userSearchInput" placeholder="Enter Phone (e.g. +961...) or UID" class="flex-1 bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm outline-none focus:border-blue-500">
                <button id="searchBtn" class="bg-blue-600 px-6 py-3 rounded-xl font-black uppercase text-[10px] soft-btn">Search</button>
            </div>

            <div id="searchResult" class="hidden p-6 border border-blue-500/20 rounded-[2rem] bg-blue-500/5">
                <div class="flex justify-between items-start mb-6 gap-4 flex-col md:flex-row">
                    <div>
                        <h3 id="resName" class="text-xl font-black italic text-white">---</h3>
                        <p id="resPhone" class="text-[10px] text-blue-400 font-bold mt-1">---</p>
                        <p id="resEmail" class="text-[10px] text-slate-400 font-bold mt-1">---</p>
                        <p id="resUID" class="text-[8px] text-gray-500 font-mono mt-2 break-all">---</p>
                        <p id="resDepositAddress" class="text-[8px] text-gray-500 font-mono mt-2 break-all">---</p>
                    </div>
                    <div class="text-left md:text-right">
                        <p id="resBalance" class="text-2xl font-black text-blue-500">$0.00</p>
                        <p id="resStatus" class="text-[9px] font-bold uppercase mt-2">Status: Active</p>
                        <p id="resTier" class="text-[9px] font-bold uppercase mt-2 text-slate-400">Tier: Tier 1</p>
                    </div>
                </div>

                <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                    <button id="addMoney" class="py-3 bg-white/5 hover:bg-white/10 rounded-xl text-[9px] font-black uppercase transition border border-white/10 soft-btn">
                        + $100
                    </button>
                    <button id="subMoney" class="py-3 bg-white/5 hover:bg-white/10 rounded-xl text-[9px] font-black uppercase transition border border-white/10 soft-btn">
                        - $100
                    </button>
                    <button id="banBtn" class="py-3 bg-red-500/10 text-red-500 rounded-xl text-[9px] font-black uppercase border border-red-500/20 transition soft-btn">
                        Ban / Unban
                    </button>
                    <button id="refreshSelectedUser" class="py-3 bg-blue-500/10 text-blue-400 rounded-xl text-[9px] font-black uppercase border border-blue-500/20 transition soft-btn">
                        Refresh
                    </button>
                </div>
            </div>
        </section>

        <section>
            <div class="flex justify-between items-center mb-4 px-2">
                <h2 class="text-[10px] font-black uppercase text-gray-500 tracking-widest">Verified Users List</h2>
                <button id="refreshUsersBtn" class="text-[10px] font-black uppercase bg-blue-500/10 text-blue-400 px-4 py-2 rounded-lg soft-btn">
                    Refresh Users
                </button>
            </div>

            <div class="admin-card rounded-[2.5rem] overflow-hidden">
                <div class="max-h-[420px] overflow-y-auto">
                    <table class="w-full text-left">
                        <thead class="bg-white/5 text-[9px] uppercase text-gray-500 font-black sticky top-0">
                            <tr>
                                <th class="p-5">User / Phone</th>
                                <th class="p-5">Balance</th>
                                <th class="p-5">Status</th>
                                <th class="p-5 text-right">Action</th>
                            </tr>
                        </thead>
                        <tbody id="userListBody" class="text-xs font-bold divide-y divide-white/5"></tbody>
                    </table>
                </div>
            </div>
        </section>

        <section>
            <div class="flex gap-6 mb-4 px-2">
                <button id="tabDep" class="tab-btn active text-[10px] font-black uppercase py-2 transition tracking-widest">Deposits</button>
                <button id="tabWith" class="tab-btn text-[10px] font-black uppercase py-2 transition tracking-widest">Withdrawals</button>
            </div>

            <div class="admin-card rounded-[2.5rem] overflow-hidden">
                <div class="max-h-[520px] overflow-y-auto">
                    <table class="w-full text-left">
                        <thead class="bg-white/5 text-[9px] uppercase text-gray-500 font-black sticky top-0">
                            <tr>
                                <th class="p-5">User</th>
                                <th class="p-5">Amount</th>
                                <th class="p-5">Status</th>
                                <th class="p-5">Details</th>
                                <th class="p-5 text-right">Action</th>
                            </tr>
                        </thead>
                        <tbody id="requestTableBody" class="text-xs font-bold divide-y divide-white/5"></tbody>
                    </table>
                </div>
            </div>
        </section>

    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import {
            getFirestore,
            doc,
            getDoc,
            updateDoc,
            collection,
            collectionGroup,
            getDocs,
            query,
            where,
            runTransaction,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAmlAKs35FG4hbcaPkVQ_s0FSaZsvWzFak",
            authDomain: "cloud-mining-6f190.firebaseapp.com",
            projectId: "cloud-mining-6f190",
            storageBucket: "cloud-mining-6f190.firebasestorage.app",
            messagingSenderId: "144227180849",
            appId: "1:144227180849:web:ccbda447d074efbbddd010"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentUID = null;
        let currentRequestType = 'deposits';

        const authOverlay = document.getElementById('authOverlay');
        const unlockBtn = document.getElementById('unlockBtn');
        const userSearchInput = document.getElementById('userSearchInput');
        const searchBtn = document.getElementById('searchBtn');
        const searchResult = document.getElementById('searchResult');
        const userListBody = document.getElementById('userListBody');
        const requestTableBody = document.getElementById('requestTableBody');

        function formatMoney(value) {
            return `$${parseFloat(value || 0).toFixed(2)}`;
        }

        function getStatusBadge(status) {
            const s = String(status || '').toLowerCase();

            if (s === 'approved' || s === 'completed' || s === 'active') {
                return `<span class="badge badge-green">${status}</span>`;
            }

            if (s === 'rejected' || s === 'failed' || s === 'banned') {
                return `<span class="badge badge-red">${status}</span>`;
            }

            if (s === 'pending') {
                return `<span class="badge badge-yellow">${status}</span>`;
            }

            return `<span class="badge badge-blue">${status || 'unknown'}</span>`;
        }

        function normalizePhone(phone) {
            return String(phone || '').replace(/\s+/g, '').trim();
        }

        unlockBtn.onclick = async () => {
            const adminUser = document.getElementById('adminUser').value.trim();
            const adminPass = document.getElementById('adminPass').value.trim();

            if (adminUser === "admin.com" && adminPass === "admin123") {
                authOverlay.style.display = 'none';
                await loadAllUsers();
                await loadRequests('deposits');
            } else {
                Swal.fire({
                    title: 'Access Denied',
                    text: 'Invalid admin credentials',
                    icon: 'error',
                    background: '#0f172a',
                    color: '#fff'
                });
            }
        };

        async function loadAllUsers() {
            const snap = await getDocs(collection(db, "users"));
            const rows = [];

            snap.forEach(d => {
                rows.push({ id: d.id, ...d.data() });
            });

            rows.sort((a, b) => (b.balance || 0) - (a.balance || 0));

            userListBody.innerHTML = "";

            if (!rows.length) {
                userListBody.innerHTML = `
                    <tr>
                        <td colspan="4" class="p-6 text-center text-slate-500 text-xs">No users found</td>
                    </tr>
                `;
                return;
            }

            rows.forEach(u => {
                userListBody.innerHTML += `
                    <tr class="hover:bg-white/[0.02] transition">
                        <td class="p-5">
                            <div class="text-white">${u.fullName || 'No Name'}</div>
                            <div class="text-[9px] text-gray-500 font-mono">${u.phone || 'No Phone'}</div>
                        </td>
                        <td class="p-5 text-blue-400 font-black">${formatMoney(u.balance || 0)}</td>
                        <td class="p-5">${u.isBanned ? getStatusBadge('banned') : getStatusBadge('active')}</td>
                        <td class="p-5 text-right">
                            <button onclick="quickView('${u.id}')" class="text-[8px] bg-blue-600/20 text-blue-400 px-3 py-1 rounded-lg uppercase soft-btn">
                                Manage
                            </button>
                        </td>
                    </tr>
                `;
            });
        }

        async function searchUser() {
            const input = userSearchInput.value.trim();

            if (!input) return;

            let userDoc = null;

            const directSnap = await getDoc(doc(db, "users", input));
            if (directSnap.exists()) {
                userDoc = directSnap;
            } else {
                const q1 = query(collection(db, "users"), where("phone", "==", input));
                const qSnap1 = await getDocs(q1);

                if (!qSnap1.empty) {
                    userDoc = qSnap1.docs[0];
                } else {
                    const allUsers = await getDocs(collection(db, "users"));
                    const normalizedInput = normalizePhone(input);

                    allUsers.forEach(d => {
                        if (userDoc) return;
                        const phone = normalizePhone(d.data().phone);
                        if (phone && phone === normalizedInput) {
                            userDoc = d;
                        }
                    });
                }
            }

            if (userDoc) {
                showUserDetail(userDoc.id, userDoc.data());
            } else {
                Swal.fire({
                    title: 'Not Found',
                    text: 'No user found with this UID or phone number',
                    icon: 'warning',
                    background: '#0f172a',
                    color: '#fff'
                });
            }
        }

        searchBtn.onclick = searchUser;
        userSearchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') searchUser();
        });

        function showUserDetail(uid, d) {
            currentUID = uid;
            searchResult.classList.remove('hidden');

            document.getElementById('resName').innerText = d.fullName || 'No Name';
            document.getElementById('resPhone').innerText = "Phone: " + (d.phone || 'N/A');
            document.getElementById('resEmail').innerText = "Email: " + (d.email || 'N/A');
            document.getElementById('resUID').innerText = "UID: " + uid;
            document.getElementById('resDepositAddress').innerText = "Deposit Address: " + (d.depositAddress || 'N/A');
            document.getElementById('resBalance').innerText = formatMoney(d.balance || 0);
            document.getElementById('resTier').innerText = "Tier: " + (d.tier || 'Tier 1');

            const statusEl = document.getElementById('resStatus');
            statusEl.innerText = d.isBanned ? "Status: Banned" : "Status: Active";
            statusEl.className = `text-[9px] font-bold uppercase mt-2 ${d.isBanned ? 'text-red-500' : 'text-green-500'}`;
        }

        window.quickView = async (uid) => {
            const snap = await getDoc(doc(db, "users", uid));
            if (!snap.exists()) return;

            showUserDetail(uid, snap.data());
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        async function updateBalance(amount) {
            if (!currentUID) {
                Swal.fire({
                    title: 'No User Selected',
                    text: 'Search or select a user first',
                    icon: 'warning',
                    background: '#0f172a',
                    color: '#fff'
                });
                return;
            }

            const userRef = doc(db, "users", currentUID);
            const snap = await getDoc(userRef);

            if (!snap.exists()) return;

            const currentBalance = Number(snap.data().balance || 0);
            const newBalance = currentBalance + amount;

            if (newBalance < 0) {
                Swal.fire({
                    title: 'Invalid Operation',
                    text: 'Balance cannot go below zero',
                    icon: 'warning',
                    background: '#0f172a',
                    color: '#fff'
                });
                return;
            }

            await updateDoc(userRef, { balance: newBalance });

            showUserDetail(currentUID, { ...snap.data(), balance: newBalance });
            await loadAllUsers();
        }

        document.getElementById('addMoney').onclick = () => updateBalance(100);
        document.getElementById('subMoney').onclick = () => updateBalance(-100);
        document.getElementById('refreshUsersBtn').onclick = () => loadAllUsers();
        document.getElementById('refreshSelectedUser').onclick = async () => {
            if (!currentUID) return;
            await window.quickView(currentUID);
        };

        document.getElementById('banBtn').onclick = async () => {
            if (!currentUID) {
                Swal.fire({
                    title: 'No User Selected',
                    text: 'Search or select a user first',
                    icon: 'warning',
                    background: '#0f172a',
                    color: '#fff'
                });
                return;
            }

            const ref = doc(db, "users", currentUID);
            const snap = await getDoc(ref);
            if (!snap.exists()) return;

            await updateDoc(ref, { isBanned: !snap.data().isBanned });
            await window.quickView(currentUID);
            await loadAllUsers();
        };

        async function loadRequests(type) {
            currentRequestType = type;

            document.getElementById('tabDep').classList.toggle('active', type === 'deposits');
            document.getElementById('tabWith').classList.toggle('active', type === 'withdrawals');

            requestTableBody.innerHTML = `
                <tr>
                    <td colspan="5" class="p-6 text-center text-slate-500 text-xs">Loading...</td>
                </tr>
            `;

            if (type === 'deposits') {
                const snap = await getDocs(collectionGroup(db, "deposits"));
                const rows = [];

                snap.forEach(d => {
                    const parentUserId = d.ref.parent.parent ? d.ref.parent.parent.id : '';
                    rows.push({
                        id: d.id,
                        uid: parentUserId,
                        ...d.data()
                    });
                });

                rows.sort((a, b) => {
                    const ta = a.timestamp?.seconds || 0;
                    const tb = b.timestamp?.seconds || 0;
                    return tb - ta;
                });

                requestTableBody.innerHTML = "";

                if (!rows.length) {
                    requestTableBody.innerHTML = `
                        <tr>
                            <td colspan="5" class="p-6 text-center text-slate-500 text-xs">No deposits found</td>
                        </tr>
                    `;
                    return;
                }

                rows.slice(0, 100).forEach(data => {
                    requestTableBody.innerHTML += `
                        <tr>
                            <td class="p-5">
                                <div class="text-white font-bold">${data.fullName || data.uid || 'Unknown User'}</div>
                                <div class="text-[9px] text-gray-500 font-mono">${data.uid || ''}</div>
                            </td>
                            <td class="p-5 text-emerald-400 font-black">${formatMoney(data.amount || 0)}</td>
                            <td class="p-5">${getStatusBadge(data.status || 'completed')}</td>
                            <td class="p-5">
                                <div class="text-[9px] text-slate-400">Token: ${data.token || 'USDT'}</div>
                                <div class="text-[9px] text-slate-500 break-all">TX: ${data.txId || data.id}</div>
                            </td>
                            <td class="p-5 text-right">
                                <span class="text-[8px] text-slate-500 uppercase">Recorded</span>
                            </td>
                        </tr>
                    `;
                });
            } else {
                const snap = await getDocs(collection(db, "withdrawalRequests"));
                const rows = [];

                snap.forEach(d => {
                    rows.push({
                        id: d.id,
                        ...d.data()
                    });
                });

                rows.sort((a, b) => {
                    const ta = a.timestamp?.seconds || a.createdAt?.seconds || 0;
                    const tb = b.timestamp?.seconds || b.createdAt?.seconds || 0;
                    return tb - ta;
                });

                requestTableBody.innerHTML = "";

                if (!rows.length) {
                    requestTableBody.innerHTML = `
                        <tr>
                            <td colspan="5" class="p-6 text-center text-slate-500 text-xs">No withdrawal requests found</td>
                        </tr>
                    `;
                    return;
                }

                rows.slice(0, 100).forEach(data => {
                    const canReview = String(data.status || '').toLowerCase() === 'pending';

                    requestTableBody.innerHTML += `
                        <tr>
                            <td class="p-5">
                                <div class="text-white font-bold">${data.fullName || 'Unknown User'}</div>
                                <div class="text-[9px] text-gray-500 font-mono">${data.phone || data.email || data.uid || ''}</div>
                            </td>
                            <td class="p-5 text-blue-400 font-black">${formatMoney(data.amount || 0)}</td>
                            <td class="p-5">${getStatusBadge(data.status || 'pending')}</td>
                            <td class="p-5">
                                <div class="text-[9px] text-slate-400">Wallet: ${data.walletAddress || 'N/A'}</div>
                                <div class="text-[9px] text-slate-500">Balance At Request: ${formatMoney(data.userBalanceAtRequest || 0)}</div>
                                <div class="text-[9px] text-slate-500">UID: ${data.uid || ''}</div>
                            </td>
                            <td class="p-5 text-right">
                                ${
                                    canReview
                                    ? `
                                        <div class="flex gap-2 justify-end">
                                            <button onclick="approveWithdrawal('${data.id}')" class="bg-blue-600 px-3 py-1 rounded text-[8px] uppercase soft-btn">Approve</button>
                                            <button onclick="rejectWithdrawal('${data.id}')" class="bg-red-500/20 text-red-400 px-3 py-1 rounded text-[8px] uppercase soft-btn">Reject</button>
                                        </div>
                                    `
                                    : `<span class="text-[8px] text-slate-500 uppercase">Processed</span>`
                                }
                            </td>
                        </tr>
                    `;
                });
            }
        }

        async function approveWithdrawalRequest(requestId) {
            const requestRef = doc(db, "withdrawalRequests", requestId);

            await runTransaction(db, async (transaction) => {
                const requestSnap = await transaction.get(requestRef);

                if (!requestSnap.exists()) {
                    throw new Error("Request not found");
                }

                const requestData = requestSnap.data();

                if (String(requestData.status || '').toLowerCase() !== 'pending') {
                    throw new Error("Request already processed");
                }

                const userRef = doc(db, "users", requestData.uid);
                const userSnap = await transaction.get(userRef);

                if (!userSnap.exists()) {
                    throw new Error("User not found");
                }

                const userData = userSnap.data();
                const currentBalance = Number(userData.balance || 0);
                const amount = Number(requestData.amount || 0);

                if (amount <= 0) {
                    throw new Error("Invalid withdrawal amount");
                }

                if (amount > currentBalance) {
                    throw new Error("User balance is insufficient now");
                }

                transaction.update(userRef, {
                    balance: currentBalance - amount
                });

                transaction.update(requestRef, {
                    status: "approved",
                    reviewedAt: serverTimestamp(),
                    reviewedBy: "admin"
                });

                const userWithdrawalRef = doc(db, "users", requestData.uid, "withdrawals", requestId);
                transaction.update(userWithdrawalRef, {
                    status: "approved",
                    reviewedAt: serverTimestamp(),
                    reviewedBy: "admin"
                });
            });
        }

        async function rejectWithdrawalRequest(requestId, reason = "") {
            const requestRef = doc(db, "withdrawalRequests", requestId);
            const requestSnap = await getDoc(requestRef);

            if (!requestSnap.exists()) {
                throw new Error("Request not found");
            }

            const requestData = requestSnap.data();

            if (String(requestData.status || '').toLowerCase() !== 'pending') {
                throw new Error("Request already processed");
            }

            await updateDoc(requestRef, {
                status: "rejected",
                adminNote: reason,
                reviewedAt: serverTimestamp(),
                reviewedBy: "admin"
            });

            const userWithdrawalRef = doc(db, "users", requestData.uid, "withdrawals", requestId);
            await updateDoc(userWithdrawalRef, {
                status: "rejected",
                adminNote: reason,
                reviewedAt: serverTimestamp(),
                reviewedBy: "admin"
            });
        }

        window.approveWithdrawal = async (requestId) => {
            try {
                await approveWithdrawalRequest(requestId);

                Swal.fire({
                    title: 'Approved',
                    text: 'Withdrawal approved and balance deducted',
                    icon: 'success',
                    background: '#0f172a',
                    color: '#fff'
                });

                await loadRequests('withdrawals');
                await loadAllUsers();
                if (currentUID) await window.quickView(currentUID);
            } catch (error) {
                Swal.fire({
                    title: 'Approval Failed',
                    text: error.message || 'Something went wrong',
                    icon: 'error',
                    background: '#0f172a',
                    color: '#fff'
                });
            }
        };

        window.rejectWithdrawal = async (requestId) => {
            const result = await Swal.fire({
                title: 'Reject Request?',
                input: 'text',
                inputPlaceholder: 'Optional rejection note',
                showCancelButton: true,
                confirmButtonText: 'Reject',
                cancelButtonText: 'Cancel',
                background: '#0f172a',
                color: '#fff'
            });

            if (!result.isConfirmed) return;

            try {
                await rejectWithdrawalRequest(requestId, result.value || '');

                Swal.fire({
                    title: 'Rejected',
                    text: 'Withdrawal request rejected',
                    icon: 'success',
                    background: '#0f172a',
                    color: '#fff'
                });

                await loadRequests('withdrawals');
                if (currentUID) await window.quickView(currentUID);
            } catch (error) {
                Swal.fire({
                    title: 'Reject Failed',
                    text: error.message || 'Something went wrong',
                    icon: 'error',
                    background: '#0f172a',
                    color: '#fff'
                });
            }
        };

        document.getElementById('tabDep').onclick = () => loadRequests('deposits');
        document.getElementById('tabWith').onclick = () => loadRequests('withdrawals');
    </script>
</body>
</html>
