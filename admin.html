<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Panel | VERTEX PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background-color: #02040a; font-family: 'Inter', sans-serif; color: #e2e8f0; }
        .admin-card { background: rgba(17, 24, 39, 0.72); border: 1px solid rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); }
        .badge { font-size: 9px; font-weight: 800; padding: 4px 8px; border-radius: 99px; text-transform: uppercase; }
        .badge-green { background: rgba(34, 197, 94, 0.1); color: #22c55e; border: 1px solid rgba(34, 197, 94, 0.2); }
        .badge-red { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.2); }
        .badge-yellow { background: rgba(245, 158, 11, 0.1); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.2); }
    </style>
</head>
<body>

    <header class="p-6 border-b border-white/5 bg-black/20 flex justify-between items-center sticky top-0 z-50 backdrop-blur-xl">
        <div>
            <h1 class="text-xl font-black italic uppercase text-blue-500">Vertex <span class="text-white">Master</span></h1>
            <p class="text-[9px] text-slate-500 font-bold uppercase tracking-widest">Global Control Center</p>
        </div>
        <button onclick="location.reload()" class="text-[10px] font-black uppercase bg-red-500/10 text-red-500 px-4 py-2 rounded-lg">Refresh Panel</button>
    </header>

    <main class="p-6 space-y-8 max-w-7xl mx-auto">

        <section class="admin-card p-6 rounded-[2.5rem]">
            <h2 class="text-[10px] font-black uppercase mb-4 text-gray-500 tracking-widest">User Search & Management</h2>
            <div class="flex gap-2 mb-6">
                <input type="text" id="userSearchInput" placeholder="Enter Phone or UID..." class="flex-1 bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm outline-none focus:border-blue-500">
                <button id="searchBtn" class="bg-blue-600 px-6 py-3 rounded-xl font-black uppercase text-[10px]">Search User</button>
            </div>

            <div id="searchResult" class="hidden p-6 border border-blue-500/20 rounded-[2rem] bg-blue-500/5">
                <div class="flex justify-between items-start mb-6">
                    <div>
                        <h3 id="resName" class="text-xl font-black italic text-white">---</h3>
                        <p id="resPhone" class="text-[10px] text-blue-400 font-bold mt-1">---</p>
                        <p id="resUID" class="text-[8px] text-gray-500 font-mono mt-1">---</p>
                    </div>
                    <div class="text-right">
                        <p id="resBalance" class="text-2xl font-black text-blue-500">$0.00</p>
                        <p id="resStatus" class="text-[9px] font-bold uppercase mt-1 text-green-500 italic">Status: Active</p>
                    </div>
                </div>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                    <button onclick="adjustBalance(100)" class="py-3 bg-white/5 rounded-xl text-[9px] font-black uppercase border border-white/10">+ $100</button>
                    <button onclick="adjustBalance(-100)" class="py-3 bg-white/5 rounded-xl text-[9px] font-black uppercase border border-white/10">- $100</button>
                    <button id="banBtn" class="py-3 bg-red-500/10 text-red-500 rounded-xl text-[9px] font-black uppercase border border-red-500/20">Ban User</button>
                    <button onclick="location.reload()" class="py-3 bg-blue-500/10 text-blue-400 rounded-xl text-[9px] font-black uppercase border border-blue-500/20">Reset</button>
                </div>
            </div>
        </section>

        <section class="admin-card rounded-[2.5rem] overflow-hidden">
            <div class="p-6 border-b border-white/5 flex justify-between items-center">
                <h2 class="text-[10px] font-black uppercase text-gray-500 tracking-widest">Withdrawal Requests</h2>
                <button onclick="loadWithdrawals()" class="text-[10px] font-black bg-blue-500/10 text-blue-400 px-4 py-2 rounded-lg">Refresh List</button>
            </div>
            <div class="max-h-[500px] overflow-y-auto">
                <table class="w-full text-left">
                    <thead class="bg-white/5 text-[9px] uppercase text-gray-500 font-black sticky top-0">
                        <tr>
                            <th class="p-5">User Info</th>
                            <th class="p-5">Amount</th>
                            <th class="p-5">Address/Type</th>
                            <th class="p-5">Status</th>
                            <th class="p-5 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="withdrawalTableBody" class="text-xs font-bold divide-y divide-white/5">
                        </tbody>
                </table>
            </div>
        </section>

    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, updateDoc, collection, getDocs, query, where, runTransaction, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAmlAKs35FG4hbcaPkVQ_s0FSaZsvWzFak",
            authDomain: "cloud-mining-6f190.firebaseapp.com",
            projectId: "cloud-mining-6f190",
            storageBucket: "cloud-mining-6f190.firebasestorage.app",
            messagingSenderId: "144227180849",
            appId: "1:144227180849:web:ccbda447d074efbbddd010"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let currentUID = null;

        // --- نظام السحوبات (تم تعديل المسار لـ withdrawals) ---
        async function loadWithdrawals() {
            const tbody = document.getElementById('withdrawalTableBody');
            tbody.innerHTML = '<tr><td colspan="5" class="p-10 text-center opacity-50">Fetching from Firebase...</td></tr>';

            try {
                // استخدام المسار الصحيح كما في الصورة: withdrawals
                const q = query(collection(db, "withdrawals")); 
                const snap = await getDocs(q);
                tbody.innerHTML = "";

                if (snap.empty) {
                    tbody.innerHTML = '<tr><td colspan="5" class="p-10 text-center opacity-30 text-[10px]">No requests found.</td></tr>';
                    return;
                }

                snap.forEach(d => {
                    const data = d.data();
                    const id = d.id;
                    const isPending = data.status === "pending";

                    tbody.innerHTML += `
                        <tr class="hover:bg-white/[0.02] transition border-b border-white/5">
                            <td class="p-5">
                                <div class="text-white font-bold">${data.fullName || 'Unknown'}</div>
                                <div class="text-[9px] text-gray-500 font-mono">${data.email || data.uid}</div>
                            </td>
                            <td class="p-5 text-blue-400 font-black text-lg">$${data.amount}</td>
                            <td class="p-5 font-mono text-[9px]">
                                <div class="text-slate-300">Addr: ${data.address || 'N/A'}</div>
                                <div class="text-slate-500 uppercase">Type: ${data.type || 'Withdrawal'}</div>
                            </td>
                            <td class="p-5">${getStatusBadge(data.status)}</td>
                            <td class="p-5 text-right">
                                ${isPending ? `
                                    <div class="flex gap-2 justify-end">
                                        <button onclick="processWithdrawal('${id}', 'approved')" class="bg-blue-600 px-4 py-2 rounded-lg text-[10px] font-black uppercase transition hover:bg-blue-700">Approve</button>
                                        <button onclick="processWithdrawal('${id}', 'rejected')" class="bg-red-500/20 text-red-400 px-4 py-2 rounded-lg text-[10px] font-black uppercase transition hover:bg-red-500/40">Reject</button>
                                    </div>
                                ` : `<span class="text-[9px] opacity-30 font-black uppercase">Completed</span>`}
                            </td>
                        </tr>
                    `;
                });
            } catch (error) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-10 text-center text-red-500 italic">Error: ${error.message}</td></tr>`;
            }
        }

        window.processWithdrawal = async (requestId, newStatus) => {
            let reason = "";
            if (newStatus === 'rejected') {
                const { value: text } = await Swal.fire({
                    title: 'Reason for Rejection?',
                    input: 'text',
                    inputPlaceholder: 'Enter note for user...',
                    showCancelButton: true,
                    confirmButtonColor: '#ef4444',
                    background: '#02040a',
                    color: '#fff'
                });
                if (text === undefined) return;
                reason = text;
            }

            try {
                await runTransaction(db, async (transaction) => {
                    const reqRef = doc(db, "withdrawals", requestId);
                    const reqSnap = await transaction.get(reqRef);
                    if (!reqSnap.exists()) throw "Request not found";
                    
                    const data = reqSnap.data();
                    const userRef = doc(db, "users", data.uid);

                    if (newStatus === 'rejected') {
                        const userSnap = await transaction.get(userRef);
                        if (userSnap.exists()) {
                            const currentBalance = Number(userSnap.data().balance || 0);
                            transaction.update(userRef, { balance: currentBalance + Number(data.amount) });
                        }
                    }

                    transaction.update(reqRef, {
                        status: newStatus,
                        adminNote: reason,
                        processedAt: serverTimestamp()
                    });
                });

                Swal.fire({ title: 'Success', icon: 'success', background: '#02040a', color: '#fff', timer: 1500 });
                loadWithdrawals();
            } catch (e) {
                Swal.fire({ title: 'Error', text: e, icon: 'error' });
            }
        };

        // --- نظام البحث والتحكم ---
        document.getElementById('searchBtn').onclick = async () => {
            const input = document.getElementById('userSearchInput').value.trim();
            if(!input) return;

            let userDoc = await getDoc(doc(db, "users", input));
            if (!userDoc.exists()) {
                const q = query(collection(db, "users"), where("phone", "==", input));
                const qSnap = await getDocs(q);
                if (!qSnap.empty) userDoc = qSnap.docs[0];
            }

            if (userDoc && userDoc.exists()) {
                currentUID = userDoc.id;
                const d = userDoc.data();
                document.getElementById('searchResult').classList.remove('hidden');
                document.getElementById('resName').innerText = d.fullName || 'No Name';
                document.getElementById('resPhone').innerText = d.phone || 'No Phone';
                document.getElementById('resUID').innerText = "UID: " + userDoc.id;
                document.getElementById('resBalance').innerText = `$${parseFloat(d.balance || 0).toFixed(2)}`;
                document.getElementById('resStatus').innerText = d.isBanned ? "Status: Banned" : "Status: Active";
                document.getElementById('resStatus').className = d.isBanned ? "text-[9px] font-bold uppercase mt-1 text-red-500" : "text-[9px] font-bold uppercase mt-1 text-green-500";
                document.getElementById('banBtn').innerText = d.isBanned ? "Unban User" : "Ban User";
                document.getElementById('banBtn').onclick = () => toggleBan(!d.isBanned);
            } else {
                Swal.fire({ title: 'User Not Found', icon: 'warning', background: '#02040a', color: '#fff' });
            }
        };

        window.adjustBalance = async (amount) => {
            if(!currentUID) return;
            const ref = doc(db, "users", currentUID);
            const snap = await getDoc(ref);
            const newBal = (Number(snap.data().balance) || 0) + amount;
            await updateDoc(ref, { balance: newBal });
            document.getElementById('resBalance').innerText = `$${newBal.toFixed(2)}`;
            Swal.fire({ title: 'Balance Updated', icon: 'success', background: '#02040a', color: '#fff', timer: 1000, showConfirmButton: false });
        };

        async function toggleBan(status) {
            await updateDoc(doc(db, "users", currentUID), { isBanned: status });
            document.getElementById('searchBtn').click();
        }

        function getStatusBadge(s) {
            if (s === 'pending') return `<span class="badge badge-yellow">Pending</span>`;
            if (s === 'approved') return `<span class="badge badge-green">Approved</span>`;
            return `<span class="badge badge-red">Rejected</span>`;
        }

        window.onload = loadWithdrawals;
        window.loadWithdrawals = loadWithdrawals;
    </script>
</body>
</html>
