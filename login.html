<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vertex | Initialize Stellar Node</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Plus+Jakarta+Sans:wght@300;400;800&display=swap" rel="stylesheet">
    
    <style>
        :root { --brand: #3b82f6; --bg: #010208; --glass: rgba(255, 255, 255, 0.01); }
        body { 
            background: var(--bg); color: white; font-family: 'Plus Jakarta Sans', sans-serif; 
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            overflow-x: hidden; position: relative;
        }

        /* خلفية الفضاء العميق النابضة */
        .deep-space-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background: 
                radial-gradient(circle at 50% 50%, rgba(59, 130, 246, 0.08) 0%, transparent 60%),
                radial-gradient(circle at 90% 10%, rgba(30, 58, 138, 0.1) 0%, transparent 40%),
                var(--bg);
            animation: blackHolePulse 8s infinite alternate;
        }
        @keyframes blackHolePulse { 0% { opacity: 0.8; } 100% { opacity: 1; } }

        /* الاسم الكرومي البارز */
        .glass-3d-title {
            font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 2.8rem;
            text-transform: uppercase; letter-spacing: -2px;
            background: linear-gradient(135deg, #fff 30%, #3b82f6 60%, #1e3a8a 80%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(59, 130, 246, 0.5));
        }

        /* حاوية النيون المتدفق */
        .cyber-glass-box {
            background: var(--glass); border: 1px solid rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(35px); border-radius: 40px; position: relative;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.9);
        }
        .cyber-glass-box::before {
            content: ""; position: absolute; inset: -1px; border-radius: 41px; z-index: -1;
            background: linear-gradient(135deg, transparent, rgba(59, 130, 246, 0.4), transparent);
            animation: flow 4s linear infinite;
        }
        @keyframes flow { 0% { opacity: 0.2; } 50% { opacity: 0.6; } 100% { opacity: 0.2; } }

        /* الحقول البراقة */
        .bright-input {
            background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.05);
            transition: 0.4s all ease;
        }
        .bright-input:focus-within {
            border-color: var(--brand); transform: scale(1.01);
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.2);
        }

        /* حقل الإحالة الذهبي */
        .referral-glow {
            border: 1px dashed rgba(245, 158, 11, 0.5) !important;
            background: rgba(245, 158, 11, 0.02) !important;
        }

        /* زر الدخول الأبيض المشتعل */
        .btn-neon-white {
            background: #ffffff; color: #000; font-weight: 900;
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.5);
            transition: 0.3s;
        }
        .btn-neon-white:hover { box-shadow: 0 0 60px rgba(255, 255, 255, 0.8); transform: translateY(-2px); }

        .eye-btn { cursor: pointer; color: rgba(255,255,255,0.3); transition: 0.3s; }
        .eye-btn:hover { color: #3b82f6; }

        #alertBox { transform: translateY(-130%); transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        #alertBox.show { transform: translateY(0); }
    </style>
</head>
<body>
    <div class="deep-space-bg"></div>

    <div id="alertBox" class="fixed top-6 left-6 right-6 z-[500] hidden">
        <div class="p-5 rounded-2xl border border-white/10 bg-black/90 backdrop-blur-2xl flex items-center gap-4">
            <i id="alertIcon" class="fas fa-atom text-blue-500 animate-spin-slow"></i>
            <p id="alertMsg" class="text-[10px] font-black uppercase tracking-widest"></p>
        </div>
    </div>

    <div class="w-full max-w-[480px] p-6 relative z-10 flex flex-col items-center">
        
        <div class="text-center mb-10">
            <h1 class="glass-3d-title">VERTEX</h1>
            <p class="text-[10px] text-blue-400 font-bold uppercase tracking-[0.6em] mt-2">Initialize Node Protocol</p>
        </div>

        <div class="cyber-glass-box p-8 md:p-10 w-full">
            <div class="space-y-4">
                <div class="bright-input rounded-2xl flex items-center p-4">
                    <i class="fas fa-user-astronaut text-blue-500/50 mr-4 w-5"></i>
                    <input type="text" id="fullName" placeholder="FULL NAME" class="bg-transparent border-none outline-none w-full text-xs font-bold tracking-widest text-white">
                </div>

                <div class="flex gap-2">
                    <div class="bright-input rounded-2xl flex items-center px-3 py-4 w-32">
                        <select id="countryCode" class="bg-transparent border-none outline-none w-full text-[10px] font-black text-blue-400">
                            <option value="+961">🇱🇧 +961</option>
                            <option value="+966">🇸🇦 +966</option>
                            <option value="+971">🇦🇪 +971</option>
                            <option value="+20">🇪🇬 +20</option>
                            <option value="+964">🇮🇶 +964</option>
                            <option value="+962">🇯🇴 +962</option>
                            <option value="+965">🇰🇼 +965</option>
                            <option value="+974">🇶🇦 +974</option>
                            <option value="+212">🇲🇦 +212</option>
                            <option value="+213">🇩🇿 +213</option>
                            <option value="+216">🇹🇳 +216</option>
                            <option value="+973">🇧🇭 +973</option>
                            <option value="+968">🇴🇲 +968</option>
                            <option value="+218">🇱🇾 +218</option>
                            <option value="+963">🇸🇾 +963</option>
                            <option value="+970">🇵🇸 +970</option>
                            <option value="+967">🇾🇪 +967</option>
                            <option value="+249">🇸🇩 +249</option>
                            <option value="+252">🇸🇴 +252</option>
                            <option value="+222">🇲🇷 +222</option>
                        </select>
                    </div>
                    <div class="bright-input rounded-2xl flex-1 flex items-center p-4">
                        <input type="tel" id="phone" placeholder="PHONE NUMBER" class="bg-transparent border-none outline-none w-full text-xs font-bold tracking-widest text-white">
                    </div>
                </div>

                <div class="bright-input rounded-2xl flex items-center p-4">
                    <i class="fas fa-envelope text-blue-500/50 mr-4 w-5"></i>
                    <input type="email" id="email" placeholder="ACCESS EMAIL" class="bg-transparent border-none outline-none w-full text-xs font-bold tracking-widest text-white">
                </div>

                <div class="bright-input rounded-2xl flex items-center p-4">
                    <i class="fas fa-key text-blue-500/50 mr-4 w-5"></i>
                    <input type="password" id="password" placeholder="SECURE PASSWORD" class="bg-transparent border-none outline-none w-full text-xs font-bold tracking-widest text-white">
                    <i class="fas fa-eye eye-btn ml-2" onclick="showPass('password')"></i>
                </div>

                <div class="bright-input rounded-2xl flex items-center p-4">
                    <i class="fas fa-shield-check text-blue-500/50 mr-4 w-5"></i>
                    <input type="password" id="confirmPassword" placeholder="CONFIRM PASSWORD" class="bg-transparent border-none outline-none w-full text-xs font-bold tracking-widest text-white">
                    <i class="fas fa-eye eye-btn ml-2" onclick="showPass('confirmPassword')"></i>
                </div>

                <div class="bright-input referral-glow rounded-2xl flex items-center p-4">
                    <i class="fas fa-ticket text-amber-500 mr-4 w-5"></i>
                    <input type="text" id="inviteCode" placeholder="MANDATORY INVITE CODE" class="bg-transparent border-none outline-none w-full text-xs font-black text-amber-500 placeholder:text-amber-900/40">
                </div>

                <button id="signupBtn" class="btn-neon-white w-full py-5 rounded-2xl font-black uppercase tracking-widest text-[11px] mt-6">
                    ESTABLISH NODE
                </button>
            </div>

            <div class="mt-8 text-center">
                <a href="login.html" class="text-gray-600 text-[10px] font-black uppercase tracking-[0.4em] hover:text-white transition-all">Back to Terminal</a>
            </div>
        </div>

        <p class="text-center mt-10 text-gray-800 text-[9px] font-bold tracking-[0.5em]">SYSTEM v8.1.0 // Deep Space</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAmlAKs35FG4hbcaPkVQ_s0FSaZsvWzFak",
            authDomain: "cloud-mining-6f190.firebaseapp.com",
            projectId: "cloud-mining-6f190",
            storageBucket: "cloud-mining-6f190.firebasestorage.app",
            messagingSenderId: "144227180849",
            appId: "1:144227180849:web:ccbda447d074efbbddd010"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.showPass = (id) => {
            const x = document.getElementById(id);
            x.type = x.type === "password" ? "text" : "password";
        };

        function showAlert(msg) {
            const box = document.getElementById('alertBox');
            document.getElementById('alertMsg').innerText = msg;
            box.classList.remove('hidden');
            setTimeout(() => box.classList.add('show'), 10);
            setTimeout(() => {
                box.classList.remove('show');
                setTimeout(() => box.classList.add('hidden'), 500);
            }, 3000);
        }

        document.getElementById('signupBtn').addEventListener('click', async () => {
            const name = document.getElementById('fullName').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const email = document.getElementById('email').value.trim();
            const pass = document.getElementById('password').value;
            const confirm = document.getElementById('confirmPassword').value;
            const invite = document.getElementById('inviteCode').value.trim();

            if (!name || !phone || !email || !pass || !invite) {
                showAlert("CRITICAL: ALL CHANNELS MUST BE AUTHORIZED");
                return;
            }
            if (pass !== confirm) {
                showAlert("PROTOCOL ERROR: PASSWORD MISMATCH");
                return;
            }

            const btn = document.getElementById('signupBtn');
            btn.innerText = "LINKING CORE...";
            btn.disabled = true;

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, pass);
                const user = userCredential.user;
                const personalCode = user.uid.substring(0, 5).toUpperCase();

                await setDoc(doc(db, "users", user.uid), {
                    fullName: name,
                    phone: document.getElementById('countryCode').value + phone,
                    email: email,
                    referralId: personalCode,
                    inviteCode: invite,
                    balance: 0,
                    createdAt: new Date().toISOString()
                });

                showAlert("SUCCESS: NODE ESTABLISHED");
                setTimeout(() => window.location.href = "index.html", 1500);
            } catch (error) {
                btn.innerText = "ESTABLISH NODE";
                btn.disabled = false;
                showAlert(error.message.toUpperCase());
            }
        });
    </script>
</body>
</html>
