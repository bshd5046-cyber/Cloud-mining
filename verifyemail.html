<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification Protocol | VERTEX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #020617; color: white; font-family: sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
        .hex-loader { position: relative; width: 100px; height: 100px; }
        .circle { position: absolute; border: 2px solid #3b82f6; border-radius: 50%; animation: pulse 2s infinite; opacity: 0; }
        @keyframes pulse {
            0% { transform: scale(0.5); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: scale(1.5); opacity: 0; }
        }
        .success-scale { animation: success 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes success { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>

    <div class="text-center p-8">
        <div id="loaderGroup" class="mb-8 relative flex justify-center">
            <div class="hex-loader">
                <div class="circle" style="animation-delay: 0s"></div>
                <div class="circle" style="animation-delay: 0.5s"></div>
                <div class="circle" style="animation-delay: 1s"></div>
                <div class="absolute inset-0 flex items-center justify-center">
                    <i id="mainIcon" class="fas fa-shield-halved text-4xl text-blue-500"></i>
                </div>
            </div>
        </div>

        <h1 id="statusTitle" class="text-xl font-black uppercase tracking-[0.3em] mb-4">Verifying Protocol</h1>
        <p id="statusDesc" class="text-slate-500 text-xs tracking-widest uppercase">Syncing with Vertex Mainframe...</p>

        <button id="backBtn" onclick="window.location.replace('profile.html')" class="hidden mt-10 px-8 py-3 bg-blue-600 rounded-full font-bold text-[10px] uppercase tracking-widest shadow-lg shadow-blue-900/40 success-scale">
            Return to Terminal
        </button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, applyActionCode } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAmlAKs35FG4hbcaPkVQ_s0FSaZsvWzFak",
            authDomain: "cloud-mining-6f190.firebaseapp.com",
            projectId: "cloud-mining-6f190",
            storageBucket: "cloud-mining-6f190.firebasestorage.app",
            messagingSenderId: "144227180849",
            appId: "1:144227180849:web:ccbda447d074efbbddd010"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // 1. الحصول على الـ Mode و الـ ActionCode من الرابط
        const urlParams = new URLSearchParams(window.location.search);
        const mode = urlParams.get('mode');
        const actionCode = urlParams.get('oobCode');

        async function handleVerification() {
            if (mode === 'verifyEmail' && actionCode) {
                try {
                    // 2. تطبيق كود التأكيد في الفايربيز
                    await applyActionCode(auth, actionCode);
                    
                    // 3. تحديث الواجهة عند النجاح
                    setTimeout(() => {
                        document.getElementById('mainIcon').className = "fas fa-check-circle text-5xl text-emerald-400 success-scale";
                        document.getElementById('statusTitle').innerText = "Identity Confirmed";
                        document.getElementById('statusTitle').classList.add('text-emerald-400');
                        document.getElementById('statusDesc').innerText = "Access Granted to All Modules";
                        document.getElementById('backBtn').classList.remove('hidden');
                        
                        // توجيه تلقائي بعد 3 ثواني
                        setTimeout(() => window.location.replace('profile.html'), 3000);
                    }, 2000);

                } catch (error) {
                    document.getElementById('mainIcon').className = "fas fa-circle-exclamation text-5xl text-red-500";
                    document.getElementById('statusTitle').innerText = "Protocol Failed";
                    document.getElementById('statusDesc').innerText = "Link expired or already used.";
                    document.getElementById('backBtn').innerText = "Try Login Again";
                    document.getElementById('backBtn').classList.remove('hidden');
                }
            } else {
                window.location.replace('index.html');
            }
        }

        handleVerification();
    </script>
</body>
</html>
