<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VIP Casino | VERTEX PREMIER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --casino-gold: #D4AF37; 
            --luxury-black: #050505;
            --glass-gold: rgba(212, 175, 55, 0.1);
        }
        body { 
            background-color: var(--luxury-black); 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            color: #ffffff; 
            background: 
                radial-gradient(circle at 50% -20%, #2a2105 0%, transparent 60%),
                linear-gradient(180deg, #050505 0%, #0a0a0a 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* تصميم الكروت بنمط الكازينو */
        .casino-card { 
            background: linear-gradient(145deg, #0f0f0f, #1a1a1a);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 24px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .casino-card::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at top right, rgba(212, 175, 55, 0.1), transparent);
            pointer-events: none;
        }
        .casino-card:active { transform: translateY(4px); border-color: var(--casino-gold); }

        /* زر الرجوع */
        .back-btn {
            width: 45px;
            height: 45px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            transition: 0.2s;
        }
        .back-btn:active { background: rgba(212, 175, 55, 0.2); transform: translateX(-5px); }

        /* تذهيب النصوص */
        .gold-gradient-text {
            background: linear-gradient(to right, #BF953F, #FCF6BA, #B38728, #FBF5B7, #AA771C);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .play-btn {
            background: linear-gradient(135deg, #D4AF37 0%, #8A6E2F 100%);
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
            color: #000;
            font-weight: 800;
        }
    </style>
</head>
<body class="p-6">

    <div class="flex justify-between items-center mb-10 mt-4">
        <a href="profile.html" class="back-btn">
            <i class="fas fa-chevron-left text-white text-lg"></i>
        </a>
        <div class="text-right">
            <p class="text-[10px] text-zinc-500 font-bold tracking-widest uppercase">VIP Lounge</p>
            <h1 class="text-xl font-black gold-gradient-text uppercase">Casino Royale</h1>
        </div>
    </div>

    <div class="mb-10">
        <div class="bg-gradient-to-br from-zinc-900 to-black p-6 rounded-[30px] border border-zinc-800 flex justify-between items-center shadow-2xl">
            <div>
                <p class="text-[10px] text-zinc-500 font-bold uppercase mb-1">Available Credits</p>
                <h2 class="text-2xl font-black text-white">$ 12,450.00</h2>
            </div>
            <div class="w-14 h-14 bg-amber-500/10 rounded-full flex items-center justify-center border border-amber-500/20">
                <i class="fas fa-coins text-amber-500 text-2xl"></i>
            </div>
        </div>
    </div>

    <div class="space-y-6 pb-10">
        <div class="flex items-center gap-3 mb-2">
            <div class="h-[2px] w-8 bg-amber-500"></div>
            <h3 class="text-xs font-black uppercase tracking-widest text-zinc-400">Main Lobby</h3>
        </div>

        <div class="casino-card p-6">
            <div class="flex justify-between items-start mb-6">
                <div class="w-16 h-16 bg-blue-500/10 rounded-2xl flex items-center justify-center border border-blue-500/20">
                    <i class="fas fa-rocket text-3xl text-blue-400"></i>
                </div>
                <span class="bg-zinc-800 text-[9px] font-black px-3 py-1 rounded-full text-zinc-400 uppercase tracking-tighter">Instant Win</span>
            </div>
            <h4 class="text-xl font-bold mb-1">Quantum Crash</h4>
            <p class="text-xs text-zinc-500 mb-6">Multipliers up to <span class="text-green-500 font-bold">x5000</span></p>
            <button onclick="location.href='crash.html'" class="play-btn w-full py-4 rounded-2xl uppercase text-[11px] tracking-widest">
                Start Betting
            </button>
        </div>

        <div class="casino-card p-6 border-purple-500/20">
            <div class="flex justify-between items-start mb-6">
                <div class="w-16 h-16 bg-purple-500/10 rounded-2xl flex items-center justify-center border border-purple-500/20">
                    <i class="fas fa-bomb text-3xl text-purple-400"></i>
                </div>
                <span class="bg-zinc-800 text-[9px] font-black px-3 py-1 rounded-full text-zinc-400 uppercase tracking-tighter">Strategy</span>
            </div>
            <h4 class="text-xl font-bold mb-1">Cyber Mines</h4>
            <p class="text-xs text-zinc-500 mb-6">Clear the field & take the gold</p>
            <button onclick="location.href='mines.html'" class="play-btn w-full py-4 rounded-2xl uppercase text-[11px] tracking-widest">
                Enter Minefield
            </button>
        </div>

        <div class="casino-card p-6 border-amber-500/20">
            <div class="flex justify-between items-start mb-6">
                <div class="w-16 h-16 bg-amber-500/10 rounded-2xl flex items-center justify-center border border-amber-500/20">
                    <i class="fas fa-dharmachakra text-3xl text-amber-500"></i>
                </div>
                <span class="bg-amber-500/20 text-[9px] font-black px-3 py-1 rounded-full text-amber-500 uppercase tracking-tighter">Daily Bonus</span>
            </div>
            <h4 class="text-xl font-bold mb-1">Lucky Spin</h4>
            <p class="text-xs text-zinc-500 mb-6">Spin the wheel of fortune</p>
            <button onclick="location.href='wheel.html'" class="play-btn w-full py-4 rounded-2xl uppercase text-[11px] tracking-widest">
                Spin Now
            </button>
        </div>

    </div>

    <div class="fixed bottom-0 left-0 right-0 h-32 bg-gradient-to-t from-amber-500/5 to-transparent pointer-events-none"></div>

</body>
</html>
