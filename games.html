<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Center | VERTEX PREMIER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg-dark: #020617; --primary: #3b82f6; --gold: #fbbf24; }
        body { 
            background-color: var(--bg-dark); 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            color: #ffffff; 
            background: radial-gradient(circle at 50% 0%, rgba(251, 191, 36, 0.08) 0%, transparent 50%), #020617;
            min-height: 100vh;
        }
        .glass-card { 
            background: rgba(15, 23, 42, 0.6); 
            backdrop-filter: blur(20px); 
            border: 1px solid rgba(255, 255, 255, 0.05); 
            transition: all 0.3s ease;
        }
        .glass-card:active { transform: scale(0.96); border-color: var(--gold); }
        
        .game-badge {
            background: linear-gradient(90deg, #fbbf24 0%, #f59e0b 100%);
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
        }

        .bottom-nav { 
            background: rgba(7, 10, 22, 0.98); 
            backdrop-filter: blur(20px); 
            border-top: 1px solid rgba(255, 255, 255, 0.05); 
            height: 85px; position: fixed; bottom: 0; left: 0; right: 0; 
            display: flex; justify-content: space-around; align-items: center; z-index: 1000; padding-bottom: 15px; 
        }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; color: #475569; text-decoration: none; font-size: 10px; font-weight: 700; }
        .nav-item i { font-size: 20px; margin-bottom: 4px; }
        .nav-item.active { color: var(--gold); }

        /* تأثيرات الإضاءة الخلفية للبطاقات */
        .glow-blue { box-shadow: 0 0 20px rgba(59, 130, 246, 0.1); }
        .glow-purple { box-shadow: 0 0 20px rgba(139, 92, 246, 0.1); }
    </style>
</head>
<body class="pb-32">

    <header class="px-6 pt-10 pb-4 flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-black tracking-tighter uppercase">Game <span class="text-amber-500">Center</span></h1>
            <p class="text-[10px] text-slate-500 font-bold tracking-[0.2em] uppercase">Play to earn assets</p>
        </div>
        <div class="w-12 h-12 rounded-2xl glass-card flex items-center justify-center text-amber-500 border-amber-500/20">
            <i class="fas fa-gamepad text-xl"></i>
        </div>
    </header>

    <div class="px-6 mb-8">
        <div class="glass-card p-4 rounded-3xl flex justify-around items-center border-amber-500/10">
            <div class="text-center">
                <p class="text-[9px] text-slate-500 font-black uppercase">Tickets</p>
                <p class="text-sm font-bold text-white">128</p>
            </div>
            <div class="h-8 w-[1px] bg-white/5"></div>
            <div class="text-center">
                <p class="text-[9px] text-slate-500 font-black uppercase">Rank</p>
                <p class="text-sm font-bold text-amber-500">Gold III</p>
            </div>
            <div class="h-8 w-[1px] bg-white/5"></div>
            <div class="text-center">
                <p class="text-[9px] text-slate-500 font-black uppercase">Points</p>
                <p class="text-sm font-bold text-white">4,250</p>
            </div>
        </div>
    </div>

    <div class="px-6 space-y-6">
        <h3 class="text-[11px] font-black text-slate-600 uppercase tracking-[0.3em] ml-2">Available Terminals</h3>

        <div class="glass-card rounded-[2.5rem] overflow-hidden relative glow-blue">
            <div class="absolute top-4 right-4 game-badge text-[8px] font-black px-3 py-1 rounded-full text-black uppercase tracking-widest">Hot</div>
            <div class="p-6">
                <div class="flex items-center gap-4 mb-4">
                    <div class="w-14 h-14 rounded-2xl bg-blue-500/10 flex items-center justify-center text-blue-400 text-2xl border border-blue-500/20">
                        <i class="fas fa-rocket"></i>
                    </div>
                    <div>
                        <h4 class="text-lg font-extrabold uppercase tracking-tight">Quantum Crash</h4>
                        <p class="text-xs text-slate-500">Multiplier up to 100x</p>
                    </div>
                </div>
                <button onclick="location.href='crash-game.html'" class="w-full py-4 bg-white/5 border border-white/5 rounded-2xl text-[10px] font-black uppercase tracking-widest active:bg-blue-600 active:text-white transition-all">
                    Initialize Terminal
                </button>
            </div>
        </div>

        <div class="glass-card rounded-[2.5rem] overflow-hidden relative glow-purple">
            <div class="p-6">
                <div class="flex items-center gap-4 mb-4">
                    <div class="w-14 h-14 rounded-2xl bg-purple-500/10 flex items-center justify-center text-purple-400 text-2xl border border-purple-500/20">
                        <i class="fas fa-bomb"></i>
                    </div>
                    <div>
                        <h4 class="text-lg font-extrabold uppercase tracking-tight">Cyber Mines</h4>
                        <p class="text-xs text-slate-500">Strategic Asset Mining</p>
                    </div>
                </div>
                <button onclick="location.href='mines-game.html'" class="w-full py-4 bg-white/5 border border-white/5 rounded-2xl text-[10px] font-black uppercase tracking-widest active:bg-purple-600 active:text-white transition-all">
                    Access Grid
                </button>
            </div>
        </div>

        <div class="glass-card rounded-[2.5rem] overflow-hidden relative">
            <div class="p-6">
                <div class="flex items-center gap-4 mb-4">
                    <div class="w-14 h-14 rounded-2xl bg-amber-500/10 flex items-center justify-center text-amber-400 text-2xl border border-amber-500/20">
                        <i class="fas fa-dharmachakra"></i>
                    </div>
                    <div>
                        <h4 class="text-lg font-extrabold uppercase tracking-tight">Vertex Wheel</h4>
                        <p class="text-xs text-slate-500">Daily Free Spin</p>
                    </div>
                </div>
                <button onclick="location.href='wheel-game.html'" class="w-full py-4 bg-white/5 border border-white/5 rounded-2xl text-[10px] font-black uppercase tracking-widest active:bg-amber-500 active:text-black transition-all">
                    Spin Now
                </button>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item"><i class="fas fa-house"></i><span>Home</span></a>
        <a href="wallet.html" class="nav-item"><i class="fas fa-wallet"></i><span>Wallet</span></a>
        <a href="profile.html" class="nav-item active"><i class="fas fa-gamepad"></i><span>Games</span></a>
        <a href="support.html" class="nav-item"><i class="fas fa-headset"></i><span>Support</span></a>
        <a href="profile.html" class="nav-item"><i class="fas fa-circle-user"></i><span>Profile</span></a>
    </nav>

    <script>
        // هنا يمكنك إضافة منطق لجلب عدد النقاط أو التذاكر من Firebase
    </script>
</body>
</html>
